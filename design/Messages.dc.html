<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · System messages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#1F1D47}
a{color:inherit}
button{font:inherit;cursor:pointer}
button,a{transition:transform 140ms cubic-bezier(0.22,1,0.36,1),background-color 200ms ease}
button:active,a:active{transform:scale(0.97)}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioBannerIn{from{transform:translateY(-130%)}to{transform:translateY(0)}}
@keyframes motioBannerOut{from{transform:translateY(0)}to{transform:translateY(-130%)}}
@keyframes motioFade{from{opacity:0}to{opacity:1}}
@keyframes motioDlgIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
@keyframes motioToast{0%{opacity:0;transform:translate(-50%,16px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
@keyframes motioTimer{from{transform:scaleX(1)}to{transform:scaleX(0)}}
</style>
</helmet>
<div style="animation: motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1); width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #1F1D47; color: #1F1D47; font-family: 'Poppins', system-ui, sans-serif; display: flex; flex-direction: column">

  <div style="position: relative; flex-shrink: 0; padding: 16px 20px 22px; color: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
    <a href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D47" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 30px; font-weight: 700">System messages</h1>
    <span style="font-size: 13px; color: #C9C5EC">Every error, warning and confirmation in Motio. Tap one to see it in action.</span>
  </div>

  <div style="position: relative; flex: 1; min-height: 0; overflow-y: auto; border-radius: 32px 32px 0 0; background: #FFFFFF; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 20px">
    <section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #6B6890">Full-screen states</h2>
      <sc-for list="{{ pages }}" as="p" hint-placeholder-count="7">
        <a href="{{ p.href }}" onClick="{{ p.go }}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; color: #1F1D47; text-decoration: none">
          <span style="width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0; background: {{ p.color }}; box-shadow: none"></span>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">{{ p.label }}</span><span style="font-size: 12px; color: #6B6890">{{ p.hint }}</span></span>
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B6890" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
      </sc-for>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #EEF0F6">
      <h2 style="margin: 0 0 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #6B6890">Banners · slide from the top</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{ banners }}" as="b" hint-placeholder-count="6">
          <button onClick="{{ b.show }}" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 20px; border: 2px solid #E3E1F3; background: #FFFFFF; color: #1F1D47; font-size: 12px; font-weight: 600"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{ b.color }}"></span>{{ b.title }}</button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #EEF0F6">
      <h2 style="margin: 0 0 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #6B6890">Toasts · rise from the bottom</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{ toasts }}" as="t" hint-placeholder-count="5">
          <button onClick="{{ t.show }}" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 20px; border: 2px solid #E3E1F3; background: #FFFFFF; color: #1F1D47; font-size: 12px; font-weight: 600"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{ t.color }}"></span>{{ t.label }}</button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #EEF0F6">
      <h2 style="margin: 0 0 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #6B6890">Dialogs · pop in the middle</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{ dialogs }}" as="d" hint-placeholder-count="5">
          <button onClick="{{ d.show }}" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 20px; border: 2px solid #E3E1F3; background: #FFFFFF; color: #1F1D47; font-size: 12px; font-weight: 600"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{ d.color }}"></span>{{ d.chip }}</button>
        </sc-for>
      </div>
    </section>
  </div>

  <sc-if value="{{ bannerOn }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 12px; right: 12px; top: 12px; z-index: 60; border-radius: 22px; background: #FFFFFF; box-shadow: 0 14px 30px rgba(20,14,70,0.35); overflow: hidden; animation: {{ bannerAnim }}">
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px">
        <span style="width: 40px; height: 40px; border-radius: 20px; flex-shrink: 0; background: {{ B.color }}; box-shadow: none; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{ B.glyph }}"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">{{ B.title }}</span><span style="font-size: 12px; line-height: 1.4; color: #4A4770">{{ B.body }}</span></span>
        <button onClick="{{ bannerAction }}" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 0; background: #EEF0F6; color: #1F1D47; font-size: 12px; font-weight: 700">{{ B.action }}</button>
      </div>
      <span aria-hidden="true" style="display: block; height: 3px; background: {{ B.color }}; transform-origin: left; animation: motioTimer 4s linear forwards"></span>
    </div>
  </sc-if>

  <sc-if value="{{ dialogOn }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 24px">
      <button aria-label="Close" onClick="{{ closeDialog }}" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(20,14,70,0.55); cursor: default; animation: motioFade 220ms ease-out"></button>
      <div role="alertdialog" aria-label="{{ D.title }}" style="position: relative; width: 100%; box-sizing: border-box; border-radius: 28px; background: #FFFFFF; padding: 24px; display: flex; flex-direction: column; gap: 10px; animation: motioDlgIn 300ms cubic-bezier(0.22, 1, 0.36, 1)">
        <span style="width: 52px; height: 52px; border-radius: 26px; background: {{ D.tint }}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{ D.color }}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{ D.glyph }}"></path></svg></span>
        <span style="font-size: 20px; font-weight: 700">{{ D.title }}</span>
        <span style="font-size: 13px; line-height: 1.5; color: #4A4770">{{ D.body }}</span>
        <div style="display: flex; gap: 10px; margin-top: 8px">
          <button onClick="{{ dialogNo }}" style="flex: 1; min-height: 48px; border-radius: 24px; border: 0; background: #EEF0F6; color: #1F1D47; font-size: 14px; font-weight: 600">{{ D.no }}</button>
          <button onClick="{{ dialogYes }}" style="flex: 1; min-height: 48px; border-radius: 24px; border: 0; background: {{ D.color }}; color: #FFFFFF; font-size: 14px; font-weight: 600">{{ D.yes }}</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 50%; bottom: 36px; z-index: 80; display: flex; align-items: center; gap: 10px; max-width: 330px; padding: 12px 18px; border-radius: 22px; background: #1F1D47; color: #FFFFFF; font-size: 13px; font-weight: 600; box-shadow: 0 10px 24px rgba(20,14,70,0.35); animation: motioToast 2600ms ease forwards"><span style="width: 10px; height: 10px; flex-shrink: 0; border-radius: 5px; background: {{ toastColor }}"></span>{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  toastShow(msg, color) {
    clearTimeout(this.toastTimer);
    this.setState({ toast: null });
    setTimeout(() => this.setState({ toast: msg, toastColor: color || '#3DBF5C' }), 30);
    this.toastTimer = setTimeout(() => this.setState({ toast: null }), 2630);
  }
  bannerShow(i) {
    clearTimeout(this.bannerTimer);
    this.setState({ banner: null, bannerOut: false });
    setTimeout(() => this.setState({ banner: i + 1 }), 30);
    this.bannerTimer = setTimeout(() => this.bannerHide(), 4030);
  }
  bannerHide() {
    clearTimeout(this.bannerTimer);
    this.setState({ bannerOut: true });
    setTimeout(() => this.setState({ banner: null, bannerOut: false }), 280);
  }
  componentWillUnmount() {
    clearTimeout(this.bannerTimer);
    clearTimeout(this.toastTimer);
  }
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const s = this.state || {};
    const G = {
      gps: 'M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21zM4 4l16 16',
      pause: 'M8 5v14M16 5v14',
      sync: 'M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2M18 3v6h-6M6 21v-6h6',
      wifi: 'M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5v.01M3 3l18 18',
      gift: 'M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z',
      flag: 'M5 21V4h11l-2 4 2 4H5',
      trash: 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',
      undo: 'M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3',
      motion: 'M4 12h4l2-5 4 10 2-5h4',
      battery: 'M3 8h15v8H3zM20 11v2M7 11v2M11 11v2',
      merge: 'M6 4v6a6 6 0 0 0 6 6h6M18 12l3 4-3 4M6 20v-4'
    };
    const banners = [
      ['GPS signal lost', 'We’ll fill in the gap when your signal is back.', '#E0A92C', G.gps, 'OK', null],
      ['Tracking paused', 'Low Power Mode is on, so Motio stopped tracking.', '#5B4FE0', G.pause, 'Resume', 'Tracking resumed'],
      ['Sync failed', '3 trips didn’t upload. We’ll retry on Wi-Fi.', '#C2412F', G.sync, 'Retry', 'All trips synced'],
      ['You’re offline', 'Changes are saved on this phone until you reconnect.', '#E0A92C', G.wifi, 'OK', null],
      ['Your week is wrapped', 'Oct 25–31 is ready to play.', '#3DBF5C', G.gift, 'Open', 'Opening your recap…'],
      ['Goal reached!', '3h 30m on the move today. Legend.', '#3DBF5C', G.flag, 'Nice', null]
    ];
    const toasts = [
      ['Trip saved', '#3DBF5C'],
      ['Couldn’t save trip. Try again', '#C2412F'],
      ['Export failed: not enough storage', '#C2412F'],
      ['Couldn’t connect to Strava', '#E0A92C'],
      ['Link copied', '#3DBF5C']
    ];
    const dialogs = [
      ['Delete trip', 'Delete this trip?', 'The 18:10 drive (31.8 km) will be removed from today and your recaps.', 'Keep it', 'Delete', '#C2412F', '#FDECEA', G.trash, 'Trip deleted'],
      ['Discard changes', 'Discard your changes?', 'You edited this trip’s type and time. Leaving now throws those edits away.', 'Keep editing', 'Discard', '#C2412F', '#FDECEA', G.undo, 'Changes discarded'],
      ['Motion access', 'Let Motio count your steps?', 'Motion & fitness access lets Motio tell walking from cycling. Nothing leaves your phone without your say.', 'Not now', 'Allow', '#3DBF5C', '#DDF5E3', G.motion, 'Motion access allowed'],
      ['Battery saver', 'Battery saver is limiting Motio', 'Your phone is stopping Motio in the background, so some trips may be missing.', 'Ignore', 'Fix it', '#5B4FE0', '#EEEBFF', G.battery, 'Opening battery settings…'],
      ['Merge trips', 'Merge these two walks?', 'Looks like one walk got split at 12:41 when you stopped for coffee.', 'Keep separate', 'Merge', '#6E8CF7', '#E7ECFF', G.merge, 'Walks merged']
    ];
    const B = s.banner ? banners[s.banner - 1] : banners[0];
    const D = s.dialog ? dialogs[s.dialog - 1] : dialogs[0];
    const page = (label, hint, file, target, color) => ({ label, hint, color, ...lk(target, file) });
    return {
      LK: { back: lk('back', 'Settings.dc.html') },
      pages: [
        page('Offline', 'No internet, retry with spinner', 'Offline.dc.html', 'offline', '#6E8CF7'),
        page('Location turned off', 'Permission denied, how to fix', 'LocationOff.dc.html', 'locationoff', '#3DBF5C'),
        page('Server error', '503 with retry and status', 'ServerError.dc.html', 'servererror', '#F2766B'),
        page('Page not found', '404, wandered off', 'NotFound.dc.html', 'notfound', '#F6C343'),
        page('Session expired', 'Logged out for safety', 'SessionExpired.dc.html', 'session', '#5B4FE0'),
        page('No moves yet', 'Empty day for new users', 'EmptyToday.dc.html', 'empty', '#4B3FD8'),
        page('Wrong password & lockout', 'Try it on the Log in screen', 'Login.dc.html', 'login', '#C2412F')
      ],
      banners: banners.map((b, i) => ({ title: b[0], color: b[2], show: () => this.bannerShow(i) })),
      bannerOn: !!s.banner,
      bannerAnim: s.bannerOut ? 'motioBannerOut 260ms ease-in forwards' : 'motioBannerIn 420ms cubic-bezier(0.34, 1.56, 0.64, 1)',
      B: { title: B[0], body: B[1], color: B[2], glyph: B[3], action: B[4] },
      bannerAction: () => { const done = B[5]; this.bannerHide(); if (done) this.toastShow(done, '#3DBF5C'); },
      toasts: toasts.map(([label, color]) => ({ label, color, show: () => this.toastShow(label, color) })),
      dialogs: dialogs.map((d, i) => ({ chip: d[0], color: d[5], show: () => this.setState({ dialog: i + 1 }) })),
      dialogOn: !!s.dialog,
      D: { title: D[1], body: D[2], no: D[3], yes: D[4], color: D[5], tint: D[6], glyph: D[7] },
      closeDialog: () => this.setState({ dialog: null }),
      dialogNo: () => this.setState({ dialog: null }),
      dialogYes: () => { this.setState({ dialog: null }); this.toastShow(D[8], D[5]); },
      hasToast: !!s.toast, toast: s.toast || '', toastColor: s.toastColor || '#3DBF5C'
    };
  }
}
</script>
</body>
</html>
