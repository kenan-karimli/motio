<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Messages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
button,a{font:inherit;cursor:pointer}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes msgBarIn{from{opacity:0;transform:translateY(110px) scale(.96)}to{opacity:1;transform:none}}
@keyframes msgDim{from{opacity:0}to{opacity:1}}
.motio-scroll::-webkit-scrollbar{display:none}
.msg-row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;border:0;background:transparent;color:var(--m-ink);text-align:left;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background-color .2s var(--m-ease)}
.msg-row+.msg-row{border-top:1px solid var(--m-soft)}
.msg-row.on{background:var(--m-soft)}
.msg-av{width:46px;height:46px;border-radius:23px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--m-soft);color:var(--m-ink);font:600 15px var(--m-font);object-fit:cover}
.msg-one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-search{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:24px;background:var(--m-card);color:var(--m-mute);transition:opacity .25s}
.msg-search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--m-ink);font:500 15px var(--m-font)}
.msg-search input::placeholder{color:var(--m-faint)}
</style>
</helmet>
<div class="m-page" style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 54px 20px 0">
  <sc-if value="{{ notSelecting }}" hint-placeholder-val="{{ true }}">
    <div class="m-topbar"><a class="m-icon" href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back"><m-ic n="back"></m-ic></a><span class="m-tt">Messages</span><button type="button" class="m-icon ink" onClick="{{ openNew }}" aria-label="New message"><m-ic n="edit" s="17"></m-ic></button></div>
  </sc-if>
  <sc-if value="{{ selecting }}" hint-placeholder-val="{{ false }}">
    <div class="m-topbar"><button type="button" class="m-icon" onClick="{{ endSelect }}" aria-label="Stop selecting"><m-ic n="x"></m-ic></button><span class="m-h3" style="flex: 1; text-align: center" aria-live="polite">{{ selLabel }}</span><button type="button" class="m-chip" style="height: 36px; font-size: 13px" onClick="{{ selectAll }}">{{ allLabel }}</button></div>
  </sc-if>
  <div class="motio-scroll" style="flex: 1; min-height: 0; overflow-y: auto; margin: -54px -20px 0; padding: 108px 20px 120px; display: flex; flex-direction: column; gap: 10px">
    <div class="head"><div class="t"><h1 class="m-title">messages.</h1></div></div>
    <label class="msg-search" style="opacity: {{ dimTools }}"><m-ic n="search" s="18"></m-ic><input type="search" value="{{ query }}" onInput="{{ onQuery }}" placeholder="Search" aria-label="Search chats" autocomplete="off" spellcheck="false"></label>
    <div style="display: flex; gap: 6px; opacity: {{ dimTools }}">
      <sc-for list="{{ filters }}" as="c" hint-placeholder-count="2"><button type="button" class="m-chip {{ c.cls }}" onClick="{{ c.pick }}" aria-pressed="{{ c.on }}">{{ c.label }}<sc-if value="{{ c.n }}" hint-placeholder-val="{{ false }}"><b style="font-size: 11px; color: {{ c.nc }}">{{ c.n }}</b></sc-if></button></sc-for>
    </div>
    <sc-if value="{{ hasMoving }}" hint-placeholder-val="{{ true }}">
      <span class="m-label" style="margin: 4px 4px 0">Moving now</span>
      <div style="display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; padding: 2px 4px 4px; flex-shrink: 0">
        <sc-for list="{{ moving }}" as="v" hint-placeholder-count="2">
          <button type="button" onClick="{{ v.open }}" aria-label="{{ v.aria }}" style="flex-shrink: 0; width: 62px; border: 0; padding: 0; background: transparent; color: var(--m-ink); display: flex; flex-direction: column; align-items: center; gap: 6px">
            <span style="position: relative; width: 56px; height: 56px; border-radius: 28px; box-shadow: 0 0 0 2.5px {{ v.color }}; display: flex; align-items: center; justify-content: center; background: var(--m-card); font: 600 16px var(--m-font)">
              <sc-if value="{{ v.hasAvatar }}" hint-placeholder-val="{{ false }}"><img src="{{ v.avatar }}" alt="" style="width: 50px; height: 50px; border-radius: 25px; object-fit: cover"></sc-if><sc-if value="{{ v.noAvatar }}" hint-placeholder-val="{{ true }}">{{ v.ini }}</sc-if>
              <span style="position: absolute; right: -3px; bottom: -3px; width: 22px; height: 22px; border-radius: 11px; background: {{ v.color }}; color: #fff; box-shadow: 0 0 0 2.5px var(--m-bg); display: flex; align-items: center; justify-content: center"><m-ic n="{{ v.icon }}" s="12"></m-ic></span>
            </span>
            <span class="msg-one" style="max-width: 62px; font: 600 12px var(--m-font)">{{ v.first }}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
      <div class="m-card" style="padding: 12px; display: flex; flex-direction: column; gap: 8px"><div class="m-skel" style="height: 56px"></div><div class="m-skel" style="height: 56px"></div><div class="m-skel" style="height: 56px"></div></div>
    </sc-if>
    <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">
      <div class="m-card" style="display: flex; align-items: center; gap: 12px"><m-ic n="wifioff"></m-ic><span class="m-sub" style="flex: 1">{{ error }}</span><button type="button" class="m-chip on" onClick="{{ retry }}">Retry</button></div>
    </sc-if>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <div class="m-in" style="margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
        <m-art name="chat" size="170"></m-art>
        <span class="m-h3">{{ emptyTitle }}</span>
        <span class="m-sub" style="max-width: 270px">{{ emptyText }}</span>
        <sc-if value="{{ emptyCta }}" hint-placeholder-val="{{ true }}"><button type="button" class="m-btn m-late" onClick="{{ openNew }}">Start a chat</button></sc-if>
      </div>
    </sc-if>
    <sc-if value="{{ hasRows }}" hint-placeholder-val="{{ true }}">
      <div class="m-card" style="padding: 4px 0; overflow: hidden">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
          <button type="button" class="msg-row {{ r.cls }}" onPointerDown="{{ r.down }}" onPointerUp="{{ cancelHold }}" onPointerLeave="{{ cancelHold }}" onPointerCancel="{{ cancelHold }}" onPointerMove="{{ moveHold }}" onContextMenu="{{ r.context }}" onClick="{{ r.tap }}" aria-label="{{ r.aria }}" aria-pressed="{{ r.pressed }}">
            <sc-if value="{{ selecting }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{ r.tickBg }}; color: var(--m-bg-hi); box-shadow: {{ r.tickRing }}; transition: background-color .2s"><sc-if value="{{ r.on }}" hint-placeholder-val="{{ false }}"><m-ic n="check" s="14"></m-ic></sc-if></span></sc-if>
            <sc-if value="{{ r.hasAvatar }}" hint-placeholder-val="{{ false }}"><img class="msg-av" src="{{ r.avatar }}" alt=""></sc-if><sc-if value="{{ r.noAvatar }}" hint-placeholder-val="{{ true }}"><span class="msg-av" aria-hidden="true">{{ r.ini }}</span></sc-if>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="display: flex; align-items: baseline; gap: 8px"><b class="msg-one" style="flex: 1; font-size: 15px">{{ r.name }}</b><sc-if value="{{ r.pinned }}" hint-placeholder-val="{{ false }}"><span style="color: var(--m-faint); align-self: center; display: flex"><m-ic n="pin" s="13"></m-ic></span></sc-if><span style="font: {{ r.timeFont }}; color: {{ r.timeColor }}">{{ r.time }}</span></span>
              <span style="display: flex; align-items: center; gap: 8px; min-height: 20px">
                <span class="msg-one" style="flex: 1; min-width: 0; font-size: 13px; color: {{ r.textColor }}; font-weight: {{ r.textWeight }}"><sc-if value="{{ r.hasTick }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; color: {{ r.tick.c }}; margin-right: 4px; vertical-align: -2px"><svg width="{{ r.tick.w }}" height="14" viewBox="{{ r.tick.vb }}" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="{{ r.tick.d }}"></path></svg></span></sc-if>{{ r.preview }}</span>
                <sc-if value="{{ r.muted }}" hint-placeholder-val="{{ false }}"><span style="color: var(--m-faint); display: flex" aria-label="Muted"><m-ic n="bell" s="14"></m-ic></span></sc-if>
                <sc-if value="{{ r.unread }}" hint-placeholder-val="{{ false }}"><b style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: {{ r.badgeBg }}; color: var(--m-bg-hi); font: 700 11px/20px var(--m-font); text-align: center">{{ r.unread }}</b></sc-if>
              </span>
            </span>
          </button>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{ selecting }}" hint-placeholder-val="{{ false }}">
    <div role="toolbar" aria-label="Selected chats" style="position: absolute; left: 14px; right: 14px; bottom: 24px; height: 72px; border-radius: 36px; background: var(--m-ink); color: var(--m-bg-hi); display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; box-shadow: 0 14px 40px rgba(0,0,0,.2); animation: msgBarIn .55s var(--m-spring)">
      <sc-for list="{{ actions }}" as="a" hint-placeholder-count="4">
        <button type="button" onClick="{{ a.run }}" disabled="{{ a.off }}" style="height: 100%; border: 0; background: transparent; color: {{ a.color }}; opacity: {{ a.op }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 10.5px var(--m-font)"><m-ic n="{{ a.icon }}" s="19"></m-ic>{{ a.label }}</button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ sheet }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeSheet }}" style="position: absolute; inset: 0; z-index: 20; background: rgba(15,15,15,.18); animation: msgDim .32s ease"></div>
    <div class="m-sheet" role="dialog" aria-label="{{ sheetTitle }}" style="z-index: 21; display: flex; flex-direction: column; gap: 10px; max-height: 70%; box-sizing: border-box">
      <span class="m-h2">{{ sheetTitle }}</span>
      <sc-if value="{{ confirming }}" hint-placeholder-val="{{ false }}">
        <span class="m-sub">{{ confirmText }}</span>
        <button type="button" class="m-btn wide" style="background: var(--m-warn); color: #fff; margin-top: 6px" onClick="{{ confirmRun }}">{{ confirmLabel }}</button>
        <button type="button" class="m-btn w wide" onClick="{{ closeSheet }}">Cancel</button>
      </sc-if>
      <sc-if value="{{ picking }}" hint-placeholder-val="{{ false }}">
        <div style="overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin: 0 -4px; padding: 0 4px">
          <sc-for list="{{ people }}" as="p" hint-placeholder-count="3">
            <button type="button" class="m-row" onClick="{{ p.open }}" style="border: 0; width: 100%; text-align: left; color: var(--m-ink); font: 600 15px var(--m-font)">
              <sc-if value="{{ p.hasAvatar }}" hint-placeholder-val="{{ false }}"><img src="{{ p.avatar }}" alt="" style="width: 36px; height: 36px; border-radius: 18px; object-fit: cover"></sc-if><sc-if value="{{ p.noAvatar }}" hint-placeholder-val="{{ true }}"><span style="width: 36px; height: 36px; border-radius: 18px; background: var(--m-card); display: flex; align-items: center; justify-content: center">{{ p.ini }}</span></sc-if>
              <span style="flex: 1">{{ p.name }}</span><m-ic n="chev" s="16"></m-ic>
            </button>
          </sc-for>
          <sc-if value="{{ noPeople }}" hint-placeholder-val="{{ false }}"><span class="m-sub">{{ noPeopleText }}</span><button type="button" class="m-btn wide" onClick="{{ LK.friends.go }}">Find friends</button></sc-if>
        </div>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}"><div role="status" style="position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); z-index: 30; padding: 12px 18px; border-radius: 22px; background: var(--m-ink); color: var(--m-bg-hi); font: 600 13px var(--m-font); white-space: nowrap; animation: msgDim .25s ease">{{ toast }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    const M = window.Motio;
    if (!M) return;
    this.onChats = () => this.setState({ v: Date.now(), loading: false, error: null });
    window.addEventListener('motio:chats', this.onChats);
    this.load();
    // While the list is open it is checked more often than the inbox, so new messages show up quickly.
    this.poll = setInterval(() => { if (!document.hidden) M.chats.list().catch(() => {}); }, 6000);
  }
  componentWillUnmount() { window.removeEventListener('motio:chats', this.onChats); clearInterval(this.poll); clearTimeout(this.holdT); clearTimeout(this.toastT); }
  load() {
    const M = window.Motio;
    this.setState({ loading: !M.chats.cached(), error: null });
    M.chats.list().catch((e) => this.setState({ loading: false, error: (e && e.message) || 'Couldn’t load your messages.' }));
  }
  showToast(t) { clearTimeout(this.toastT); this.setState({ toast: t }); this.toastT = setTimeout(() => this.setState({ toast: null }), 2200); }
  renderVals() {
    const emb = !!this.props.embedded;
    const nav = (t) => this.props.onNav && this.props.onNav(t);
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => { if (!emb) return; if (e && e.preventDefault) e.preventDefault(); nav(target); } });
    const s = this.state || {}, M = window.Motio, now = Date.now();
    // Sample chats for the design canvas; the app uses the server's list.
    const sample = { unread: 2, moving: [{ id: 2, name: 'Leyla', mode: 'walk' }, { id: 5, name: 'Rashad', mode: 'bike' }], chats: [
      { friend: { id: 2, name: 'Leyla' }, unread: 2, last: { mine: false, text: 'Parachute Tower, 18:00?', at: now - 20 * 60000 } },
      { friend: { id: 3, name: 'Murad' }, unread: 0, last: { mine: true, status: 'delivered', text: '3:52, not bad at all', at: now - 3 * 3600000 } },
      { friend: { id: 5, name: 'Rashad' }, unread: 0, muted: true, last: { mine: true, status: 'seen', text: 'see you at the bus stop', at: now - 2 * 86400000 } },
      { friend: { id: 6, name: 'Aysel' }, unread: 0, last: { mine: true, status: 'sent', text: 'Same time tomorrow?', at: now - 3 * 86400000 } },
      { friend: { id: 7, name: 'Nigar' }, unread: 0, last: { mine: false, text: 'Thanks for the add!', at: now - 4 * 86400000 } }] };
    const data = M ? M.chats.cached() || { chats: [], moving: [], unread: 0 } : sample;
    const sel = s.sel || null, selecting = !!sel;
    const filter = s.filter || 'all', query = String(s.query || '').trim().toLowerCase();
    const ini = (n) => String(n || '?').trim().charAt(0).toUpperCase();
    const first = (n) => String(n || '').split(' ')[0];
    const when = (t) => { const d = new Date(t), today = new Date(); today.setHours(0, 0, 0, 0);
      if (t >= today.getTime()) return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      if (t >= today.getTime() - 6 * 86400000) return d.toLocaleDateString('en-GB', { weekday: 'short' });
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
    const TICK = { sent: { w: 14, vb: '0 0 24 24', d: 'M5 12.5l4.5 4.5L19 7', c: 'var(--m-faint)' }, delivered: { w: 18, vb: '0 0 30 24', d: 'M3 12.5l4.5 4.5L17 7M13 16l1 1L23.5 7', c: 'var(--m-faint)' } };
    TICK.seen = { ...TICK.delivered, c: 'var(--m-ink)' };
    const MODE = { walk: ['walk', 'walking'], run: ['run', 'running'], bike: ['bike', 'cycling'], transit: ['bus', 'on the bus'], drive: ['car', 'driving'] };
    const openChat = (id) => { window.__motioChat = id; nav('chat'); };

    const all = data.chats;
    const shown = all.filter((c) => (filter !== 'unread' || c.unread > 0) && (filter !== 'pinned' || c.pinned)
      && (!query || c.friend.name.toLowerCase().includes(query) || (c.last && String(c.last.text || '').toLowerCase().includes(query))));
    const toggle = (id) => { const n = new Set(sel); if (n.has(id)) n.delete(id); else n.add(id); this.setState({ sel: n.size ? n : null }); };
    this.holdStart = (id, e) => {
      if (e && e.pointerType === 'mouse' && e.button !== 0) return;
      clearTimeout(this.holdT); this.held = false; this.holdXY = e ? [e.clientX, e.clientY] : null;
      this.holdT = setTimeout(() => { this.held = true; if (navigator.vibrate) navigator.vibrate(12); const n = new Set(sel || []); n.add(id); this.setState({ sel: n }); }, 450);
    };
    const rows = shown.map((c) => {
      const id = c.friend.id, on = !!(sel && sel.has(id)), last = c.last, unread = c.unread || 0;
      const preview = !last ? 'No messages' : (last.mine ? 'You: ' : '') + (last.trip ? (last.text ? last.text : 'Shared a ' + ((MODE[last.trip.mode] || ['', 'trip'])[0] === 'bus' ? 'bus trip' : (M ? M.MODES[last.trip.mode].label.toLowerCase() : 'walk'))) : last.text);
      return { name: c.friend.name, ini: ini(c.friend.name), hasAvatar: !!c.friend.avatar, noAvatar: !c.friend.avatar, avatar: c.friend.avatar || '', on, cls: on ? 'on' : '', pressed: selecting ? String(on) : 'false',
        tickBg: on ? 'var(--m-ink)' : 'transparent', tickRing: on ? 'none' : 'inset 0 0 0 2px var(--m-line)',
        time: last ? when(last.at) : '', timeFont: unread ? "600 12px 'Inter Tight'" : "500 12px 'Inter Tight'", timeColor: unread ? 'var(--m-ink)' : 'var(--m-mute)',
        textColor: unread ? 'var(--m-ink)' : 'var(--m-mute)', textWeight: unread ? 600 : 500, preview,
        hasTick: !!(last && last.mine), tick: TICK[(last && last.status) || 'sent'], muted: !!c.muted, pinned: !!c.pinned, unread, badgeBg: c.muted ? 'var(--m-faint)' : 'var(--m-ink)',
        aria: c.friend.name + (unread ? ', ' + unread + ' unread' : '') + (last ? '. ' + preview + ', ' + when(last.at) : '') + (c.muted ? '. Muted' : '') + (c.pinned ? '. Pinned' : ''),
        down: (e) => this.holdStart(id, e),
        context: (e) => { if (e && e.preventDefault) e.preventDefault(); },
        tap: () => { if (this.held) { this.held = false; return; } if (selecting) toggle(id); else openChat(id); } };
    });

    const ids = sel ? [...sel] : [], chosen = all.filter((c) => sel && sel.has(c.friend.id));
    const done = (p, msg) => { this.setState({ sel: null }); p.then(() => msg && this.showToast(msg)).catch((e) => this.showToast((e && e.message) || 'Couldn’t do that. Try again.')); };
    const allPinned = chosen.length && chosen.every((c) => c.pinned), allMuted = chosen.length && chosen.every((c) => c.muted);
    const actions = [
      { icon: 'pin', label: allPinned ? 'Unpin' : 'Pin', run: () => done(M.chats.pin(ids, !allPinned)) },
      { icon: 'bell', label: allMuted ? 'Unmute' : 'Mute', run: () => done(M.chats.mute(ids, allMuted ? 0 : 8), allMuted ? null : 'Muted for 8 hours') },
      { icon: 'check', label: 'Read', run: () => done(M.chats.read(ids)) },
      { icon: 'trash', label: 'Delete', color: '#FF8A78', run: () => this.setState({ sheet: 'confirm' }) }
    ].map((a) => ({ ...a, color: a.color || 'inherit', off: !ids.length || !M, op: ids.length ? 1 : 0.4 }));

    const friendsList = s.people || [];
    const moving = (data.moving || []).map((p) => { const m = MODE[p.mode] || MODE.walk;
      return { first: first(p.name), ini: ini(p.name), hasAvatar: !!p.avatar, noAvatar: !p.avatar, avatar: p.avatar || '', color: 'var(--m-' + (p.mode in MODE ? p.mode : 'walk') + ')', icon: m[0],
        aria: 'Message ' + p.name + ', ' + m[1] + ' now', open: () => openChat(p.id) }; });
    const sheet = s.sheet || null;
    const n = ids.length;
    return {
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)',
      LK: { back: lk('back', 'Recaps.dc.html'), friends: lk('friends', 'Friends.dc.html') },
      selecting, notSelecting: !selecting, selLabel: n + ' selected', allLabel: n === all.length && n ? 'Select none' : 'Select all',
      selectAll: () => this.setState({ sel: n === all.length ? null : new Set(all.map((c) => c.friend.id)) }),
      endSelect: () => this.setState({ sel: null }),
      cancelHold: () => clearTimeout(this.holdT),
      moveHold: (e) => { if (this.holdXY && e && Math.hypot(e.clientX - this.holdXY[0], e.clientY - this.holdXY[1]) > 8) clearTimeout(this.holdT); },
      dimTools: selecting ? 0.4 : 1,
      query: s.query || '', onQuery: (e) => this.setState({ query: e.target.value }),
      filters: [['all', 'All', 0], ['unread', 'Unread', data.unread], ['pinned', 'Pinned', 0]].map(([k, label, cnt]) => ({ label, n: cnt || 0, on: String(filter === k), cls: filter === k ? 'on' : '',
        nc: filter === k ? 'var(--m-on-dark-mute)' : 'var(--m-mute)', pick: () => this.setState({ filter: k }) })),
      hasMoving: moving.length > 0 && !selecting, moving,
      loading: !!s.loading && !all.length, error: s.error && !all.length ? s.error : null, retry: () => this.load(),
      empty: !s.loading && !s.error && !shown.length, emptyCta: !all.length,
      emptyTitle: all.length ? 'Nothing here' : 'No messages yet', emptyText: all.length ? (query ? 'No chats match “' + s.query.trim() + '”.' : 'No chats in this filter.') : 'Message a friend about a run, a ride or where to meet. Only friends can message you.',
      hasRows: rows.length > 0, rows, actions,
      sheet: !!sheet, confirming: sheet === 'confirm', picking: sheet === 'new',
      sheetTitle: sheet === 'confirm' ? (n === 1 ? 'Delete this chat?' : 'Delete ' + n + ' chats?') : 'New message',
      confirmText: 'The messages are removed for you only. ' + (n === 1 ? 'The chat comes back' : 'A chat comes back') + ' if a new message arrives.',
      confirmLabel: 'Delete', confirmRun: () => { this.setState({ sheet: null }); done(M.chats.remove(ids), n === 1 ? 'Chat deleted' : n + ' chats deleted'); },
      closeSheet: () => this.setState({ sheet: null }),
      openNew: () => {
        this.setState({ sheet: 'new', sel: null });
        if (M && !s.people) M.friends.board().then((r) => this.setState({ people: r.people.filter((p) => !p.me) })).catch(() => this.setState({ people: [] }));
      },
      people: friendsList.map((p) => ({ name: p.name, ini: ini(p.name), hasAvatar: !!p.avatar, noAvatar: !p.avatar, avatar: p.avatar || '', open: () => { this.setState({ sheet: null }); openChat(p.id); } })),
      noPeople: !!s.people && !friendsList.length, noPeopleText: 'Add a friend first. You can message anyone on your friends list.',
      toast: s.toast || null
    };
  }
}
</script>
</body>
</html>
