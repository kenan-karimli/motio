<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · On this day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
button,a{font:inherit;cursor:pointer}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioOdIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes motioOdSwap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes motioToast{0%{opacity:0;transform:translate(-50%,12px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
.motio-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F5FC; color: #1F1D47; font-family: 'Poppins', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex-shrink: 0; padding: 16px 20px 10px; display: flex; align-items: center; gap: 12px">
    <a href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D47" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex: 1; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.1">On this day</h1><span style="font-size: 12px; color: #6B6890">{{ dateLine }}</span></div>
  </div>

  <div class="motio-scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 6px 20px 32px; display: flex; flex-direction: column; gap: 16px">
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div style="padding: 20px; border-radius: 24px; background: #FFFFFF; font-size: 14px; line-height: 1.5; color: #4A4770">No memories for today yet. A week from your first trip, they start to show up here.</div></sc-if>
    <sc-if value="{{ hasTabs }}" hint-placeholder-val="{{ true }}">
      <div role="tablist" aria-label="How long ago" style="display: grid; grid-template-columns: repeat({{ tabCount }}, minmax(0, 1fr)); gap: 6px; padding: 4px; border-radius: 22px; background: #FFFFFF; animation: motioOdIn 480ms cubic-bezier(0.22, 1, 0.36, 1) {{ d0 }} backwards">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{ t.on }}" onClick="{{ t.pick }}" style="height: 40px; border: 0; border-radius: 18px; background: {{ t.bg }}; color: {{ t.fg }}; font-size: 13px; font-weight: 600; transition: background-color 260ms ease, color 260ms ease">{{ t.label }}</button></sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ hasCard }}" hint-placeholder-val="{{ true }}">
      <div style="position: relative; height: 430px; flex-shrink: 0">
        <span aria-hidden="true" style="position: absolute; inset: 18px 14px -6px; border-radius: 30px; background: {{ back2 }}; transform: rotate(-5deg); transition: background-color 400ms ease"></span>
        <span aria-hidden="true" style="position: absolute; inset: 10px 8px 0; border-radius: 30px; background: {{ back1 }}; transform: rotate(3deg); transition: background-color 400ms ease"></span>
        <sc-if value="{{ m0 }}" hint-placeholder-val="{{ true }}"><dc-import name="MemoryCard" memo="{{ memA }}" hint-size="350px,420px"></dc-import></sc-if>
        <sc-if value="{{ m1 }}" hint-placeholder-val="{{ false }}"><dc-import name="MemoryCard" memo="{{ memB }}" hint-size="350px,420px"></dc-import></sc-if>
        <sc-if value="{{ m2 }}" hint-placeholder-val="{{ false }}"><dc-import name="MemoryCard" memo="{{ memC }}" hint-size="350px,420px"></dc-import></sc-if>
      </div>
      <section style="padding: 16px 18px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px; animation: motioOdIn 480ms cubic-bezier(0.22, 1, 0.36, 1) {{ d1 }} backwards">
        <span style="font-size: 15px; font-weight: 700">Then and now</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; animation: motioOdSwap 360ms ease-out">
          <span style="padding: 10px 12px; border-radius: 16px; background: #F6F5FC; display: flex; flex-direction: column"><span style="font-size: 11px; color: #6B6890">That day</span><span style="font-size: 18px; font-weight: 700">{{ then }}</span></span>
          <span style="padding: 10px 12px; border-radius: 16px; background: #DDF5E3; display: flex; flex-direction: column"><span style="font-size: 11px; color: #1E7A36">Today so far</span><span style="font-size: 18px; font-weight: 700">{{ now }}</span></span>
        </div>
      </section>
      <button type="button" onClick="{{ share }}" style="height: 52px; flex-shrink: 0; border: 0; border-radius: 26px; background: #1F1D47; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F6C343" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"></path></svg>Share this memory</button>
    </sc-if>
  </div>
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 50%; bottom: 28px; z-index: 50; padding: 12px 18px; border-radius: 18px; background: #1F1D47; color: #FFFFFF; font-size: 13px; font-weight: 500; white-space: nowrap; animation: motioToast 2300ms ease forwards">{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  showToast(msg) {
    clearTimeout(this.toastT);
    this.setState({ toast: null });
    setTimeout(() => this.setState({ toast: msg }), 30);
    this.toastT = setTimeout(() => this.setState({ toast: null }), 2330);
  }
  componentWillUnmount() { clearTimeout(this.toastT); }
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const s = this.state || {};
    const M = window.Motio;
    const DAY = 86400000, now = Date.now();
    const wiggle = (n) => Array.from({ length: 30 }, (_, i) => [40.40 + Math.sin(i / 4 + n) * 0.004 + i * 0.0003 * n, 49.85 + i * 0.0011, now]);
    const sample = [
      { label: '1 week', day: now - 7 * DAY, trip: { mode: 'walk', distanceM: 8200, start: now - 7 * DAY, end: now - 7 * DAY + 6060000, steps: 11240, points: wiggle(1) }, thenMin: 101, nowMin: 112 },
      { label: '1 month', day: now - 30 * DAY, trip: { mode: 'run', distanceM: 6100, start: now - 30 * DAY, end: now - 30 * DAY + 2100000, points: wiggle(2) }, thenMin: 64, nowMin: 112 },
      { label: '1 year', day: now - 365 * DAY, trip: { mode: 'bike', distanceM: 10400, start: now - 365 * DAY, end: now - 365 * DAY + 2520000, points: wiggle(3) }, thenMin: 58, nowMin: 112 }
    ];
    const list = M ? M.memories() : sample;
    const i = Math.min(list.length - 1, s.i ?? list.length - 1);
    const STY = { walk: ['#3DBF5C', '#BFEACB', '#E2F5E8'], run: ['#F2766B', '#F8C9C4', '#FDE9E6'], bike: ['#6E8CF7', '#C9D4FC', '#E6EBFE'], drive: ['#F6C343', '#FBE3A0', '#FDF1CF'], transit: ['#B57BE0', '#E2C9F2', '#F2E6FA'] };
    const KIND = { walk: 'Walk', run: 'Run', bike: 'Ride', drive: 'Drive', transit: 'Bus & train' };
    const fmtMin = (m) => { m = Math.round(m); return m >= 60 ? Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm' : m + ' min'; };
    const dist = (m) => (M ? M.fmtDist(m) : (m / 1000).toFixed(1) + ' km');
    // The trip's route, fitted into the card's drawing area.
    const pathOf = (pts) => {
      if (!pts || pts.length < 2) return 'M40 250 C 120 200, 200 260, 310 120';
      const k = Math.cos(pts[0][0] * Math.PI / 180), xs = pts.map((p) => p[1] * k), ys = pts.map((p) => -p[0]);
      const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const sc = Math.min(290 / Math.max(1e-9, maxX - minX), 200 / Math.max(1e-9, maxY - minY));
      const ox = (350 - (maxX - minX) * sc) / 2, oy = 70 + (200 - (maxY - minY) * sc) / 2;
      const step = Math.max(1, Math.floor(pts.length / 200));
      return 'M' + xs.filter((_, j) => j % step === 0).map((x, j) => ((x - minX) * sc + ox).toFixed(1) + ' ' + ((ys[j * step] - minY) * sc + oy).toFixed(1)).join(' L');
    };
    const card = (m) => {
      const t = m.trip, st = STY[t.mode] || STY.walk;
      return { when: new Date(m.day).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: m.label === '1 year' ? 'numeric' : undefined }), bg: st[0], kind: KIND[t.mode],
        big: dist(t.distanceM), line: 'Your biggest ' + KIND[t.mode].toLowerCase() + ' that day', stats: fmtMin((t.end - t.start) / 60000) + (t.steps ? ' · ' + t.steps.toLocaleString('en-US') + ' steps' : ''), path: pathOf(t.points) };
    };
    const cur = list[i];
    const st = cur ? STY[cur.trip.mode] || STY.walk : STY.walk;
    const base = emb ? 380 : 0;
    return {
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)',
      LK: { back: lk('back', 'Recaps.dc.html') },
      dateLine: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long' }) + ', through your history',
      empty: !list.length, hasTabs: list.length > 1, hasCard: !!cur, tabCount: list.length,
      d0: base + 'ms', d1: base + 200 + 'ms',
      tabs: list.map((m, k) => ({ label: m.label + ' ago', on: k === i, bg: k === i ? '#1F1D47' : 'transparent', fg: k === i ? '#FFFFFF' : '#1F1D47', pick: () => this.setState({ i: k }) })),
      back1: st[1], back2: st[2],
      m0: i === 0, m1: i === 1, m2: i === 2,
      memA: list[0] ? card(list[0]) : null, memB: list[1] ? card(list[1]) : null, memC: list[2] ? card(list[2]) : null,
      then: cur ? fmtMin(cur.thenMin) + ' moving' : '', now: cur ? fmtMin(cur.nowMin) + ' moving' : '',
      share: () => {
        if (!M || !cur) { this.showToast('Shared'); return; }
        const t = cur.trip, routes = M.route(t.start - 1, t.end + 1).filter((r) => r.id === t.id);
        M.storyImage('trip', { kicker: cur.label + ' ago', lead: KIND[t.mode], color: st[0], big: M.fmtDist(t.distanceM), routes, stats: [{ v: fmtMin((t.end - t.start) / 60000), k: 'time' }, { v: new Date(cur.day).getFullYear() + '', k: 'year' }, { v: fmtMin(cur.nowMin), k: 'today' }] })
          .then((img) => M.shareImage(img, 'share', cur.label + ' ago on Motio: ' + M.fmtDist(t.distanceM) + '.'))
          .then((r) => r && this.showToast(r)).catch(() => {});
      },
      hasToast: !!s.toast, toast: s.toast || ''
    };
  }
}
</script>
</body>
</html>
