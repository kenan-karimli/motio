<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · On this day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
button,a{font:inherit;cursor:pointer}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioOdIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes motioOdSwap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes motioToast{0%{opacity:0;transform:translate(-50%,12px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
.motio-scroll::-webkit-scrollbar{display:none}
.leaflet-control-attribution{font-size:8px!important;background:transparent!important;color:#999!important}
.leaflet-control-attribution a{color:#999!important}
</style>
</helmet>
<div class="m-page" style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden">
  <div class="m-topbar"><a class="m-icon" href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back"><m-ic n="back"></m-ic></a><span class="m-tt">On this day</span><span style="width: 44px"></span></div>
  <div class="motio-scroll" style="position: absolute; inset: 0; overflow-y: auto; padding: 108px 20px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
    <div class="head m-in" style="--i: 0"><div class="t"><span class="m-sub">{{ dateLine }}</span><h1 class="m-title">on this day.</h1></div></div>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div class="m-card m-in" style="--i: 1; padding: 20px"><span class="m-sub" style="font-size: 14px; color: var(--m-ink-2)">No memories for today yet. <b style="color: var(--m-ink)">A week from your first trip</b>, they start to show up here.</span></div></sc-if>
    <sc-if value="{{ hasCard }}" hint-placeholder-val="{{ true }}">
      <div class="m-card m-in" style="--i: 1; padding: 0; overflow: hidden">
        <div style="height: 220px; position: relative; z-index: 0; background: var(--m-soft)"><div ref="{{ mapRef }}" style="position: absolute; inset: 0"></div></div>
        <div style="padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px">
          <span class="m-label">{{ cur.kicker }}</span>
          <p style="margin: 0; font: 500 20px/1.3 var(--m-font); letter-spacing: -.3px">{{ cur.lead }} <b style="font-weight: 600">{{ cur.dist }}</b>{{ cur.tail }}</p>
          <div class="grid3"><sc-for list="{{ cur.stats }}" as="st" hint-placeholder-count="3"><div class="m-row" style="flex-direction: column; align-items: flex-start; gap: 0"><b style="font-size: 17px">{{ st.v }}</b><span class="m-sub" style="font-size: 11px">{{ st.k }}</span></div></sc-for></div>
          <span class="m-sub" style="font-size: 12px">{{ nowLine }}</span>
        </div>
      </div>
      <sc-if value="{{ hasOthers }}" hint-placeholder-val="{{ true }}">
        <div class="m-card m-in" style="--i: 2; display: flex; flex-direction: column; gap: 6px; padding: 12px">
          <sc-for list="{{ others }}" as="o" hint-placeholder-count="2">
            <button type="button" class="m-row" onClick="{{ o.pick }}" style="border: 0; width: 100%; color: var(--m-ink); text-align: left"><span class="m-dot" style="background: {{ o.color }}"></span><span style="flex: 1"><b style="font-size: 14px">{{ o.label }}</b><div class="m-sub" style="font-size: 12px">{{ o.sub }}</div></span><m-ic n="chev" s="16"></m-ic></button>
          </sc-for>
        </div>
      </sc-if>
      <span class="sp"></span>
      <div class="grid2 m-in" style="--i: 3"><button type="button" class="m-btn w" onClick="{{ openDay }}">Open the day</button><button type="button" class="m-btn" onClick="{{ share }}">Share memory</button></div>
    </sc-if>
  </div>
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 50%; bottom: 96px; z-index: 50; padding: 12px 18px; border-radius: 18px; background: var(--m-ink); color: var(--m-bg-hi); font-size: 13px; font-weight: 500; white-space: nowrap; animation: motioToast 2300ms ease forwards">{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  showToast(msg) {
    clearTimeout(this.toastT);
    this.setState({ toast: null });
    setTimeout(() => this.setState({ toast: msg }), 30);
    this.toastT = setTimeout(() => this.setState({ toast: null }), 2330);
  }
  componentWillUnmount() { clearTimeout(this.toastT); clearTimeout(this.mapT); if (this.ctrl) this.ctrl.destroy(); }
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const s = this.state || {};
    const M = window.Motio;
    const DAY = 86400000, now = Date.now();
    const wiggle = (n) => Array.from({ length: 30 }, (_, i) => [40.40 + Math.sin(i / 4 + n) * 0.004 + i * 0.0003 * n, 49.85 + i * 0.0011, now]);
    const sample = [
      { label: '1 week', day: now - 7 * DAY, trip: { mode: 'walk', distanceM: 8200, start: now - 7 * DAY, end: now - 7 * DAY + 6060000, steps: 11240, points: wiggle(1) }, thenMin: 101, nowMin: 112 },
      { label: '1 month', day: now - 30 * DAY, trip: { mode: 'run', distanceM: 6100, start: now - 30 * DAY, end: now - 30 * DAY + 2100000, points: wiggle(2) }, thenMin: 64, nowMin: 112 },
      { label: '1 year', day: now - 365 * DAY, trip: { mode: 'bike', distanceM: 10400, start: now - 365 * DAY, end: now - 365 * DAY + 2520000, points: wiggle(3) }, thenMin: 58, nowMin: 112 }
    ];
    const list = M ? M.memories() : sample;
    const i = Math.min(list.length - 1, s.i ?? list.length - 1);
    const COLOR = { walk: '#2FB457', run: '#E5604F', bike: '#4F7BF0', drive: '#E7A82A', transit: '#8E6BE0' };
    const DOT = { walk: 'var(--m-walk)', run: 'var(--m-run)', bike: 'var(--m-bike)', drive: 'var(--m-drive)', transit: 'var(--m-transit)' };
    const KIND = { walk: 'Walk', run: 'Run', bike: 'Ride', drive: 'Drive', transit: 'Bus & metro' };
    const VERB = { walk: 'You walked', run: 'You ran', bike: 'You cycled', drive: 'You drove', transit: 'You rode the bus' };
    const fmtMin = (m) => { m = Math.round(m); return m >= 60 ? Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm' : m + ' min'; };
    const dist = (m) => (M ? M.fmtDist(m) : (m / 1000).toFixed(1) + ' km');
    const cur = list[i];
    const dateOf = (m) => new Date(m.day).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: m.label === '1 year' ? 'numeric' : undefined });
    // That day's biggest trip on the map; redrawn when you pick another memory.
    if (cur && window.MotioMap && this.mapEl && this.mapFor !== i && !this.mapT) this.mapT = setTimeout(() => { this.mapT = null; if (!this.mapEl) return; if (this.ctrl) this.ctrl.destroy(); this.mapFor = i; const t = cur.trip; this.ctrl = window.MotioMap.mount(this.mapEl, t.points && t.points.length > 1 ? [{ id: 'm', mode: t.mode, color: COLOR[t.mode], start: t.start, end: t.end, points: t.points }] : []); }, this.ctrl ? 0 : 440);
    const hr = cur ? new Date(cur.trip.start).getHours() : 0;
    const when = hr < 9 ? ' early in the morning.' : hr < 12 ? ' that morning.' : hr < 17 ? ' that afternoon.' : hr < 21 ? ' that evening.' : ' that night.';
    return {
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)',
      LK: { back: lk('back', 'Recaps.dc.html') },
      mapRef: this.mapRefFn || (this.mapRefFn = (el) => { this.mapEl = el; if (el) requestAnimationFrame(() => this.setState({ mapReady: true })); }),
      dateLine: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long' }),
      empty: !list.length, hasCard: !!cur,
      cur: cur ? { kicker: cur.label.replace(/^1 /, 'One ') + ' ago · ' + dateOf(cur), lead: VERB[cur.trip.mode] || 'You moved', dist: dist(cur.trip.distanceM), tail: when,
        stats: [{ v: fmtMin(cur.thenMin), k: 'moving' }, { v: fmtMin((cur.trip.end - cur.trip.start) / 60000), k: KIND[cur.trip.mode].toLowerCase() }, cur.trip.steps ? { v: cur.trip.steps.toLocaleString('en-US'), k: 'steps' } : { v: new Date(cur.trip.start).getHours() + ':' + String(new Date(cur.trip.start).getMinutes()).padStart(2, '0'), k: 'started' }] } : { stats: [] },
      nowLine: cur ? 'Today so far: ' + fmtMin(cur.nowMin) + ' moving.' : '',
      hasOthers: list.length > 1,
      others: list.map((m, k) => ({ m, k })).filter((x) => x.k !== i).map(({ m, k }) => ({ label: m.label.replace(/^1 /, 'One ') + ' ago', color: DOT[m.trip.mode], sub: KIND[m.trip.mode] + ' · ' + dist(m.trip.distanceM) + ' · ' + dateOf(m), pick: () => this.setState({ i: k }) })),
      openDay: () => { if (!cur) return; window.__motioDay = Math.round(((M ? M.dayStart() : new Date().setHours(0, 0, 0, 0)) - cur.day) / 86400000); if (this.props.onNav) this.props.onNav('timeline'); },
      share: () => {
        if (!M || !cur) { this.showToast('Shared'); return; }
        const t = cur.trip, routes = M.route(t.start - 1, t.end + 1).filter((r) => r.id === t.id);
        M.storyImage('trip', { kicker: cur.label + ' ago', lead: KIND[t.mode], color: COLOR[t.mode], big: M.fmtDist(t.distanceM), routes, stats: [{ v: fmtMin((t.end - t.start) / 60000), k: 'time' }, { v: new Date(cur.day).getFullYear() + '', k: 'year' }, { v: fmtMin(cur.nowMin), k: 'today' }] })
          .then((img) => M.shareImage(img, 'share', cur.label + ' ago on Motio: ' + M.fmtDist(t.distanceM) + '.'))
          .then((r) => r && this.showToast(r)).catch(() => {});
      },
      hasToast: !!s.toast, toast: s.toast || ''
    };
  }
}
</script>
</body>
</html>
