<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Challenges</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
button,a,input{font:inherit;color:inherit}
button,a{cursor:pointer;text-decoration:none}
button,a{transition:transform 140ms cubic-bezier(0.22,1,0.36,1)}
button:active,a:active{transform:scale(0.97)}
button.m-row,a.m-row{border:0;width:100%;text-align:left}
.avn{background:var(--m-card);box-shadow:inset 0 0 0 1.5px var(--m-line);color:var(--m-ink);overflow:hidden}
.avn img{width:100%;height:100%;object-fit:cover}
.avme{background:var(--m-ink);color:var(--m-bg-hi)}
.m-row.me{background:var(--m-ink);color:var(--m-bg-hi)}
.m-row.me .m-sub{color:color-mix(in srgb,var(--m-bg-hi) 70%,transparent)}
.m-row.me .avme{background:var(--m-ink-2)}
.bare{flex:1;min-width:0;height:100%;border:0;padding:0;background:transparent;outline:none;font:500 15px var(--m-font);color:var(--m-ink)}
.bare::placeholder{color:var(--m-faint)}
.m-toast{position:absolute;left:50%;bottom:28px;z-index:50;padding:12px 18px;border-radius:999px;background:var(--m-ink);color:var(--m-bg-hi);font:600 13px var(--m-font);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:motioToast 2300ms ease forwards}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioToast{0%{opacity:0;transform:translate(-50%,12px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
.motio-scroll::-webkit-scrollbar{display:none}
@keyframes motioChBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes motioChRing{from{stroke-dashoffset:138.2}}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms!important;animation-iteration-count:1!important}}
.ch-seg{display:flex;padding:3px;border-radius:20px;background:var(--m-card)}
</style>
</helmet>
<div class="m-page" style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 10px 20px 0">
  <div class="m-topbar">
    <a class="m-icon" href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back"><m-ic n="back"></m-ic></a>
    <span class="m-tt">Challenges</span>
    <span class="ch-seg" role="tablist"><sc-for list="{{ segs }}" as="g" hint-placeholder-count="2"><button type="button" role="tab" aria-selected="{{ g.sel }}" class="m-chip {{ g.cls }}" onClick="{{ g.pick }}" style="height: 32px; font-size: 12px; background: {{ g.bg }}">{{ g.label }}</button></sc-for></span>
  </div>
  <div class="motio-scroll" style="flex: 1; min-height: 0; overflow-y: auto; margin: -10px -20px 0; padding: 70px 20px 40px; display: flex; flex-direction: column; gap: 10px">
    <div class="head"><div class="t"><span class="m-sub">{{ monthTitle }}</span><h1 class="m-title">challenges.</h1></div></div>
    <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}"><div role="status" class="m-card tx" style="font-size: 13px">{{ error }}</div></sc-if>

    <sc-if value="{{ hasRace }}" hint-placeholder-val="{{ true }}">
      <button type="button" class="m-card dark m-in" onClick="{{ race.open }}" aria-label="{{ race.aria }}" style="border: 0; text-align: left; display: flex; flex-direction: column; gap: 12px; padding: 20px">
        <div style="display: flex; justify-content: space-between; gap: 8px"><span class="m-label">{{ race.kicker }}</span><span class="m-sub" style="font-size: 12px; white-space: nowrap">{{ race.left }}</span></div>
        <span style="font: 600 22px/1.2 var(--m-font); letter-spacing: -.5px">{{ race.a }}<span style="color: var(--m-goal)">{{ race.b }}</span>{{ race.c }}</span>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{ race.racers }}" as="m" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 10px">
              <span class="av {{ m.avCls }}" style="width: 26px; height: 26px; font-size: 10px">{{ m.ini }}</span>
              <span style="flex: 1; height: 6px; border-radius: 3px; background: rgba(128,128,128,.25)"><i style="display: block; width: {{ m.w }}; height: 100%; border-radius: 3px; background: {{ m.c }}; transform-origin: left; animation: motioChBar 1s cubic-bezier(0.22, 1, 0.36, 1) {{ m.d }} backwards"></i></span>
              <b style="font-size: 12px; width: 60px; text-align: right; white-space: nowrap">{{ m.value }}</b>
            </div>
          </sc-for>
        </div>
      </button>
    </sc-if>

    <sc-for list="{{ races }}" as="r" hint-placeholder-count="1">
      <button type="button" class="m-card m-in" onClick="{{ r.open }}" style="--i: 1; border: 0; text-align: left; display: flex; align-items: center; gap: 14px; padding: 16px">
        <svg aria-hidden="true" width="48" height="48" viewBox="0 0 56 56" style="flex-shrink: 0; transform: rotate(-90deg)"><circle cx="28" cy="28" r="22" fill="none" stroke="var(--m-soft)" stroke-width="7"></circle><circle cx="28" cy="28" r="22" fill="none" stroke="var(--m-ink)" stroke-width="7" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="{{ r.off }}" style="animation: motioChRing 1s cubic-bezier(0.22, 1, 0.36, 1) backwards"></circle></svg>
        <span style="flex: 1; min-width: 0"><b style="font-size: 15px">{{ r.title }}</b><div class="m-sub" style="font-size: 12px">{{ r.line }}</div></span>
        <sc-if value="{{ r.invite }}" hint-placeholder-val="{{ false }}"><i aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: var(--m-accent)"></i></sc-if>
        <m-ic n="chev" s="16"></m-ic>
      </button>
    </sc-for>

    <sc-if value="{{ hasMonthly }}" hint-placeholder-val="{{ true }}"><span class="m-label" style="margin: 6px 4px 0">{{ monthLabel }}</span></sc-if>
    <sc-for list="{{ challenges }}" as="c" hint-placeholder-count="3">
      <div class="m-card m-in" style="--i: {{ c.i }}; display: flex; align-items: center; gap: 14px; padding: 16px">
        <svg aria-hidden="true" width="48" height="48" viewBox="0 0 56 56" style="flex-shrink: 0; transform: rotate(-90deg)"><circle cx="28" cy="28" r="22" fill="none" stroke="var(--m-soft)" stroke-width="7"></circle><circle cx="28" cy="28" r="22" fill="none" stroke="{{ c.ring }}" stroke-width="7" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="{{ c.off }}" style="animation: motioChRing 1s cubic-bezier(0.22, 1, 0.36, 1) {{ c.dBar }} backwards"></circle></svg>
        <span style="flex: 1; min-width: 0"><b style="font-size: 15px">{{ c.title }}</b><div class="m-sub" style="font-size: 12px">{{ c.line }}</div></span>
        <button type="button" class="m-chip {{ c.cls }}" onClick="{{ c.toggle }}" disabled="{{ c.done }}" style="height: 34px; font-size: 12px; background: {{ c.bg }}">{{ c.btn }}</button>
      </div>
    </sc-for>
    <sc-if value="{{ nothing }}" hint-placeholder-val="{{ false }}">
      <div class="m-card" style="display: flex; align-items: center; gap: 14px; padding: 16px"><m-art name="ticket" style="width: 64px; height: 64px; flex-shrink: 0"></m-art><span style="font-size: 13px">{{ nothingText }}</span></div>
    </sc-if>

    <span class="sp"></span>
    <a class="m-btn wide m-late" href="{{ LK.race.href }}" onClick="{{ newRace }}" style="margin-top: 6px"><m-ic n="plus" s="17"></m-ic>Create a challenge</a>
  </div>
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}"><div role="status" class="m-toast">{{ toast }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.load(); this.onRefresh = () => this.load(); window.addEventListener('motio:refresh', this.onRefresh); }
  componentWillUnmount() { window.removeEventListener('motio:refresh', this.onRefresh); clearTimeout(this.toastT); }
  load() {
    const M = window.Motio;
    if (!M) return;
    // Races with friends sit above the monthly challenges anyone can join.
    M.friends.challenges().then((r) => this.setState({ races: r.challenges })).catch(() => {});
    M.friends.monthly().then((data) => {
      // A badge that wasn't there before was just earned: say so.
      const had = new Set(((this.state && this.state.data) || { badges: [] }).badges.map((b) => b.key));
      const fresh = this.state && this.state.data ? data.badges.filter((b) => !had.has(b.key)) : [];
      this.setState({ data, error: null });
      if (fresh.length) this.showToast('Badge earned!');
    }).catch((e) => this.setState({ error: (e && e.message) || 'Couldn’t load challenges.' }));
  }
  showToast(msg) { clearTimeout(this.toastT); this.setState({ toast: null }); setTimeout(() => this.setState({ toast: msg }), 30); this.toastT = setTimeout(() => this.setState({ toast: null }), 2330); }
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const s = this.state || {}, M = window.Motio, now = Date.now();
    const sample = { month: '2026-11', challenges: [
      { key: '2026-11:walk100', id: 'walk100', title: 'Walk 100 km', unit: 'km', target: 100, have: 62.4, joined: true, done: false, people: 1240, ends: now + 9 * 864e5 },
      { key: '2026-11:ride200', id: 'ride200', title: 'Ride 200 km', unit: 'km', target: 200, have: 16, joined: false, done: false, people: 410, ends: now + 9 * 864e5 },
      { key: '2026-11:active30', id: 'active30', title: '30 hours on the move', unit: 'h', target: 30, have: 30.5, joined: true, done: true, people: 880, ends: now + 9 * 864e5 }],
      badges: [{ key: '2026-11:active30', id: 'active30', month: '2026-11' }, { key: '2026-10:walk100', id: 'walk100', month: '2026-10' }] };
    const D = M ? s.data : sample;
    // Each challenge has its own medal: a shape, two colours, a ribbon and an icon.
    const LOOK = {
      walk100: { shape: 'M48 4 L84 25 L84 67 L48 88 L12 67 L12 25 Z', c1: '#3DBF5C', c2: '#1E7A36', ribbon: '#2FA84D', glyph: 'M13 4a1.5 1.5 0 1 0 0-.01M10 21l2-6 3 2v4M9 11l3-3 4 3 3 1M8 14l2-3' },
      ride200: { shape: 'M48 4 a42 42 0 1 0 0.01 0 Z', c1: '#6E8CF7', c2: '#4B3FD8', ribbon: '#5B4FE0', glyph: 'M5 17a3 3 0 1 0 0-.01M19 17a3 3 0 1 0 0-.01M5 17l4-7h6l4 7M9 10l-1-3H6M15 10l-2 7' },
      active30: { shape: 'M48 4 L84 16 L84 48 C84 70 66 84 48 90 C30 84 12 70 12 48 L12 16 Z', c1: '#F6C343', c2: '#F2766B', ribbon: '#E0A92C', glyph: 'M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z' }
    };
    const HEX = 'M48 4 L84 25 L84 67 L48 88 L12 67 L12 25 Z', CIRCLE = 'M48 4 a42 42 0 1 0 0.01 0 Z', SHIELD = 'M48 4 L84 16 L84 48 C84 70 66 84 48 90 C30 84 12 70 12 48 L12 16 Z';
    const STAR = 'M48 4 L59 30 L88 32 L66 51 L73 80 L48 65 L23 80 L30 51 L8 32 L37 30 Z', SQUARE = 'M30 8 H66 Q86 8 86 28 V64 Q86 84 66 84 H30 Q10 84 10 64 V28 Q10 8 30 8 Z';
    Object.assign(LOOK, {
      run50: { shape: STAR, c1: '#F2766B', c2: '#C2412F', ribbon: '#D9534A', glyph: 'M15 4a1.5 1.5 0 1 0 0-.01M6 20l4-5 3 2 2 4M10 15l2-6 4 2 3-2M5 10l4-2 3 1' },
      steps300: { shape: CIRCLE, c1: '#5CE1B9', c2: '#2FA84D', ribbon: '#2FA84D', glyph: 'M8 3c2 0 3 2 3 5s-1 5-3 5-3-2-3-5 1-5 3-5zM6 15h4v2a2 2 0 0 1-4 0zM16 7c2 0 3 2 3 5s-1 5-3 5-3-2-3-5 1-5 3-5zM14 19h4' },
      carfree10: { shape: SQUARE, c1: '#3DBF5C', c2: '#1E7A36', ribbon: '#2FA84D', glyph: 'M5 21c0-9 5-15 15-16-1 10-7 15-15 16zM5 21c3-5 6-8 10-11' },
      days20: { shape: HEX, c1: '#8C7CF0', c2: '#4B3FD8', ribbon: '#5B4FE0', glyph: 'M4 6h16v14H4zM4 10h16M9 3v4M15 3v4M8 14h2M12 14h2M16 14h0' },
      early8: { shape: CIRCLE, c1: '#F8D06A', c2: '#F08B4C', ribbon: '#E0A92C', glyph: 'M4 18h16M7 18a5 5 0 0 1 10 0M12 7v3M5.5 10.5l2 2M18.5 10.5l-2 2' },
      weekend25: { shape: SHIELD, c1: '#F06595', c2: '#B5307A', ribbon: '#C2417F', glyph: 'M3 20l6-12 4 6 3-4 5 10z' },
      bus15: { shape: SQUARE, c1: '#B57BE0', c2: '#7A3FB0', ribbon: '#8B4FC4', glyph: 'M6 4h12v11H6zM6 10h12M8 19l-2 2M16 19l2 2M9 15.5v.5M15 15.5v.5' }
    });
    const LOCKED = { c1: '#3A3668', c2: '#2D2A6E', ribbon: '#2D2A6E' };
    const monthName = (k) => new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    const daysLeft = (t) => Math.max(0, Math.ceil((t - now) / 864e5));
    const base = emb ? 380 : 0;
    const list = D ? D.challenges : [];
    const earned = D ? D.badges : [];
    const thisMonth = new Set(earned.filter((b) => D && b.month === D.month).map((b) => b.id));
    // Badges: this month's three (locked until earned), then the ones from earlier months.
    const shelf = [...list.map((c) => ({ id: c.id, month: D.month, got: thisMonth.has(c.id) })), ...earned.filter((b) => b.month !== D.month).map((b) => ({ id: b.id, month: b.month, got: true }))];
    const TITLE = { walk100: 'Walker', ride200: 'Rider', active30: 'Mover', run50: 'Runner', steps300: 'Stepper', carfree10: 'Car-free', days20: 'Regular', early8: 'Early riser', weekend25: 'Weekender', bus15: 'Bus regular' };
    const tab = s.tab || 'active', fin = tab === 'done';
    const races = (M ? s.races || [] : [{ id: 1, kind: 'km', target: 50, end: now + 4 * 864e5, members: [{ id: 2, name: 'Leyla', value: 39 }, { id: 1, name: 'You', me: true, value: 37.8 }, { id: 3, name: 'Murad', value: 25.5 }] }]);
    const UNIT = { km: 'km', min: 'min', runs: 'runs' };
    const NAME = { km: (t) => 'Race to ' + t + ' km', min: (t) => t + ' active minutes', runs: (t) => t + ' runs' };
    const ORD = (n) => n + (n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th');
    const ini = (n) => String(n || '?').split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    const round = (v) => Math.round(v * 10) / 10;
    const openRace = (id) => (e) => { window.__motioChallenge = id; LKrace.go(e); };
    const LKrace = lk('challenge', 'Challenge.dc.html');
    const shownRaces = races.filter((c) => !!c.done === fin);
    const lead = fin ? null : shownRaces.find((c) => !c.invited);
    const racing = lead ? lead.members.filter((m) => m.joined !== false) : [];
    const meIdx = racing.findIndex((m) => m.me), me = racing[meIdx], top = racing[0];
    const story = !lead ? ['', '', ''] : !top || top.value <= 0 ? ['No one has started yet', '', ''] : meIdx === 0 ? ['You’re ', '1st', racing[1] ? ', ' + round(top.value - racing[1].value) + ' ' + UNIT[lead.kind] + ' ahead of ' + racing[1].name.split(' ')[0] : ''] : me ? ['You’re ', ORD(meIdx + 1), ', ' + round(racing[meIdx - 1].value - me.value) + ' ' + UNIT[lead.kind] + ' behind ' + racing[meIdx - 1].name.split(' ')[0]] : [top.name.split(' ')[0] + ' leads', '', ''];
    const monthly = list.filter((c) => !!c.done === fin);
    const left = (t) => daysLeft(t) + (daysLeft(t) === 1 ? ' day left' : ' days left');
    return {
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)',
      LK: { back: lk('back', 'Recaps.dc.html'), race: LKrace },
      newRace: (e) => { window.__motioChallenge = 'new'; LKrace.go(e); },
      hasError: !!s.error && !D, error: s.error || '',
      segs: [['active', 'Active' + (races.filter((c) => !c.done).length ? ' · ' + races.filter((c) => !c.done).length : '')], ['done', 'Finished']].map(([k, label]) => ({ label, sel: k === tab ? 'true' : 'false', cls: k === tab ? 'on' : '', bg: k === tab ? 'var(--m-ink)' : 'transparent', pick: () => this.setState({ tab: k }) })),
      monthTitle: D ? monthName(D.month) : 'This month',
      hasRace: !!lead,
      race: lead ? { open: openRace(lead.id), aria: 'Open ' + NAME[lead.kind](lead.target),
        kicker: NAME[lead.kind](lead.target) + ' · ends ' + new Date(lead.end).toLocaleDateString('en-GB', { weekday: 'short' }), left: left(lead.end),
        a: story[0], b: story[1], c: story[2],
        racers: racing.slice(0, 4).map((m, i) => ({ ini: m.me ? ini(((M && M.auth.user()) || {}).name || 'You') : ini(m.name), avCls: m.me ? 'tg' : 'avn', c: m.me ? 'var(--m-goal)' : i === 0 ? 'var(--m-on-dark)' : 'var(--m-on-dark-mute)',
          w: Math.max(2, Math.min(1, m.value / lead.target) * 100).toFixed(1) + '%', value: round(m.value) + ' ' + UNIT[lead.kind], d: base + 200 + i * 90 + 'ms' })) } : { racers: [] },
      races: shownRaces.filter((c) => c !== lead).map((c) => {
        const ms = c.members.filter((m) => m.joined !== false), mine = ms.find((m) => m.me), rank = ms.indexOf(mine) + 1;
        return { title: NAME[c.kind](c.target), invite: !!c.invited, open: openRace(c.id), off: (138.2 * (1 - Math.min(1, ((mine && mine.value) || 0) / c.target))).toFixed(1),
          line: c.invited ? (c.creator || 'A friend').split(' ')[0] + ' challenged you · ' + left(c.end) : ms.length + ' people' + (rank ? ' · you’re ' + ORD(rank) : '') + ' · ' + (c.done ? 'finished' : left(c.end)) };
      }),
      hasMonthly: monthly.length > 0, monthLabel: fin ? 'Earned this month' : 'Open to everyone',
      challenges: monthly.map((c, i) => {
        const pct = Math.min(1, c.have / c.target);
        return {
          i: i + 2, title: c.title, off: (138.2 * (1 - pct)).toFixed(1), ring: c.done ? 'var(--m-goal)' : 'var(--m-ink)', dBar: base + 300 + i * 90 + 'ms',
          line: (Math.round(c.have * 10) / 10) + ' of ' + c.target + ' ' + c.unit + ' · ' + left(c.ends) + ' · ' + c.people.toLocaleString('en-US') + ' joined',
          done: !!c.done, btn: c.done ? 'Earned' : c.joined ? 'Joined' : 'Join', cls: !c.done && !c.joined ? 'on' : '', bg: c.done ? 'color-mix(in srgb, var(--m-goal) 26%, var(--m-card))' : c.joined ? 'var(--m-soft)' : 'var(--m-ink)',
          toggle: () => { if (!M || c.done) return; M.friends.joinMonthly(c.key, !c.joined).then(() => { this.showToast(c.joined ? 'Left ' + c.title : 'Joined ' + c.title); this.load(); }).catch((e) => this.showToast((e && e.message) || 'Try again.')); }
        };
      }),
      nothing: !!D && !monthly.length && !shownRaces.length,
      nothingText: fin ? 'Nothing finished yet this month. The first one feels the best.' : 'No challenges running. Start a race with your friends.',
      hasToast: !!s.toast, toast: s.toast || ''
    };
  }
}
</script>
</body>
</html>
