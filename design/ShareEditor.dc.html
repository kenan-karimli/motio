<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Share image</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
button:focus-visible,label:focus-within{outline:2px solid #5B4FE0;outline-offset:2px}
@keyframes motioShUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes motioShDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes motioShFade{from{opacity:0}to{opacity:1}}
@keyframes motioShFadeOut{from{opacity:1}to{opacity:0}}
@keyframes motioCardIn{from{opacity:.4;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
</style>
</helmet>
<div style="position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column">
  <section class="m-page" aria-label="Share image" style="position: relative; height: 100%; box-sizing: border-box; padding: 10px 20px 34px; display: flex; flex-direction: column; gap: 14px; animation: {{ sheetAnim }}">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" class="m-icon" onClick="{{ close }}" aria-label="Close"><m-ic n="x"></m-ic></button>
      <span class="m-h3">Share</span><span style="width: 44px"></span>
    </div>

    <div style="display: flex; justify-content: center">
      <div aria-label="{{ previewLabel }}" role="img" style="position: relative; width: 220px; height: {{ previewH }}; border-radius: 26px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.18); transition: height 300ms cubic-bezier(0.22, 1, 0.36, 1)">
        <div ref="{{ paintPreview }}" style="position: absolute; left: 0; top: 0; width: 360px; transform: scale(0.6111); transform-origin: 0 0; pointer-events: none"></div>
      </div>
    </div>

    <div style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 14px">
      <div role="radiogroup" aria-label="Style" style="display: flex; flex-direction: column; gap: 8px">
        <span class="m-label">Style</span>
        <div style="display: flex; gap: 6px; margin-right: -20px; overflow-x: auto; scrollbar-width: none">
          <sc-for list="{{ themes }}" as="t" hint-placeholder-count="5"><button type="button" role="radio" aria-checked="{{ t.on }}" class="m-chip {{ t.cls }}" onClick="{{ t.pick }}" style="flex-shrink: 0">{{ t.name }}</button></sc-for>
        </div>
      </div>
      <div role="group" aria-label="What the image shows" style="display: flex; flex-direction: column; gap: 8px">
        <span class="m-label">Show</span>
        <div style="display: flex; gap: 6px; flex-wrap: wrap">
          <sc-for list="{{ parts }}" as="p" hint-placeholder-count="5"><button type="button" aria-pressed="{{ p.on }}" class="m-chip {{ p.cls }}" onClick="{{ p.toggle }}"><sc-if value="{{ p.on }}" hint-placeholder-val="{{ true }}"><m-ic n="check" s="13"></m-ic></sc-if>{{ p.label }}</button></sc-for>
          <label class="m-chip {{ photoCls }}" style="position: relative; cursor: pointer"><input type="file" accept="image/*" onchange="{{ pickPhoto }}" style="position: absolute; width: 1px; height: 1px; opacity: 0"><m-ic n="image" s="13"></m-ic>{{ photoLabel }}</label>
          <sc-if value="{{ hasPhoto }}" hint-placeholder-val="{{ false }}"><button type="button" class="m-chip" onClick="{{ clearPhoto }}">Remove photo</button></sc-if>
        </div>
      </div>
      <div role="radiogroup" aria-label="Format" style="display: flex; gap: 6px">
        <sc-for list="{{ formats }}" as="f" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{ f.on }}" class="m-chip {{ f.cls }}" onClick="{{ f.pick }}" style="flex: 1; justify-content: center">{{ f.label }}</button></sc-for>
      </div>
      <div role="group" aria-label="Send to" style="display: flex; flex-direction: column; gap: 8px">
        <span class="m-label">Send to</span>
        <div style="display: flex; gap: 6px; margin-right: -20px; overflow-x: auto; scrollbar-width: none">
          <sc-for list="{{ targets }}" as="t" hint-placeholder-count="6"><button type="button" class="m-chip" onClick="{{ t.pick }}" disabled="{{ busy }}" style="flex-shrink: 0">{{ t.label }}</button></sc-for>
        </div>
      </div>
      <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}"><span role="status" class="m-sub" style="color: var(--m-warn)">{{ note }}</span></sc-if>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
      <button type="button" class="m-btn w" onClick="{{ saveImage }}" disabled="{{ busy }}">Save image</button>
      <button type="button" class="m-btn" onClick="{{ shareNow }}" disabled="{{ busy }}">Share</button>
    </div>
    <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}"><div role="status" style="position: absolute; left: 50%; top: 130px; transform: translateX(-50%); padding: 10px 16px; border-radius: 20px; background: var(--m-ink); color: var(--m-bg-hi); font: 600 12.5px var(--m-font); white-space: nowrap">Making your image…</div></sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"job":{"editor":null},"onClose":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // The style kit from stories.js (Motio.storyImage.kit). Without it (the design canvas) the sheet shows its controls only.
  kit() { const M = window.Motio; return M && M.storyImage && M.storyImage.kit; }
  look() {
    const s = this.state || {};
    if (!s.look) {
      const K = this.kit(), saved = K ? K.loadLook() : {}, job = this.props.job || {};
      // Opens on the theme you were looking at; colour, name, map and hidden stats are remembered from last time.
      return { theme: job.theme || saved.theme || 'mono', square: !!saved.square, showName: saved.showName !== false, showMap: saved.showMap !== false, hide: saved.hide || [], photo: null };
    }
    return s.look;
  }
  set(patch) { this.setState({ look: { ...this.look(), ...patch }, note: null }); }
  close(msg) {
    if (this.closing) return;
    this.closing = true;
    this.setState({ closing: true });
    setTimeout(() => { if (this.props.onClose) this.props.onClose(msg || null); }, 260);
  }
  // A phone photo is far bigger than a story needs: scale it so its long side is 1920 px before it goes in the card.
  readPhoto(file) {
    if (!file || !/^image\//.test(file.type)) { this.setState({ note: 'Pick an image file' }); return; }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1920 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      this.set({ photo: c.toDataURL('image/jpeg', 0.86) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); this.setState({ note: 'That photo couldn’t be opened. Try another one.' }); };
    img.src = url;
  }
  share(how) {
    const M = window.Motio, K = this.kit(), job = this.props.job || {}, look = this.look();
    if (!M || !K) { this.close(null); return; }
    K.saveLook(look);
    if (how === 'copy') { M.shareImage('', 'copy', job.text).then((m) => this.close(m)); return; }
    this.setState({ busy: true });
    // The share text carries a short link to this card ("Open in Motio").
    // The short link first: it's printed on the image (an image can't be tapped) and goes in the text.
    Promise.resolve(M.shareLink ? M.shareLink(job.kind, job.data) : null)
      .then((link) => (how === 'link' ? (link ? M.shareText((job.text || 'My moves on Motio') + '\n' + link).then(() => null) : Promise.reject(new Error('Can’t make a link while offline')))
        : M.storyImage(job.kind, job.data, { ...look, link }).then((img) => M.shareImage(img, how, link ? (job.text || 'Tracked with Motio.') + '\n' + link : job.text))))
      .then((m) => { this.setState({ busy: false }); this.close(m); })
      .catch((e) => { this.setState({ busy: false }); if (!/cancel/i.test(String(e && e.message))) this.setState({ note: 'Couldn’t share right now. Try again.' }); });
  }
  // Paints card markup into an element the runtime leaves alone (it has no children of its own).
  painter(html) { return (el) => { if (el && el.__card !== html) { el.innerHTML = html; el.__card = html; } }; }
  renderVals() {
    const s = this.state || {}, K = this.kit(), job = this.props.job || {}, look = this.look();
    const THEMES = K ? K.THEMES : { mono: { name: 'Mono' }, glow: { name: 'Glow' }, poster: { name: 'Poster' }, ticket: { name: 'Ticket' }, editorial: { name: 'Editorial' } };
    const theme = THEMES[look.theme] ? look.theme : Object.keys(THEMES)[0];
    const card = (o) => (K ? K.storyHTML(job.kind, job.data, o) : '');
    const flipHide = (key) => () => this.set({ hide: look.hide.includes(key) ? look.hide.filter((k) => k !== key) : [...look.hide, key] });
    const parts = (K ? K.storyParts(job.kind, job.data) : []).map((p) => ({ label: p.label, on: !look.hide.includes(p.key), flip: flipHide(p.key) }));
    const hasRoute = !!(job.data && job.data.routes && job.data.routes.some((r) => r.points && r.points.length > 1));
    if (hasRoute) parts.push({ label: 'Map', on: look.showMap, flip: () => this.set({ showMap: !look.showMap }) });
    parts.push({ label: 'Name', on: look.showName, flip: () => this.set({ showName: !look.showName }) });
    parts.push({ label: 'Date', on: !look.hide.includes('date'), flip: flipHide('date') });
    const H = look.square ? 360 : 640;
    return {
      close: () => this.close(null),
      sheetAnim: s.closing ? 'motioShDown 260ms ease-in forwards' : 'motioShUp 380ms cubic-bezier(0.22, 1, 0.36, 1)',
      previewLabel: 'Preview: ' + THEMES[theme].name + (look.square ? ' post' : ' story'), previewH: Math.round(H * 0.6111) + 'px',
      paintPreview: this.painter(card({ ...look, theme, h: H })),
      themes: Object.keys(THEMES).map((id) => ({ name: THEMES[id].name, on: theme === id, cls: theme === id ? 'on' : '', pick: () => this.set({ theme: id }) })),
      parts: parts.map((p) => ({ label: p.label, on: p.on, cls: p.on ? 'on' : '', toggle: p.flip })),
      formats: [['Story 9:16', false], ['Post 1:1', true]].map(([label, sq]) => ({ label, on: !!look.square === sq, cls: !!look.square === sq ? 'on' : '', pick: () => this.set({ square: sq }) })),
      pickPhoto: (e) => { const f = e && e.target && e.target.files && e.target.files[0]; if (f) this.readPhoto(f); if (e && e.target) e.target.value = ''; },
      hasPhoto: !!look.photo, photoCls: look.photo ? 'on' : '', photoLabel: look.photo ? 'Change photo' : 'Photo', clearPhoto: () => this.set({ photo: null }),
      hasNote: !!s.note, note: s.note || '',
      busy: !!s.busy,
      saveImage: () => this.share('save'), shareNow: () => this.share('share'),
      targets: [['Instagram story', 'story'], ['WhatsApp', 'whatsapp'], ['X', 'x'], ['Messages', 'sms'], ['Copy text', 'copy'], ['Copy link', 'link']].map(([label, how]) => ({ label, pick: () => this.share(how) }))
    };
  }
}
</script>
</body>
</html>
