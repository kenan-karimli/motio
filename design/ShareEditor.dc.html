<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Share image</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
button:focus-visible,label:focus-within{outline:2px solid #5B4FE0;outline-offset:2px}
@keyframes motioShUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes motioShDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes motioShFade{from{opacity:0}to{opacity:1}}
@keyframes motioShFadeOut{from{opacity:1}to{opacity:0}}
@keyframes motioCardIn{from{opacity:.4;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
</style>
</helmet>
<div style="position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; justify-content: flex-end; color: #1F1D47; font-family: 'Poppins', system-ui, sans-serif">

  <section aria-label="Share image" style="position: relative; height: 100%; background: #F6F5FC; display: flex; flex-direction: column; animation: {{ sheetAnim }}">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 0 20px">
      <h2 style="margin: 0; font-size: 24px; font-weight: 700">Share</h2>
      <button onClick="{{ close }}" aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F1D47" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>

    <div style="display: flex; justify-content: center; padding: 4px 0 14px">
      <div aria-label="{{ previewLabel }}" role="img" style="position: relative; width: 207px; height: 368px; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 28px rgba(31,29,71,0.28)">
        <div ref="{{ paintPreview }}" style="position: absolute; left: 0; top: 0; width: 360px; height: 640px; transform: scale(0.575); transform-origin: 0 0; pointer-events: none; animation: motioCardIn 300ms ease"></div>
      </div>
    </div>

    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 0 6px; display: flex; flex-direction: column; gap: 16px">
      <div role="tablist" aria-label="Customise" style="margin: 0 20px; display: flex; padding: 4px; border-radius: 18px; background: #FFFFFF">
        <sc-for list="{{ tabs }}" as="g" hint-placeholder-count="4"><button type="button" role="tab" aria-selected="{{ g.on }}" onClick="{{ g.pick }}" style="flex: 1; height: 36px; border: 0; border-radius: 14px; background: {{ g.bg }}; color: {{ g.fg }}; font-size: 13px; font-weight: 600; transition: background-color 200ms ease, color 200ms ease">{{ g.label }}</button></sc-for>
      </div>
      <sc-if value="{{ tabStyle }}" hint-placeholder-val="{{ true }}">
      <div role="radiogroup" aria-label="Style" style="display: flex; flex-direction: column; gap: 8px">
        <span style="padding: 0 20px; font-size: 13px; font-weight: 600">Style</span>
        <div style="display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 4px 20px 4px">
          <sc-for list="{{ themes }}" as="t" hint-placeholder-count="8">
            <button role="radio" aria-checked="{{ t.on }}" aria-label="{{ t.name }}" onClick="{{ t.pick }}" style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; padding: 0; background: transparent; color: #1F1D47">
              <span style="position: relative; display: block; width: 54px; height: 96px; border-radius: 9px; overflow: hidden; outline: 2.5px solid {{ t.ring }}; outline-offset: 2px; transition: outline-color 160ms ease">
                <span aria-hidden="true" ref="{{ t.paint }}" style="position: absolute; left: 0; top: 0; width: 360px; height: 640px; transform: scale(0.15); transform-origin: 0 0; pointer-events: none"></span>
              </span>
              <span style="font-size: 11px; font-weight: {{ t.weight }}; white-space: nowrap">{{ t.name }}</span>
            </button>
          </sc-for>
        </div>
      </div>

      </sc-if>
      <sc-if value="{{ tabColour }}" hint-placeholder-val="{{ false }}">
      <div role="radiogroup" aria-label="Colour" style="display: flex; flex-direction: column; gap: 8px">
        <span style="padding: 0 20px; font-size: 13px; font-weight: 600">Colour</span>
        <div style="display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 20px">
          <sc-for list="{{ accents }}" as="a" hint-placeholder-count="10">
            <button role="radio" aria-checked="{{ a.on }}" aria-label="{{ a.name }}" onClick="{{ a.pick }}" style="flex-shrink: 0; width: 34px; height: 34px; border-radius: 17px; border: 0; padding: 0; background: {{ a.fill }}; box-shadow: inset 0 0 0 1px rgba(31,29,71,0.14); outline: 2.5px solid {{ a.ring }}; outline-offset: 2px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: #1F1D47">{{ a.text }}</button>
          </sc-for>
        </div>
      </div>

      </sc-if>
      <sc-if value="{{ tabShow }}" hint-placeholder-val="{{ false }}">
      <div aria-label="What the image shows" role="group" style="display: flex; flex-direction: column; gap: 8px; padding: 0 20px">
        <span style="font-size: 13px; font-weight: 600">Show</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{ parts }}" as="p" hint-placeholder-count="5">
            <button aria-pressed="{{ p.on }}" onClick="{{ p.toggle }}" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px 0 10px; border-radius: 18px; border: 1.5px solid {{ p.line }}; background: {{ p.bg }}; color: {{ p.fg }}; font-size: 12.5px; font-weight: 500">
              <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ p.fg }}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="{{ p.glyph }}"></path></svg>{{ p.label }}
            </button>
          </sc-for>
        </div>
      </div>

      </sc-if>
      <sc-if value="{{ tabPhoto }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 20px">
        <span style="font-size: 13px; font-weight: 600">Photo</span>
        <div style="display: flex; gap: 8px">
          <label style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 22px; background: #F3F2FA; font-size: 13px; font-weight: 600; cursor: pointer">
            <input type="file" accept="image/*" onchange="{{ pickPhoto }}" style="position: absolute; width: 1px; height: 1px; opacity: 0">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D47" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"></rect><circle cx="9" cy="11" r="2"></circle><path d="M21 17l-5-5-9 8"></path></svg>{{ photoLabel }}
          </label>
          <sc-if value="{{ hasPhoto }}" hint-placeholder-val="{{ false }}">
            <button onClick="{{ clearPhoto }}" style="min-height: 44px; padding: 0 18px; border-radius: 22px; border: 0; background: #F3F2FA; color: #1F1D47; font-size: 13px; font-weight: 600">Remove</button>
          </sc-if>
        </div>
        <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}"><span role="status" style="font-size: 12px; color: #C2412F">{{ note }}</span></sc-if>
      </div>
      </sc-if>
    </div>

    <button type="button" onClick="{{ shareLink }}" disabled="{{ busy }}" style="margin: 0 20px 10px; height: 48px; border: 0; border-radius: 24px; background: #1F1D47; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F6C343" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>Share link (opens in Motio)</button>
    <div style="padding: 12px 16px 24px; background: #FFFFFF; border-radius: 24px 24px 0 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{ targets }}" as="t" hint-placeholder-count="6">
        <button onClick="{{ t.pick }}" disabled="{{ busy }}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; padding: 0; background: transparent; color: #1F1D47; font-size: 10.5px; font-weight: 600">
          <span style="width: 48px; height: 48px; border-radius: 24px; background: {{ t.color }}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{ t.ink }}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ t.glyph }}"></path></svg></span>
          {{ t.label }}
        </button>
      </sc-for>
    </div>
    <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}"><div role="status" style="position: absolute; left: 50%; top: 150px; transform: translateX(-50%); padding: 10px 16px; border-radius: 20px; background: #1F1D47; color: #FFFFFF; font-size: 12.5px; font-weight: 600; white-space: nowrap">Making your image…</div></sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"job":{"editor":null},"onClose":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // The style kit from stories.js (Motio.storyImage.kit). Without it (the design canvas) the sheet shows its controls only.
  kit() { const M = window.Motio; return M && M.storyImage && M.storyImage.kit; }
  look() {
    const s = this.state || {};
    if (!s.look) {
      const K = this.kit(), saved = K ? K.loadLook() : {}, job = this.props.job || {};
      // Opens on the theme you were looking at; colour, name, map and hidden stats are remembered from last time.
      return { theme: job.theme || saved.theme || 'editorial', accent: saved.accent || null, showName: saved.showName !== false, showMap: saved.showMap !== false, hide: saved.hide || [], photo: null };
    }
    return s.look;
  }
  set(patch) { this.setState({ look: { ...this.look(), ...patch }, note: null }); }
  close(msg) {
    if (this.closing) return;
    this.closing = true;
    this.setState({ closing: true });
    setTimeout(() => { if (this.props.onClose) this.props.onClose(msg || null); }, 260);
  }
  // A phone photo is far bigger than a story needs: scale it so its long side is 1920 px before it goes in the card.
  readPhoto(file) {
    if (!file || !/^image\//.test(file.type)) { this.setState({ note: 'Pick an image file' }); return; }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1920 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      this.set({ photo: c.toDataURL('image/jpeg', 0.86) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); this.setState({ note: 'That photo couldn’t be opened. Try another one.' }); };
    img.src = url;
  }
  share(how) {
    const M = window.Motio, K = this.kit(), job = this.props.job || {}, look = this.look();
    if (!M || !K) { this.close(null); return; }
    K.saveLook(look);
    if (how === 'copy') { M.shareImage('', 'copy', job.text).then((m) => this.close(m)); return; }
    this.setState({ busy: true });
    // The share text carries a short link to this card ("Open in Motio").
    // The short link first: it's printed on the image (an image can't be tapped) and goes in the text.
    Promise.resolve(M.shareLink ? M.shareLink(job.kind, job.data) : null)
      .then((link) => (how === 'link' ? (link ? M.shareText((job.text || 'My moves on Motio') + '\n' + link).then(() => null) : Promise.reject(new Error('Can’t make a link while offline')))
        : M.storyImage(job.kind, job.data, { ...look, link }).then((img) => M.shareImage(img, how, link ? (job.text || 'Tracked with Motio.') + '\n' + link : job.text))))
      .then((m) => { this.setState({ busy: false }); this.close(m); })
      .catch((e) => { this.setState({ busy: false }); if (!/cancel/i.test(String(e && e.message))) this.setState({ note: 'Couldn’t share right now. Try again.' }); });
  }
  // Paints card markup into an element the runtime leaves alone (it has no children of its own).
  painter(html) { return (el) => { if (el && el.__card !== html) { el.innerHTML = html; el.__card = html; } }; }
  renderVals() {
    const s = this.state || {}, K = this.kit(), job = this.props.job || {}, look = this.look();
    const NAMES = { '#F6C343': 'Signal yellow', '#FF8A5B': 'Ember', '#E5484D': 'Red', '#F06595': 'Rose', '#8B7CF6': 'Violet', '#4C6FFF': 'Cobalt', '#5CE1B9': 'Mint', '#3DBF5C': 'Green', '#FFFFFF': 'White' };
    const THEMES = K ? K.THEMES : { editorial: { name: 'Editorial' }, mono: { name: 'Mono' }, gradient: { name: 'Gradient' }, map: { name: 'Map' }, numbers: { name: 'Big numbers' }, film: { name: 'Film' }, minimal: { name: 'Minimal' }, night: { name: 'Night' } };
    const card = (o) => (K ? K.storyHTML(job.kind, job.data, o) : '');
    const parts = (K ? K.storyParts(job.kind, job.data) : []).map((p) => ({ ...p, on: !look.hide.includes(p.key), flip: () => this.set({ hide: look.hide.includes(p.key) ? look.hide.filter((k) => k !== p.key) : [...look.hide, p.key] }) }));
    const hasRoute = !!(job.data && job.data.routes && job.data.routes.some((r) => r.points && r.points.length > 1));
    if (hasRoute) parts.push({ label: 'Map', on: look.showMap, flip: () => this.set({ showMap: !look.showMap }) });
    parts.push({ label: 'Name', on: look.showName, flip: () => this.set({ showName: !look.showName }) });
    parts.push({ label: 'Date', on: !look.hide.includes('date'), flip: () => this.set({ hide: look.hide.includes('date') ? look.hide.filter((k) => k !== 'date') : [...look.hide, 'date'] }) });
    parts.push({ label: 'Link', on: !look.hide.includes('link'), flip: () => this.set({ hide: look.hide.includes('link') ? look.hide.filter((k) => k !== 'link') : [...look.hide, 'link'] }) });
    const tab = s.tab || 'style';
    const glyphs = { story: 'M4 4h16v16H4zM12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8', chat: 'M4 5h16v11H9l-5 4z', post: 'M5 5l14 14M19 5L5 19', sms: 'M4 6h16v10H8l-4 4z', save: 'M12 4v11M7 10l5 5 5-5M5 20h14', copy: 'M9 9h11v11H9zM5 15V4h11' };
    return {
      close: () => this.close(null),
      tabs: [['style', 'Style'], ['colour', 'Colour'], ['show', 'Show'], ['photo', 'Photo']].map(([k, label]) => ({ label, on: tab === k ? 'true' : 'false', bg: tab === k ? '#1F1D47' : 'transparent', fg: tab === k ? '#FFFFFF' : '#6B6890', pick: () => this.setState({ tab: k }) })),
      tabStyle: tab === 'style', tabColour: tab === 'colour', tabShow: tab === 'show', tabPhoto: tab === 'photo',
      shareLink: () => this.share('link'),
      sheetAnim: s.closing ? 'motioShDown 260ms ease-in forwards' : 'motioShUp 380ms cubic-bezier(0.22, 1, 0.36, 1)',
      scrimAnim: s.closing ? 'motioShFadeOut 260ms ease-in forwards' : 'motioShFade 240ms ease-out',
      previewLabel: 'Preview: ' + THEMES[look.theme].name + ' style',
      paintPreview: this.painter(card(look)),
      themes: Object.keys(THEMES).map((id) => ({
        name: THEMES[id].name, on: look.theme === id, ring: look.theme === id ? '#5B4FE0' : 'transparent', weight: look.theme === id ? 600 : 500,
        paint: this.painter(card({ ...look, theme: id })), pick: () => this.set({ theme: id })
      })),
      accents: [null, ...(K ? K.ACCENTS : [])].map((c) => ({
        name: c ? NAMES[c] || c : 'Style colour', on: look.accent === c, ring: look.accent === c ? '#5B4FE0' : 'transparent',
        fill: c || (K ? K.THEMES[look.theme].accent : '#EEF0F6'), text: c ? '' : 'A', pick: () => this.set({ accent: c })
      })),
      parts: parts.map((p) => ({ label: p.label, on: p.on, toggle: p.flip, bg: p.on ? '#1F1D47' : '#FFFFFF', fg: p.on ? '#FFFFFF' : '#6B6890', line: p.on ? '#1F1D47' : '#E3E1F3', glyph: p.on ? 'M5 12l5 5 9-10' : 'M12 5v14M5 12h14' })),
      pickPhoto: (e) => { const f = e && e.target && e.target.files && e.target.files[0]; if (f) this.readPhoto(f); if (e && e.target) e.target.value = ''; },
      hasPhoto: !!look.photo, photoLabel: look.photo ? 'Change photo' : 'Add a photo from your gallery', clearPhoto: () => this.set({ photo: null }),
      hasNote: !!s.note, note: s.note || '',
      busy: !!s.busy,
      targets: [['Story', 'story', '#5B4FE0', '#FFFFFF', glyphs.story], ['WhatsApp', 'whatsapp', '#3DBF5C', '#FFFFFF', glyphs.chat], ['X', 'x', '#1F1D47', '#FFFFFF', glyphs.post], ['Messages', 'sms', '#6E8CF7', '#FFFFFF', glyphs.sms], ['Save', 'save', '#EEF0F6', '#1F1D47', glyphs.save], ['Copy text', 'copy', '#EEF0F6', '#1F1D47', glyphs.copy]]
        .map(([label, how, color, ink, glyph]) => ({ label, color, ink, glyph, pick: () => this.share(how) }))
    };
  }
}
</script>
</body>
</html>
