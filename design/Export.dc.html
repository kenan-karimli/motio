<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Export my data</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
a{color:inherit}
button{font:inherit;cursor:pointer}
button,a{transition:transform 140ms cubic-bezier(0.22,1,0.36,1),background-color 200ms ease,color 200ms ease,outline-color 200ms ease}
button:active,a:active{transform:scale(0.95)}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioPop{0%{transform:scale(0.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes motioRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes motioToast{0%{opacity:0;transform:translate(-50%,16px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
@keyframes motioLeaveRight{from{transform:translateX(0)}to{transform:translateX(100%)}}
@keyframes motioLeaveDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes motioReturn{from{transform:translateX(-72px);opacity:0.4}to{transform:translateX(0);opacity:1}}
@keyframes motioReturnScale{from{transform:scale(0.94);opacity:0.5}to{transform:scale(1);opacity:1}}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioStoryIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioSoftBackIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioSoftUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes motioSoftOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(24px)}}
@keyframes motioSoftDown{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(28px)}}
</style>
</helmet>
<div class="m-page" style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 54px 20px 0">
  <div class="m-topbar"><a class="m-icon" href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back"><m-ic n="back"></m-ic></a><span class="m-tt">Export</span><span style="width: 44px"></span></div>
  <div class="motio-scroll" style="flex: 1; min-height: 0; overflow-y: auto; margin: -54px -20px 0; padding: 108px 20px 28px; display: flex; flex-direction: column; gap: 10px">
    <div class="m-in" style="display: flex; justify-content: center"><m-art name="box" size="200"></m-art></div>
    <div class="head m-in" style="--i: 1"><div class="t"><h1 class="m-title">export.</h1><span class="m-sub" style="font-size: 15px">{{ intro }}</span></div></div>
    <div class="field m-in" style="--i: 2"><span class="m-label">Format</span><div style="display: flex; gap: 6px"><sc-for list="{{ formats }}" as="f" hint-placeholder-count="3"><button type="button" class="m-chip {{ f.cls }}" aria-pressed="{{ f.on }}" aria-label="{{ f.label }}: {{ f.hint }}" onClick="{{ f.pick }}">{{ f.label }}</button></sc-for></div></div>
    <div class="field m-in" style="--i: 3"><span class="m-label">Range</span><div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{ ranges }}" as="r" hint-placeholder-count="3"><button type="button" class="m-chip {{ r.cls }}" aria-pressed="{{ r.on }}" onClick="{{ r.pick }}">{{ r.label }}</button></sc-for></div></div>
    <div class="m-card m-in" style="--i: 4; display: flex; flex-direction: column; gap: 2px; padding: 8px">
      <sc-for list="{{ parts }}" as="t" hint-placeholder-count="3"><div class="m-row" style="background: transparent"><span style="flex: 1; font-size: 14px; font-weight: 600">{{ t.label }}</span><button type="button" role="switch" class="m-toggle {{ t.cls }}" aria-checked="{{ t.on }}" aria-label="{{ t.label }}" onClick="{{ t.toggle }}"></button></div></sc-for>
    </div>
    <sc-if value="{{ working }}" hint-placeholder-val="{{ false }}">
      <div class="m-card" style="display: flex; flex-direction: column; gap: 10px; padding: 16px">
        <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600"><span>{{ stepLabel }}</span><span>{{ pctLabel }}</span></div>
        <div class="m-progress"><i style="width: {{ pct }}"></i></div>
      </div>
    </sc-if>
    <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
      <div class="m-card m-in" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px"><m-ic n="file" s="18"></m-ic><span style="flex: 1; min-width: 0"><b style="font-size: 14px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ fileName }}</b><div class="m-sub" style="font-size: 12px">{{ fileDate }} · {{ fileSize }}</div></span><button type="button" class="m-chip" onClick="{{ download }}" style="height: 32px; font-size: 12px; background: var(--m-soft)">Download</button></div>
    </sc-if>
    <span class="sp" style="min-height: 12px"></span>
    <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}"><button type="button" class="m-btn wide m-late" onClick="{{ start }}">{{ startLabel }}</button></sc-if>
    <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}"><button type="button" class="m-btn w wide" onClick="{{ reset }}">Start a new export</button></sc-if>
  </div>

  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 50%; bottom: 40px; z-index: 50; padding: 12px 18px; border-radius: 18px; background: var(--m-ink); color: var(--m-bg-hi); font: 600 13px var(--m-font); white-space: nowrap; box-shadow: 0 10px 24px rgba(0,0,0,0.18); animation: motioToast 2300ms ease forwards">{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // Standalone artboards: remember which way we are going, and play this page's exit before the canvas jumps.
  dirGet() {
    let d = null;
    try { d = window.localStorage.getItem('motio.dir'); } catch (e) { /* blocked */ }
    if (d === null) { try { d = window.sessionStorage.getItem('motio.dir'); } catch (e) { /* blocked */ } }
    if (d === null) { try { d = window.top.__motioDir; } catch (e) { /* cross-origin */ } }
    if (d == null) d = window.__motioDir;
    return d || null;
  }
  dirSet(v) {
    try { window.localStorage.setItem('motio.dir', v); } catch (e) { /* blocked */ }
    try { window.sessionStorage.setItem('motio.dir', v); } catch (e) { /* blocked */ }
    try { window.top.__motioDir = v; } catch (e) { /* cross-origin */ }
    window.__motioDir = v;
  }
  standaloneNav(e, target) {
    if (target !== 'back' || this.navNow) { this.navNow = false; if (target !== 'back') this.dirSet('forward'); return; }
    const el = e && e.currentTarget;
    if (!el) return;
    e.preventDefault();
    this.dirSet('back');
    this.setState({ leaving: true });
    setTimeout(() => { this.navNow = true; el.click(); }, 200);
  }
  showToast(msg) {
    clearTimeout(this.toastTimer);
    this.setState({ toast: null });
    setTimeout(() => this.setState({ toast: msg }), 30);
    this.toastTimer = setTimeout(() => this.setState({ toast: null }), 2330);
  }
  componentWillUnmount() {
    clearInterval(this.progressTimer);
  }
  renderVals() {
    if (this.entryAnim === undefined) {
      const d = this.props.embedded ? null : this.dirGet();
      if (d) this.dirSet('');
      // Standalone artboards can't show the previous page underneath, so they use short in-place fades;
      // inside the App prototype the full slides play over the real page behind.
      this.entryAnim = this.props.embedded ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : d === 'back' ? 'motioSoftBackIn 300ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)';
    }
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) { this.standaloneNav(e, target); return; }
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const s = this.state || {};
    const fmt = s.fmt || 'gpx';
    const range = s.range || 'all';
    const phase = s.phase || 'idle';
    const p = s.p || 0;
    const sw = (key, label, def) => {
      const on = s[key] ?? def;
      return { label, on, cls: on ? 'on' : '', bg: on ? '#3DBF5C' : '#C9C5EC', knob: on ? '21px' : '3px', toggle: () => this.setState({ [key]: !on }) };
    };
    const steps = ['Collecting trips', 'Adding steps and speeds', 'Packing your file'];
    const M = window.Motio;
    const monthName = new Date().toLocaleString('en', { month: 'long' });
    const sizes = { year: '9.1 MB', month: '2.4 MB', all: '14.8 MB' };
    const yr = new Date().getFullYear(), rangeNames = { year: String(yr), month: yr + '-' + String(new Date().getMonth() + 1).padStart(2, '0'), all: 'all-time' };
    const kb = (n) => (n > 900000 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
    const mimes = { csv: 'text/csv', gpx: 'application/gpx+xml', json: 'application/json' };
    return {
      rootAnim: this.state && this.state.leaving ? 'motioSoftOut 200ms ease-in forwards' : this.entryAnim,
      emb, LK: { back: lk('back', 'Settings.dc.html') },
      intro: (() => { const st = M ? M.status() : { trips: 1840 }; return 'All ' + (st.trips || 0) + (st.trips === 1 ? ' trip' : ' trips') + ', every route and place, in a file that’s yours.'; })(),
      formats: [['gpx', 'GPX', 'Routes for maps'], ['csv', 'CSV', 'Spreadsheets'], ['json', 'JSON', 'For developers']].map(([k, label, hint]) => ({
        label, hint, on: fmt === k, cls: fmt === k ? 'on' : '',
        bg: fmt === k ? '#1F1D47' : '#F6F5FC', fg: fmt === k ? '#FFFFFF' : '#1F1D47', ring: fmt === k ? '#F6C343' : 'transparent',
        pick: () => this.setState({ fmt: k, phase: phase === 'ready' ? 'idle' : phase })
      })),
      ranges: [['month', 'This month'], ['year', 'This year'], ['all', 'Everything']].map(([k, label]) => ({
        label, on: range === k, cls: range === k ? 'on' : '',
        bg: range === k ? '#1F1D47' : '#FFFFFF', fg: range === k ? '#FFFFFF' : '#1F1D47', border: range === k ? '#1F1D47' : '#E3E1F3',
        pick: () => this.setState({ range: k, phase: phase === 'ready' ? 'idle' : phase })
      })),
      parts: [sw('routes', 'Routes (GPS points)', true), sw('steps', 'Steps and speeds', true), sw('types', 'Activity types', true)],
      idle: phase === 'idle', working: phase === 'working', ready: phase === 'ready',
      pct: p + '%', pctLabel: p + '%', stepLabel: steps[Math.min(2, Math.floor(p / 34))],
      start: () => {
        this.setState({ phase: 'working', p: 0 });
        clearInterval(this.progressTimer);
        let v = 0, file = null, failed = null;
        // The bar creeps toward 90% while the server builds the file, then finishes once it arrives.
        this.progressTimer = setInterval(() => {
          v = file || failed ? Math.min(100, v + 18) : Math.min(90, v + 6 + Math.round(Math.random() * 6));
          this.setState({ p: v });
          if (failed) { clearInterval(this.progressTimer); this.setState({ phase: 'idle', p: 0 }); this.showToast(failed); return; }
          if (v >= 100) { clearInterval(this.progressTimer); this.file = file; setTimeout(() => this.setState({ phase: 'ready', size: kb(file.length) }), 350); }
        }, 220);
        if (!M) { file = 'x'.repeat(600000); return; }
        const now = Date.now();
        const from = range === 'year' ? new Date(yr, 0, 1).getTime() : range === 'month' ? M.monthStart(now) : 0;
        const part = (k) => s[k] ?? true;
        M.exportData(fmt, from, now, { routes: part('routes'), steps: part('steps'), types: part('types') })
          .then((t) => { file = t; })
          .catch((e) => { failed = e.code === 'offline' ? 'You’re offline. Connect and try again' : e.status === 401 ? 'Log in again to export' : 'Export failed. Try again'; });
      },
      fileName: 'motio-' + rangeNames[range] + '.' + fmt,
      fileSize: s.size || sizes[range],
      fileDate: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }),
      startLabel: range === 'all' ? 'Export everything' : range === 'year' ? 'Export this year' : 'Export this month',
      download: () => {
        if (!M || !this.file) { this.showToast('Download started'); return; }
        M.saveFile('motio-' + rangeNames[range] + '.' + fmt, this.file, mimes[fmt]).then(() => this.showToast('Export saved')).catch(() => this.showToast('Couldn’t save the file'));
      },
      reset: () => this.setState({ phase: 'idle', p: 0 }),
      hasToast: !!s.toast, toast: s.toast || ''
    };
  }
}
</script>
</body>
</html>
