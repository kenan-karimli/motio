<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Insights</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
button,a{font:inherit;cursor:pointer}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioInsIn{from{opacity:0;transform:translateY(24px) scale(0.98)}to{opacity:1;transform:none}}
@keyframes motioInsBar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes motioInsBub{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes motioInsFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes motioInsTick{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes motioInsRoll{from{transform:translateX(-30px) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
.motio-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F5FC; color: #1F1D47; font-family: 'Poppins', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex-shrink: 0; padding: 16px 20px 10px; display: flex; align-items: center; gap: 12px">
    <a href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D47" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex: 1; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.1">Insights</h1><span style="font-size: 12px; color: #6B6890">{{ range }}</span></div>
  </div>

  <div class="motio-scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 6px 20px 32px; display: flex; flex-direction: column; gap: 12px">
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div style="padding: 20px; border-radius: 24px; background: #FFFFFF; font-size: 14px; line-height: 1.5; color: #4A4770">Insights appear once you’ve moved for 20 minutes this week. Each one is a pattern Motio spots in your own trips.</div></sc-if>
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="4">
      <section style="position: relative; overflow: hidden; padding: 18px; border-radius: 26px; background: {{ c.bg }}; color: {{ c.fg }}; display: flex; flex-direction: column; gap: 12px; animation: motioInsIn 560ms cubic-bezier(0.22, 1, 0.36, 1) {{ c.d }} backwards">
        <span style="font-size: 12px; opacity: 0.8">{{ c.kicker }}</span>
        <span style="font-size: 21px; font-weight: 700; line-height: 1.25">{{ c.text }}</span>
        <sc-if value="{{ c.isHours }}" hint-placeholder-val="{{ false }}">
          <div role="img" aria-label="Minutes moving by hour, 6 AM to midnight" style="display: flex; align-items: flex-end; gap: 3px; height: 66px"><sc-for list="{{ c.bars }}" as="b" hint-placeholder-count="18"><span style="flex: 1; height: {{ b.h }}; border-radius: 3px; background: {{ b.c }}; transform-origin: bottom; animation: motioInsBar 600ms cubic-bezier(0.34, 1.3, 0.64, 1) {{ b.d }} backwards"></span></sc-for></div>
          <span style="display: flex; justify-content: space-between; font-size: 10px; opacity: 0.75"><span>6 AM</span><span>Noon</span><span>6 PM</span><span>Midnight</span></span>
        </sc-if>
        <sc-if value="{{ c.isDays }}" hint-placeholder-val="{{ false }}">
          <div role="img" aria-label="Active time by day" style="display: flex; align-items: center; justify-content: space-between; height: 64px"><sc-for list="{{ c.bubbles }}" as="b" hint-placeholder-count="7"><span style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: {{ b.s }}; height: {{ b.s }}; border-radius: 50%; background: {{ b.c }}; animation: motioInsBub 520ms cubic-bezier(0.34, 1.5, 0.64, 1) {{ b.d }} backwards"></span><span style="font-size: 11px; font-weight: {{ b.fw }}">{{ b.l }}</span></span></sc-for></div>
        </sc-if>
        <sc-if value="{{ c.isClock }}" hint-placeholder-val="{{ false }}">
          <div role="img" aria-label="When your days started, last two weeks" style="position: relative; height: 46px; border-radius: 14px; background: rgba(31,29,71,0.06)">
            <span style="position: absolute; left: {{ c.bandL }}; width: {{ c.bandW }}; top: 8px; bottom: 8px; border-radius: 10px; background: rgba(91,79,224,0.15)"></span>
            <sc-for list="{{ c.ticks }}" as="t" hint-placeholder-count="6"><span style="position: absolute; left: {{ t.x }}; top: 17px; width: 12px; height: 12px; margin-left: -6px; border-radius: 6px; background: #5B4FE0; animation: motioInsTick 420ms cubic-bezier(0.34, 1.5, 0.64, 1) {{ t.d }} backwards"></span></sc-for>
            <span style="position: absolute; left: 10px; top: 14px; font-size: 10px; opacity: 0.6">{{ c.lo }}</span><span style="position: absolute; right: 10px; top: 14px; font-size: 10px; opacity: 0.6">{{ c.hi }}</span>
          </div>
        </sc-if>
        <sc-if value="{{ c.isMix }}" hint-placeholder-val="{{ false }}">
          <span aria-hidden="true" style="display: flex; height: 14px; gap: 3px; transform-origin: left; animation: motioInsFill 800ms cubic-bezier(0.22, 1, 0.36, 1) {{ c.d2 }} backwards"><sc-for list="{{ c.segs }}" as="m" hint-placeholder-count="3"><span style="flex: {{ m.f }}; border-radius: 7px; background: {{ m.c }}"></span></sc-for></span>
          <span style="display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; font-weight: 600"><sc-for list="{{ c.segs }}" as="m" hint-placeholder-count="3"><span>{{ m.label }}</span></sc-for></span>
        </sc-if>
        <sc-if value="{{ c.isCompare }}" hint-placeholder-val="{{ false }}">
          <div aria-hidden="true" style="display: flex; gap: 8px; flex-wrap: wrap"><sc-for list="{{ c.tokens }}" as="t" hint-placeholder-count="3"><span style="width: 30px; height: 30px; border-radius: 15px; border: 3px solid {{ t.c }}; box-sizing: border-box; animation: motioInsRoll 520ms cubic-bezier(0.22, 1, 0.36, 1) {{ t.d }} backwards"></span></sc-for></div>
        </sc-if>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const M = window.Motio;
    const H = [6, 18, 44, 60, 38, 20, 14, 10, 8, 12, 16, 10, 14, 22, 30, 18, 10, 4];
    const sample = [
      { kind: 'hours', kicker: 'When you move', text: 'You’re a morning mover: 41% of your week happened before 10 AM.', hourly: H, peak: 8 },
      { kind: 'days', kicker: 'Your big day', text: 'Wednesday wins with 2h 20m, 2.0× your usual day.', mins: [40, 62, 140, 55, 70, 30, 75], labels: ['T', 'F', 'S', 'S', 'M', 'T', 'W'], top: 2 },
      { kind: 'clock', kicker: 'Habits', text: 'Like clockwork: your day starts around 8:05, give or take 4 minutes.', starts: [482, 488, 484, 490, 481, 486], mean: 485, sd: 4 },
      { kind: 'mix', kicker: 'How you moved', text: 'Walk took 41% of your moving time this week.', modes: [{ pct: 41, color: '#3DBF5C', label: 'Walk' }, { pct: 33, color: '#6E8CF7', label: 'Bike' }, { pct: 26, color: '#F2766B', label: 'Run' }] },
      { kind: 'compare', kicker: 'Put another way', text: '74 km this week: that’s 1.8 marathons.', km: 74 }
    ];
    const F = M ? M.findings() : sample;
    const base = emb ? 380 : 0;
    const STY = [['#5B4FE0', '#FFFFFF'], ['#FFFFFF', '#1F1D47'], ['#F6C343', '#1F1D47'], ['#FFFFFF', '#1F1D47'], ['#1F1D47', '#FFFFFF']];
    const hm = (m) => Math.floor(m / 60) + ':' + String(Math.round(m % 60)).padStart(2, '0');
    const from = new Date(Date.now() - 6 * 86400000);
    return {
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)',
      LK: { back: lk('back', 'Recaps.dc.html') },
      range: 'Last 7 days · since ' + from.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }),
      empty: !F.length,
      cards: F.map((f, i) => {
        const [bg, fg] = STY[i % STY.length], d0 = base + i * 90;
        const c = { kicker: f.kicker, text: f.text, bg, fg, d: d0 + 'ms', d2: d0 + 300 + 'ms', isHours: f.kind === 'hours', isDays: f.kind === 'days', isClock: f.kind === 'clock', isMix: f.kind === 'mix', isCompare: f.kind === 'compare' };
        if (f.kind === 'hours') { const mx = Math.max(1, ...f.hourly); c.bars = f.hourly.map((m, k) => ({ h: Math.round(m / mx * 60) + 4 + 'px', c: m === mx ? '#F6C343' : fg === '#FFFFFF' ? 'rgba(255,255,255,0.55)' : '#C9C5EC', d: d0 + 200 + k * 25 + 'ms' })); }
        if (f.kind === 'days') { const mx = Math.max(1, ...f.mins); c.bubbles = f.mins.map((m, k) => ({ s: Math.round(12 + m / mx * 42) + 'px', c: k === f.top ? '#F2766B' : '#C9C5EC', fw: k === f.top ? 700 : 500, l: f.labels[k], d: d0 + 200 + k * 60 + 'ms' })); }
        if (f.kind === 'clock') {
          const lo = Math.min(...f.starts) - 20, hi = Math.max(...f.starts) + 20, span = Math.max(1, hi - lo), pos = (m) => ((m - lo) / span * 100).toFixed(1) + '%';
          c.ticks = f.starts.map((m, k) => ({ x: pos(m), d: d0 + 250 + k * 70 + 'ms' })); c.lo = hm(lo); c.hi = hm(hi);
          c.bandL = pos(f.mean - f.sd); c.bandW = Math.max(2, 2 * f.sd / span * 100).toFixed(1) + '%';
        }
        if (f.kind === 'mix') c.segs = f.modes.map((m) => ({ f: Math.max(2, m.pct), c: m.color, label: m.label + ' ' + m.pct + '%' }));
        if (f.kind === 'compare') { const n = f.km >= 42.2 ? Math.min(8, Math.round(f.km / 42.195)) : Math.min(8, Math.round(f.km / 0.4 / 10)); c.tokens = Array.from({ length: Math.max(1, n) }, (_, k) => ({ c: ['#F6C343', '#3DBF5C', '#6E8CF7', '#F2766B'][k % 4], d: d0 + 200 + k * 80 + 'ms' })); }
        return c;
      })
    };
  }
}
</script>
</body>
</html>
