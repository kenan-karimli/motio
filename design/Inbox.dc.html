<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
button,a,input{font:inherit;color:inherit}
button,a{cursor:pointer;text-decoration:none}
button,a{transition:transform 140ms cubic-bezier(0.22,1,0.36,1)}
button:active,a:active{transform:scale(0.97)}
button.m-row,a.m-row{border:0;width:100%;text-align:left}
.avn{background:var(--m-card);box-shadow:inset 0 0 0 1.5px var(--m-line);color:var(--m-ink);overflow:hidden}
.avn img{width:100%;height:100%;object-fit:cover}
.avme{background:var(--m-ink);color:var(--m-bg-hi)}
.m-row.me{background:var(--m-ink);color:var(--m-bg-hi)}
.m-row.me .m-sub{color:color-mix(in srgb,var(--m-bg-hi) 70%,transparent)}
.m-row.me .avme{background:var(--m-ink-2)}
.bare{flex:1;min-width:0;height:100%;border:0;padding:0;background:transparent;outline:none;font:500 15px var(--m-font);color:var(--m-ink)}
.bare::placeholder{color:var(--m-faint)}
.m-toast{position:absolute;left:50%;bottom:28px;z-index:50;padding:12px 18px;border-radius:999px;background:var(--m-ink);color:var(--m-bg-hi);font:600 13px var(--m-font);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:motioToast 2300ms ease forwards}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioToast{0%{opacity:0;transform:translate(-50%,12px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
.motio-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="m-page" style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 10px 20px 0">
  <div class="m-topbar"><a class="m-icon" href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back"><m-ic n="back"></m-ic></a><span class="m-tt">Inbox</span><sc-if value="{{ hasNew }}" hint-placeholder-val="{{ true }}"><button type="button" class="m-sub" onClick="{{ markRead }}" style="border: 0; background: transparent; padding: 0 4px; font-weight: 600">Mark all read</button></sc-if><sc-if value="{{ noNew }}" hint-placeholder-val="{{ false }}"><span style="width: 44px"></span></sc-if></div>
  <div class="motio-scroll" style="flex: 1; min-height: 0; overflow-y: auto; margin: -10px -20px 0; padding: 70px 20px 40px; display: flex; flex-direction: column; gap: 10px">
    <div class="head"><div class="t"><h1 class="m-title">inbox.</h1></div></div>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <div class="m-card m-in" style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 20px; text-align: center">
        <m-art name="bell" style="width: 110px; height: 110px"></m-art>
        <span class="m-h3">You’re all caught up</span>
        <span class="m-sub" style="max-width: 260px">Cheers, friend requests, challenges and new versions of Motio show up here.</span>
      </div>
    </sc-if>
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
      <span class="m-label" style="margin: 4px 4px 0">{{ g.title }}</span>
      <div class="m-card m-in" style="--i: {{ g.i }}; display: flex; flex-direction: column; gap: 6px; padding: 12px">
        <sc-for list="{{ g.items }}" as="i" hint-placeholder-count="3">
          <div class="m-row">
            <button type="button" onClick="{{ i.open }}" aria-label="{{ i.aria }}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; border: 0; padding: 0; background: transparent; text-align: left">
              <span class="av {{ i.avCls }}"><m-ic n="{{ i.icon }}" s="17"></m-ic></span>
              <span style="flex: 1; min-width: 0; font-size: 14px; line-height: 1.35"><b>{{ i.title }}</b><sc-if value="{{ i.hasBody }}" hint-placeholder-val="{{ true }}"><div class="m-sub" style="font-size: 12px">{{ i.body }}</div></sc-if></span>
            </button>
            <sc-if value="{{ i.isRequest }}" hint-placeholder-val="{{ false }}">
              <button type="button" class="m-icon" onClick="{{ i.decline }}" aria-label="{{ i.declineAria }}" style="width: 32px; height: 32px"><m-ic n="x" s="14"></m-ic></button>
              <button type="button" class="m-chip on" onClick="{{ i.accept }}" aria-label="{{ i.acceptAria }}" style="height: 32px; font-size: 12px">Accept</button>
            </sc-if>
            <sc-if value="{{ i.hasDone }}" hint-placeholder-val="{{ false }}"><span class="m-sub" style="font-size: 12px; font-weight: 600">{{ i.done }}</span></sc-if>
            <sc-if value="{{ i.showWhen }}" hint-placeholder-val="{{ true }}"><span class="m-sub" style="font-size: 11px; white-space: nowrap">{{ i.when }}</span></sc-if>
            <sc-if value="{{ i.isNew }}" hint-placeholder-val="{{ false }}"><i aria-hidden="true" style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 4px; background: var(--m-accent)"></i></sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}"><div role="status" class="m-toast">{{ toast }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    const M = window.Motio;
    // What was new when the page opened keeps its dot while you look; everything counts as read from now on.
    this.newIds = M ? new Set(M.inbox.items().filter((i) => M.inbox.isNew(i)).map((i) => i.id)) : new Set();
    if (M) { M.inbox.readAll(); M.inbox.refresh(); }
  }
  showToast(msg) { clearTimeout(this.toastT); this.setState({ toast: null }); setTimeout(() => this.setState({ toast: msg }), 30); this.toastT = setTimeout(() => this.setState({ toast: null }), 2330); }
  componentWillUnmount() { clearTimeout(this.toastT); }
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const M = window.Motio, now = Date.now();
    const sample = [
      { id: 'a', kind: 'cheer', at: now - 6 * 60000, who: 2, title: 'Leyla cheered you on', body: 'Keep moving!' },
      { id: 'b', kind: 'request', at: now - 50 * 60000, who: 3, title: 'Murad Huseynov wants to be friends', body: 'Accept to compare your weeks.' },
      { id: 'c', kind: 'update', at: now - 26 * 3600000, title: 'Motio 4.1 is out', body: 'Notifications, personal records and trip editing.' },
      { id: 'd', kind: 'shared', at: now - 3 * 86400000, who: 2, title: 'Leyla shared their routes with you', body: 'Open their map to see it.' }
    ];
    const items = M ? M.inbox.items() : sample;
    const isNew = (i) => (M ? this.newIds && this.newIds.has(i.id) : i.at > now - 3600000);
    // Icon per kind; people things get a neutral avatar ring, Motio things a dark one, goals and records the goal colour.
    const LOOK = { cheer: ['hand', 'avn'], request: ['useradd', 'avn'], friend: ['users', 'avn'], challenge: ['trophy', 'avn'], shared: ['map', 'avn'], comment: ['msg', 'avn'],
      update: ['download', 'avme'], record: ['star', 'tg'] };
    const s = this.state || {}, done = s.done || {};
    const answer = (i, yes) => () => {
      if (!M || !i.who) return;
      this.setState({ done: { ...done, [i.id]: yes ? 'Friends now' : 'Declined' } });
      M.friends.respond(i.who, yes).then(() => { if (yes) this.showToast(String(i.title).split(' ')[0] + ' is now your friend'); })
        .catch((e) => { this.setState({ done: { ...(this.state.done || {}), [i.id]: null } }); this.showToast((e && e.message) || 'Couldn’t do that. Try again.'); });
    };
    const go = (i) => () => {
      const nav = (t) => this.props.onNav && this.props.onNav(t);
      if (i.who) window.__motioFriend = i.who;
      if (i.kind === 'request') nav('friends');
      else if (i.kind === 'shared') nav('friendmap');
      else if (i.kind === 'update') nav('update');
      else if (i.kind === 'record') nav('records');
      else if (i.kind === 'comment' || i.post) nav('feed');
      else if (i.kind === 'challenge') nav('recaps');
      else if (i.who) nav('friend');
    };
    const ago = (t) => { const m = Math.round((now - t) / 60000); return m < 1 ? 'now' : m < 60 ? m + 'm' : m < 1440 ? Math.round(m / 60) + 'h' : m < 7 * 1440 ? new Date(t).toLocaleDateString('en-GB', { weekday: 'short' }) : new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
    const base = emb ? 380 : 0;
    const row = (i, n) => {
      const L = LOOK[i.kind] || LOOK.update, nw = isNew(i), req = i.kind === 'request' && !!i.who && !done[i.id];
      return { title: i.title, body: i.body, hasBody: !!i.body, when: ago(i.at), showWhen: !req && !done[i.id], isNew: nw && !req, icon: L[0], avCls: L[1],
        isRequest: req, hasDone: !!done[i.id], done: done[i.id] || '', accept: answer(i, true), decline: answer(i, false),
        acceptAria: 'Accept ' + i.title, declineAria: 'Decline ' + i.title,
        aria: i.title + '. ' + i.body + (nw ? '. New' : ''), open: go(i) };
    };
    const fresh = items.filter(isNew), older = items.filter((i) => !isNew(i));
    const groups = [];
    if (fresh.length) groups.push({ title: 'New', i: 0, items: fresh.map(row) });
    if (older.length) groups.push({ title: fresh.length ? 'Earlier' : 'Recent', i: 1, items: older.map((i, n) => row(i, n + fresh.length)) });
    return {
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)',
      LK: { back: lk('back', 'Main.dc.html') },
      empty: !items.length, groups, hasNew: fresh.length > 0, noNew: !fresh.length,
      markRead: () => { this.newIds = new Set(); if (M) M.inbox.readAll(); this.forceUpdate(); },
      hasToast: !!s.toast, toast: s.toast || ''
    };
  }
}
</script>
</body>
</html>
