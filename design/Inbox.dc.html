<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#F6F5FC}
button,a{font:inherit;cursor:pointer}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioInRow{from{opacity:0;transform:translateY(14px) scale(0.98)}to{opacity:1;transform:none}}
@keyframes motioInDot{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes motioInBell{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}
.motio-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F5FC; color: #1F1D47; font-family: 'Poppins', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex-shrink: 0; padding: 16px 20px 6px; display: flex; align-items: center; gap: 12px">
    <a href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(31,29,71,0.08)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D47" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; flex: 1">Notifications</h1>
  </div>

  <div class="motio-scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 8px 20px 40px; display: flex; flex-direction: column; gap: 8px">
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top: 60px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
        <span ref="{{ moRef }}" style="display: block; width: 120px; height: 112px"></span>
        <span style="font-size: 17px; font-weight: 700">You’re all caught up</span>
        <span style="max-width: 260px; font-size: 13px; line-height: 1.5; color: #6B6890">Cheers, friend requests, challenges and new versions of Motio show up here.</span>
      </div>
    </sc-if>
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
      <h2 style="margin: 10px 2px 2px; font-size: 15px; font-weight: 700">{{ g.title }}</h2>
      <sc-for list="{{ g.items }}" as="i" hint-placeholder-count="3">
        <button type="button" onClick="{{ i.open }}" aria-label="{{ i.aria }}" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-radius: 20px; background: {{ i.bg }}; color: #1F1D47; text-align: left; animation: motioInRow 460ms cubic-bezier(0.22, 1, 0.36, 1) {{ i.d }} backwards">
          <span aria-hidden="true" style="position: relative; width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: {{ i.c }}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1D47" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ i.icon }}"></path></svg></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600; line-height: 1.35">{{ i.title }}</span><span style="font-size: 12px; line-height: 1.4; color: #6B6890">{{ i.body }}</span></span>
          <span style="flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px"><span style="font-size: 11px; color: #8A87A8; white-space: nowrap">{{ i.when }}</span><sc-if value="{{ i.isNew }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 5px; background: #5B4FE0; animation: motioInDot 420ms cubic-bezier(0.34, 1.56, 0.64, 1) {{ i.d }} backwards"></span></sc-if></span>
        </button>
      </sc-for>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    const M = window.Motio;
    // What was new when the page opened keeps its dot while you look; everything counts as read from now on.
    this.newIds = M ? new Set(M.inbox.items().filter((i) => M.inbox.isNew(i)).map((i) => i.id)) : new Set();
    if (M) { M.inbox.readAll(); M.inbox.refresh(); }
  }
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const M = window.Motio, now = Date.now();
    const sample = [
      { id: 'a', kind: 'cheer', at: now - 6 * 60000, who: 2, title: 'Leyla cheered you on', body: 'Keep moving!' },
      { id: 'b', kind: 'request', at: now - 50 * 60000, who: 3, title: 'Murad Huseynov wants to be friends', body: 'Accept to compare your weeks.' },
      { id: 'c', kind: 'update', at: now - 26 * 3600000, title: 'Motio 4.1 is out', body: 'Notifications, personal records and trip editing.' },
      { id: 'd', kind: 'shared', at: now - 3 * 86400000, who: 2, title: 'Leyla shared their routes with you', body: 'Open their map to see it.' }
    ];
    const items = M ? M.inbox.items() : sample;
    const isNew = (i) => (M ? this.newIds && this.newIds.has(i.id) : i.at > now - 3600000);
    const LOOK = {
      cheer: ['#F2766B', 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z'],
      request: ['#F6C343', 'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5M19 8v6M16 11h6'],
      friend: ['#3DBF5C', 'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5M16 11l2 2 4-4'],
      challenge: ['#6E8CF7', 'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3'],
      shared: ['#B57BE0', 'M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14'],
      comment: ['#6E8CF7', 'M4 5h16v11H9l-5 4z'],
      update: ['#C9BDFF', 'M12 4v11M7 10l5 5 5-5M5 20h14'],
      record: ['#F6C343', 'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3']
    };
    const go = (i) => () => {
      const nav = (t) => this.props.onNav && this.props.onNav(t);
      if (i.who) window.__motioFriend = i.who;
      if (i.kind === 'request') nav('friends');
      else if (i.kind === 'shared') nav('friendmap');
      else if (i.kind === 'update') nav('update');
      else if (i.kind === 'record') nav('records');
      else if (i.kind === 'comment' || i.post) nav('feed');
      else if (i.kind === 'challenge') nav('recaps');
      else if (i.who) nav('friend');
    };
    const ago = (t) => { const m = Math.round((now - t) / 60000); return m < 1 ? 'now' : m < 60 ? m + ' min' : m < 1440 ? Math.round(m / 60) + ' h' : Math.round(m / 1440) + ' d'; };
    const base = emb ? 380 : 0;
    const row = (i, n) => {
      const L = LOOK[i.kind] || LOOK.update, nw = isNew(i);
      return { title: i.title, body: i.body, when: ago(i.at), isNew: nw, bg: nw ? '#FFFFFF' : 'rgba(255,255,255,0.55)', c: L[0], icon: L[1],
        d: base + Math.min(n, 10) * 45 + 'ms', aria: i.title + '. ' + i.body + (nw ? '. New' : ''), open: go(i) };
    };
    const fresh = items.filter(isNew), older = items.filter((i) => !isNew(i));
    const groups = [];
    if (fresh.length) groups.push({ title: 'New', items: fresh.map(row) });
    if (older.length) groups.push({ title: fresh.length ? 'Earlier' : 'Recent', items: older.map((i, n) => row(i, n + fresh.length)) });
    return {
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)',
      LK: { back: lk('back', 'Main.dc.html') },
      empty: !items.length, groups, moRef: window.MotioMascot ? window.MotioMascot.fox('sleep', 120) : null
    };
  }
}
</script>
</body>
</html>
