<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Location is off</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
a{color:inherit}
button{font:inherit;cursor:pointer}
button,a{transition:transform 140ms cubic-bezier(0.22,1,0.36,1),background-color 200ms ease}
button:active,a:active{transform:scale(0.96)}
@keyframes motioRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes motioBounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}60%{transform:translateY(-14px)}}
@keyframes motioPulse{0%{transform:scale(0.6);opacity:0.7}100%{transform:scale(1.6);opacity:0}}
@keyframes motioPop{0%{transform:scale(0.5);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes motioToast{0%{opacity:0;transform:translate(-50%,16px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
</style>
</helmet>
<div class="m-page" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 70px 32px 190px; text-align: center">
  <m-art name="pinoff" size="210"></m-art>
<sc-if value="{{ notOn }}" hint-placeholder-val="{{ true }}"><h1 class="m-title m-in" style="font-size: 32px; --i: 1">Motio can’t see where you go.</h1><span class="m-sub m-in" style="--i: 2; max-width: 300px">Location access is turned off, so routes, distance and speed are paused. Steps still count.</span><div class="m-list m-in" style="--i: 3; width: 100%; text-align: left"><div class="m-row"><b>1</b>Open your phone’s Settings</div><div class="m-row"><b>2</b>Find Motio › Location</div><div class="m-row"><b>3</b>Choose “While using the app”</div></div></sc-if><sc-if value="{{ on }}" hint-placeholder-val="{{ false }}"><h1 class="m-title m-in" style="font-size: 32px; --i: 1">location is on.</h1><span class="m-sub m-in" style="--i: 2; max-width: 300px">Routes and distances are back. Nice.</span></sc-if>
  <div style="position: absolute; left: 22px; right: 22px; bottom: 34px; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{ notOn }}" hint-placeholder-val="{{ true }}"><button type="button" class="m-btn wide" onClick="{{ openSettings }}">Open phone settings</button></sc-if><a class="m-btn w wide" href="{{ LK.home.href }}" onClick="{{ LK.home.go }}" style="text-decoration: none">Back to Today</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const s = this.state || {};
    const on = !!s.on;
    return { foxRef: window.MotioMascot ? window.MotioMascot.fox('curious', 150) : null,
      LK: { home: lk('home', 'Main.dc.html') },
      on, notOn: !on,
      pinColor: on ? '#3DBF5C' : '#F2766B', slashOp: on ? 0 : 1,
      pulse: on ? 'rgba(61,191,92,0.35)' : 'rgba(242,118,107,0.25)',
      pinAnim: on ? 'motioBounce 900ms ease 2' : 'none',
      // Prototype: pretend the user flipped the switch in system settings and came back.
      openSettings: () => {
        this.setState({ toast: 'Opening Settings…' });
        setTimeout(() => this.setState({ toast: null, on: true }), 1600);
      },
      homeLabel: on ? 'Continue to Today' : 'Use Motio without location',
      homeBg: on ? '#1F1D47' : 'rgba(255,255,255,0.55)', homeFg: on ? '#FFFFFF' : '#1F1D47',
      hasToast: !!s.toast, toast: s.toast || ''
    };
  }
}
</script>
</body>
</html>
