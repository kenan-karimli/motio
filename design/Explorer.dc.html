<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Explorer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
button,a{font:inherit;cursor:pointer}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioPanelUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@property --to{syntax:'<integer>';inherits:false;initial-value:0}
@keyframes motioCount{from{--to:0}}
.motio-count{counter-reset:n var(--to);animation:motioCount 1200ms cubic-bezier(0.22,1,0.36,1) var(--delay,0ms) backwards}
.motio-count::after{content:counter(n)}
.motio-tiles{filter:saturate(0.6) brightness(1.05)}
</style>
</helmet>
<div style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #16142F; color: #1F1D47; font-family: 'Poppins', system-ui, sans-serif">
  <div ref="{{ mapRef }}" style="position: absolute; inset: 0"></div>
  <sc-if value="{{ noMap }}" hint-placeholder-val="{{ true }}">
    <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; inset: 0">
      <defs><radialGradient id="hole"><stop offset="0" stop-color="#000"></stop><stop offset="0.7" stop-color="#000" stop-opacity="0.9"></stop><stop offset="1" stop-color="#000" stop-opacity="0"></stop></radialGradient>
        <mask id="fog"><rect width="390" height="844" fill="#fff"></rect><g fill="url(#hole)"><circle cx="120" cy="300" r="26"></circle><circle cx="140" cy="318" r="26"></circle><circle cx="162" cy="334" r="26"></circle><circle cx="186" cy="346" r="26"></circle><circle cx="210" cy="352" r="26"></circle><circle cx="236" cy="350" r="26"></circle><circle cx="258" cy="338" r="26"></circle><circle cx="276" cy="318" r="26"></circle><circle cx="290" cy="294" r="26"></circle><circle cx="120" cy="276" r="26"></circle><circle cx="118" cy="250" r="26"></circle><circle cx="186" cy="372" r="26"></circle><circle cx="186" cy="398" r="26"></circle></g></mask></defs>
      <rect width="390" height="844" fill="#E4E8F0"></rect>
      <g stroke="#FFFFFF" stroke-width="8" fill="none"><path d="M-10 330 C 120 300, 240 380, 400 300"></path><path d="M180 -10 L 200 860"></path><path d="M60 -10 C 90 300, 40 500, 80 860"></path></g>
      <rect width="390" height="844" fill="#16142F" fill-opacity="0.86" mask="url(#fog)"></rect>
    </svg>
  </sc-if>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 140px; z-index: 550; pointer-events: none; background: linear-gradient(180deg, rgba(22,20,47,0.85), rgba(22,20,47,0))"></div>
  <a href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back" style="position: absolute; left: 20px; top: 16px; z-index: 600; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D47" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
  <div style="position: absolute; left: 76px; right: 20px; top: 20px; z-index: 600; color: #FFFFFF"><div style="font-size: 20px; font-weight: 700">Explorer</div><div style="font-size: 12px; opacity: 0.75">The clear parts are where you’ve been</div></div>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 16px; z-index: 600; padding: 20px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 12px 40px rgba(10,8,30,0.35); display: flex; flex-direction: column; gap: 14px; animation: motioPanelUp 600ms cubic-bezier(0.22, 1, 0.36, 1) {{ cardDelay }} backwards">
    <div style="display: flex; align-items: baseline; gap: 6px">
      <span style="font-size: 52px; font-weight: 700; line-height: 1; letter-spacing: -1.5px"><span class="motio-count" style="--to: {{ pctWhole }}; --delay: {{ countDelay }}"></span>.<span class="motio-count" style="--to: {{ pctTenth }}; --delay: {{ countDelay }}"></span>%</span>
      <span style="font-size: 13px; color: #4A4770; line-height: 1.3">of the city around<br>your home explored</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="padding: 10px 12px; border-radius: 16px; background: #F6F5FC"><div style="font-size: 18px; font-weight: 700"><span class="motio-count" style="--to: {{ areas }}; --delay: {{ countDelay }}"></span></div><div style="font-size: 10.5px; color: #6B6890">areas uncovered</div></div>
      <div style="padding: 10px 12px; border-radius: 16px; background: #F6F5FC"><div style="font-size: 18px; font-weight: 700">{{ km2 }}</div><div style="font-size: 10.5px; color: #6B6890">km² explored</div></div>
      <div style="padding: 10px 12px; border-radius: 16px; background: #F6F5FC"><div style="font-size: 18px; font-weight: 700; color: {{ freshColor }}">{{ freshSign }}<span class="motio-count" style="--to: {{ fresh }}; --delay: {{ countDelay }}"></span></div><div style="font-size: 10.5px; color: #6B6890">new this week</div></div>
    </div>
    <div style="display: flex; gap: 8px">
      <button type="button" onClick="{{ latest }}" style="flex: 1; height: 44px; border: 0; border-radius: 22px; background: #1F1D47; color: #FFFFFF; font-size: 13px; font-weight: 600">Latest discovery</button>
      <button type="button" onClick="{{ home }}" style="flex: 1; height: 44px; border: 2px solid #E3E1F3; border-radius: 22px; background: #FFFFFF; color: #1F1D47; font-size: 13px; font-weight: 600">Around home</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this.mapT); if (this.ctrl) this.ctrl.destroy(); }
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const M = window.Motio;
    const x = M ? M.explorer() : { cells: [], count: 1386, newThisWeek: 74, pct: 4.2, km2: 31.2, home: { lat: 40.4093, lng: 49.8671 } };
    // The map and fog start after the page has slid in, so the slide stays smooth.
    if (M && window.MotioMap && this.mapEl && !this.ctrl && !this.mapT) this.mapT = setTimeout(() => { this.ctrl = window.MotioMap.mountFog(this.mapEl, x.cells, x.home); }, 440);
    const newest = x.cells.reduce((a, c) => (!a || c[2] > a[2] ? c : a), null);
    const pct = Math.round(x.pct * 10);
    return {
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)',
      LK: { back: lk('back', 'You.dc.html') },
      mapRef: (el) => { const first = el && !this.mapEl; this.mapEl = el; if (first && M) requestAnimationFrame(() => this.setState({ mapReady: true })); },
      noMap: !M,
      cardDelay: emb ? '380ms' : '0ms', countDelay: emb ? '560ms' : '200ms',
      pctWhole: Math.floor(pct / 10), pctTenth: pct % 10,
      areas: x.count, km2: x.km2 < 10 ? x.km2.toFixed(1) : Math.round(x.km2), fresh: x.newThisWeek, freshSign: x.newThisWeek ? '+' : '', freshColor: x.newThisWeek ? '#2FA84D' : '#1F1D47',
      latest: () => { if (this.ctrl && newest) this.ctrl.fly(newest[0], newest[1], 16); },
      home: () => { if (this.ctrl) this.ctrl.fly(x.home.lat, x.home.lng, 13); }
    };
  }
}
</script>
</body>
</html>
