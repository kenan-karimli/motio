<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Explorer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
button,a{font:inherit;cursor:pointer}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioPanelUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@property --to{syntax:'<integer>';inherits:false;initial-value:0}
@keyframes motioCount{from{--to:0}}
.motio-count{counter-reset:n var(--to);animation:motioCount 1200ms cubic-bezier(0.22,1,0.36,1) var(--delay,0ms) backwards}
.motio-count::after{content:counter(n)}
.motio-scroll::-webkit-scrollbar{display:none}
.leaflet-control-attribution{font-size:8px!important;background:transparent!important;color:#999!important}
.leaflet-control-attribution a{color:#999!important}
</style>
</helmet>
<div class="m-page" style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden">
  <div class="m-topbar"><a class="m-icon" href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back"><m-ic n="back"></m-ic></a><span class="m-tt">Explorer</span><span style="width: 44px"></span></div>
  <div class="motio-scroll" style="position: absolute; inset: 0; overflow-y: auto; padding: 108px 20px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
    <div class="head m-in" style="--i: 0"><div class="t"><span class="m-sub">How much of your city you’ve seen</span><h1 class="m-title">explorer.</h1></div></div>
    <div class="m-card dark m-in" style="--i: 1; padding: 20px; display: flex; align-items: flex-end; justify-content: space-between">
      <div><div class="m-label">Of the city</div><div class="m-num" style="font-size: 58px; margin-top: 8px"><span class="motio-count" style="--to: {{ pctWhole }}; --delay: {{ countDelay }}"></span>.<span class="motio-count" style="--to: {{ pctTenth }}; --delay: {{ countDelay }}"></span>%</div></div>
      <span class="m-sub" style="text-align: right">{{ areas }} squares<br><b style="color: {{ freshColor }}">{{ freshLine }}</b> this week</span>
    </div>
    <div class="m-card m-in" style="--i: 2; padding: 0; overflow: hidden; position: relative; height: 300px; flex-shrink: 0">
      <div ref="{{ mapRef }}" style="position: absolute; inset: 0; z-index: 0"></div>
      <span class="m-chip" style="position: absolute; left: 12px; bottom: 12px; z-index: 500; height: 30px; font-size: 12px; cursor: default; box-shadow: 0 4px 14px rgba(0,0,0,.08)">Each square is 150 m</span>
    </div>
    <div class="m-card m-in" style="--i: 3; display: flex; flex-direction: column; gap: 6px; padding: 12px">
      <div class="m-row"><m-ic n="grid" s="18"></m-ic><span style="flex: 1; font-size: 14px">Squares uncovered</span><b>{{ areas }}</b></div>
      <div class="m-row"><m-ic n="map" s="18"></m-ic><span style="flex: 1; font-size: 14px">Area explored</span><b>{{ km2 }} km²</b></div>
      <div class="m-row"><m-ic n="home" s="18"></m-ic><span style="flex: 1; font-size: 14px">Your city: 8 km around home</span><b>{{ pctLabel }}</b></div>
    </div>
    <div class="grid2 m-in" style="--i: 4"><button type="button" class="m-btn w" onClick="{{ home }}">Around home</button><button type="button" class="m-btn" onClick="{{ latest }}">Latest discovery</button></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this.mapT); if (this.ctrl) this.ctrl.destroy(); }
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const M = window.Motio;
    const x = M ? M.explorer() : { cells: [], count: 1386, newThisWeek: 74, pct: 4.2, km2: 31.2, home: { lat: 40.4093, lng: 49.8671 } };
    // The map and fog start after the page has slid in, so the slide stays smooth.
    if (M && window.MotioMap && this.mapEl && !this.ctrl && !this.mapT) this.mapT = setTimeout(() => { this.ctrl = window.MotioMap.mountFog(this.mapEl, x.cells, x.home); }, 440);
    const newest = x.cells.reduce((a, c) => (!a || c[2] > a[2] ? c : a), null);
    const pct = Math.round(x.pct * 10);
    return {
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)',
      LK: { back: lk('back', 'You.dc.html') },
      mapRef: this.mapRefFn || (this.mapRefFn = (el) => { const first = el && !this.mapEl; this.mapEl = el; if (first && M) requestAnimationFrame(() => this.setState({ mapReady: true })); }),
      cardDelay: emb ? '380ms' : '0ms', countDelay: emb ? '560ms' : '200ms',
      pctWhole: Math.floor(pct / 10), pctTenth: pct % 10,
      areas: x.count.toLocaleString('en-US'), km2: x.km2 < 10 ? x.km2.toFixed(1) : Math.round(x.km2), pctLabel: (pct / 10).toFixed(1) + '%',
      freshLine: x.newThisWeek ? '+' + x.newThisWeek + ' new' : 'Nothing new', freshColor: x.newThisWeek ? 'var(--m-goal)' : 'var(--m-on-dark)',
      latest: () => { if (this.ctrl && newest) this.ctrl.fly(newest[0], newest[1], 16); },
      home: () => { if (this.ctrl) this.ctrl.fly(x.home.lat, x.home.lng, 13); }
    };
  }
}
</script>
</body>
</html>
