<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Workout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
button,a{font:inherit;cursor:pointer}
@keyframes motioStoryIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes motioSoftIn{from{opacity:0}to{opacity:1}}
@keyframes motioCountPop{0%{opacity:0;transform:scale(1.8)}25%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(0.92)}100%{opacity:0;transform:scale(0.6)}}
@keyframes motioBlink{0%,100%{opacity:1}50%{opacity:0.35}}
@keyframes lvHold{from{stroke-dashoffset:176}to{stroke-dashoffset:0}}
.leaflet-control-attribution{font-size:8px!important;background:transparent!important;color:#999!important}
.leaflet-control-attribution a{color:#999!important}
.lv-glass{background:color-mix(in srgb,var(--m-card) 62%,transparent);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 16px rgba(0,0,0,.08)}
.lv-ctl{border:0;padding:0;position:relative;touch-action:none}
</style>
</helmet>
<div class="m-page" style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden">
  <sc-if value="{{ picking }}" hint-placeholder-val="{{ true }}">
    <div class="scr nt" style="padding-bottom: 28px">
      <div class="top"><a href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Close" class="m-icon"><m-ic n="x"></m-ic></a><span class="m-sub">{{ today }}</span><span style="width: 44px"></span></div>
      <div class="m-in" style="--i: 0; margin-top: 6px"><h1 class="m-title">start a workout.</h1></div>
      <div class="m-in" style="--i: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px">
        <sc-for list="{{ kinds }}" as="k" hint-placeholder-count="3"><button type="button" class="m-option {{ k.cls }}" onClick="{{ k.pick }}" aria-pressed="{{ k.on }}" style="min-height: 56px">{{ k.label }}</button></sc-for>
      </div>
      <div class="m-in" style="--i: 2; flex: 1; min-height: 120px; position: relative; border-radius: 28px; overflow: hidden; background: var(--m-card)">
        <div ref="{{ pickMapRef }}" style="position: absolute; inset: 0"></div>
        <sc-if value="{{ hasLast }}" hint-placeholder-val="{{ true }}"><span class="m-chip lv-glass" style="position: absolute; left: 12px; top: 12px; z-index: 500; height: 32px; font-size: 12px; cursor: default">{{ lastChip }}</span></sc-if>
      </div>
      <div class="m-card m-in" style="--i: 3; display: flex; flex-direction: column; gap: 10px; padding: 16px">
        <span class="m-label">Goal</span>
        <div style="display: flex; gap: 6px"><sc-for list="{{ goals }}" as="g" hint-placeholder-count="3"><button type="button" class="m-chip {{ g.cls }}" onClick="{{ g.pick }}" aria-pressed="{{ g.on }}" style="{{ g.style }}">{{ g.label }}</button></sc-for></div>
        <sc-if value="{{ hasLast }}" hint-placeholder-val="{{ true }}"><div style="display: flex; justify-content: space-between; padding-top: 4px"><span class="m-sub">{{ lastWhen }}</span><b style="font-size: 13px">{{ lastStats }}</b></div></sc-if>
      </div>
      <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}"><span role="status" class="m-sub" style="text-align: center; color: var(--m-warn)">{{ error }}</span></sc-if>
      <div class="m-pop" style="--i: 4; display: flex; justify-content: center; margin: 8px 0 4px"><button type="button" class="m-btn" onClick="{{ begin }}" aria-label="{{ startAria }}" style="width: 92px; height: 92px; border-radius: 46px; padding: 0; font-size: 17px">Start</button></div>
    </div>
  </sc-if>

  <sc-if value="{{ counting }}" hint-placeholder-val="{{ false }}">
    <div aria-live="assertive" style="position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
      <span class="m-label">{{ modeName }} starts in</span>
      <sc-if value="{{ c3 }}" hint-placeholder-val="{{ true }}"><span class="m-num" style="font-size: 180px; letter-spacing: -8px; animation: motioCountPop 900ms cubic-bezier(0.22, 1, 0.36, 1) both">3</span></sc-if>
      <sc-if value="{{ c2 }}" hint-placeholder-val="{{ false }}"><span class="m-num" style="font-size: 180px; letter-spacing: -8px; animation: motioCountPop 900ms cubic-bezier(0.22, 1, 0.36, 1) both">2</span></sc-if>
      <sc-if value="{{ c1 }}" hint-placeholder-val="{{ false }}"><span class="m-num" style="font-size: 180px; letter-spacing: -8px; animation: motioCountPop 900ms cubic-bezier(0.22, 1, 0.36, 1) both">1</span></sc-if>
    </div>
  </sc-if>

  <sc-if value="{{ recording }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 360px; z-index: 0"><div ref="{{ liveMapRef }}" style="position: absolute; inset: 0"></div></div>
    <div style="position: absolute; top: 52px; left: 16px; right: 16px; z-index: 5; display: flex; justify-content: space-between; align-items: center">
      <span class="m-chip {{ tint }}" style="height: 36px; cursor: default"><span class="m-dot" style="background: {{ dotColor }}; animation: {{ dotAnim }}"></span>{{ stateLabel }}</span>
      <a href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Hide the workout screen" class="m-icon lv-glass"><m-ic n="down"></m-ic></a>
    </div>
    <div class="m-page" style="position: absolute; left: 0; right: 0; top: 330px; bottom: 0; z-index: 2; border-radius: 32px 32px 0 0; padding: 20px 20px 34px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
      <div class="m-card dark m-in" style="padding: 22px; display: flex; flex-direction: column; gap: 6px; align-items: center; opacity: {{ recOp }}; transition: opacity .4s">
        <span class="m-label">Time</span>
        <span class="m-num" style="font-size: 64px; letter-spacing: -3px">{{ clock }}</span>
        <span class="m-sub">{{ goalLine }}<b style="color: var(--m-goal)">{{ goalPct }}</b></span>
        <sc-if value="{{ hasGoal }}" hint-placeholder-val="{{ true }}"><div class="m-progress" style="width: 100%; margin-top: 10px; background: rgba(128,128,128,.25)"><i style="width: {{ goalW }}; background: var(--m-goal)"></i></div></sc-if>
      </div>
      <div class="grid3 m-in" style="--i: 1">
        <sc-for list="{{ stats }}" as="st" hint-placeholder-count="3"><div class="m-card" style="padding: 14px"><div class="m-label">{{ st.k }}</div><div class="m-num s" style="margin-top: 6px">{{ st.v }}</div></div></sc-for>
      </div>
      <span class="sp"></span>
      <div style="display: flex; justify-content: center; align-items: center; gap: 22px">
        <button type="button" class="m-icon lv-ctl" onPointerDown="{{ holdStart }}" onPointerUp="{{ holdEnd }}" onPointerLeave="{{ holdEnd }}" aria-label="Hold to finish and save" style="width: 62px; height: 62px; border-radius: 31px">
          <m-ic n="stop" s="20"></m-ic>
          <sc-if value="{{ holding }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="62" height="62" viewBox="0 0 62 62" style="position: absolute; inset: 0; transform: rotate(-90deg)"><circle cx="31" cy="31" r="28" fill="none" stroke="var(--m-warn)" stroke-width="3" stroke-linecap="round" stroke-dasharray="176" style="animation: lvHold 800ms linear forwards"></circle></svg></sc-if>
        </button>
        <sc-if value="{{ running }}" hint-placeholder-val="{{ true }}"><button type="button" class="m-icon ink lv-ctl" onClick="{{ pause }}" aria-label="Pause workout" style="width: 84px; height: 84px; border-radius: 42px"><m-ic n="pause" s="28"></m-ic></button></sc-if>
        <sc-if value="{{ paused }}" hint-placeholder-val="{{ false }}"><button type="button" class="m-icon ink lv-ctl" onClick="{{ resume }}" aria-label="Resume workout" style="width: 84px; height: 84px; border-radius: 42px"><m-ic n="play" s="28"></m-ic></button></sc-if>
        <span style="width: 62px"></span>
      </div>
      <span class="m-sub" style="text-align: center; color: {{ hintColor }}">{{ hint }}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // Ticks once a second while open, so the clock and pace stay live.
  componentDidMount() {
    this.tick = setInterval(() => this.forceUpdate(), 1000);
  }
  componentWillUnmount() { clearInterval(this.tick); clearTimeout(this.countT); clearTimeout(this.holdT); clearTimeout(this.mapT); if (this.pickMap) this.pickMap.destroy(); if (this.liveMap) this.liveMap.destroy(); }
  countdown(mode) {
    const M = window.Motio;
    const step = (n) => {
      if (n > 0) { this.setState({ count: n, error: null }); this.countT = setTimeout(() => step(n - 1), 900); return; }
      const done = (r) => this.setState({ count: 0, error: r && r.ok === false ? 'Motio needs location access to record a workout.' : null });
      if (M) M.startWorkout(mode).then(done); else done({ ok: true });
    };
    step(3);
  }
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const s = this.state || {};
    const M = window.Motio;
    // [label, colour, tint, noun for "Last run"]
    const MODES = { walk: ['Walk', '#2FB457', 'tw', 'walk'], run: ['Run', '#E5604F', 'tr', 'run'], bike: ['Ride', '#4F7BF0', 'tb', 'ride'] };
    const STATE = { walk: 'Walking', run: 'Running', bike: 'Riding' };
    const w = M ? M.workout() : null;
    const pick = s.pick || (M && M.settings().lastWorkout) || 'run';
    const mode = w ? (MODES[w.mode] ? w.mode : 'walk') : pick;
    const m = MODES[mode];
    const mi = M && M.settings().unit === 'mi';
    const unitM = mi ? 1609.34 : 1000;
    const clock = (ms) => { const t = Math.max(0, Math.round(ms / 1000)), h = Math.floor(t / 3600), mm = Math.floor(t / 60) % 60, ss = t % 60; return h ? h + ':' + String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0') : mm + ':' + String(ss).padStart(2, '0'); };
    const paceOf = (sec) => Math.floor(sec / 60) + ':' + String(Math.round(sec % 60) % 60).padStart(2, '0');
    const km = w ? w.distanceM / unitM : 0;
    const paceS = w && km >= 0.05 && w.activeMs / 1000 / km < 3600 ? w.activeMs / 1000 / km : 0;
    const avg = w && w.activeMs > 60000 && km >= 0.05 ? Math.min(80, km / (w.activeMs / 3600000)) : 0;
    const stats = !w ? [] : mode === 'bike'
      ? [{ v: km.toFixed(2) + (mi ? ' mi' : ' km'), k: 'Distance' }, { v: avg.toFixed(1), k: mi ? 'Avg mph' : 'Avg km/h' }, { v: (w.maxSpeed * (mi ? 2.23694 : 3.6)).toFixed(0), k: mi ? 'Top mph' : 'Top km/h' }]
      : [{ v: km.toFixed(2) + (mi ? ' mi' : ' km'), k: 'Distance' }, { v: paceS ? paceOf(paceS) : '–:––', k: 'Pace' }, { v: (w.steps || 0).toLocaleString('en-US'), k: 'Steps' }];
    // Goal: free, a distance or a time. Saved, so it survives leaving the screen mid-workout.
    const goal = (M && M.settings().workoutGoal) || 'free';
    const GOALS = { free: 'Free ' + MODES[pick][3], '5km': mi ? '3 mi' : '5 km', '30min': '30 min' };
    const prog = !w || goal === 'free' ? 0 : goal === '30min' ? w.activeMs / 1800000 : w.distanceM / ((mi ? 3 : 5) * unitM);
    // Your last workout of this kind: drawn on the map and shown under the goal.
    const now = Date.now(), DAY = 86400000;
    if (!w && this.lastKey !== pick) { this.lastKey = pick; this.last = M ? M.route(now - 90 * DAY, now).filter((r) => r.mode === pick && !r.live).pop() || null : null; }
    const last = this.last;
    const near = (p) => { if (!M || !p) return null; const k = Math.cos((p[0] * Math.PI) / 180); return M.places().find((x) => Math.hypot((x.lat - p[0]) * 111320, (x.lng - p[1]) * 111320 * k) < 300) || null; };
    const lastPlace = last ? near(last.points[Math.floor(last.points.length / 2)]) || near(last.points[0]) : null;
    const lastKm = last ? last.distanceM / unitM : 0;
    // Maps start after the slide-in so the slide stays smooth.
    if (window.MotioMap && !this.mapT) {
      if (!w && this.pickEl && !this.mapT && (!this.pickMap || this.pickFor !== pick)) {
        this.mapT = setTimeout(() => { this.mapT = null; if (!this.pickEl) return; if (this.pickMap) this.pickMap.destroy(); this.pickFor = pick; this.pickMap = window.MotioMap.mount(this.pickEl, this.last ? [this.last] : []); }, this.pickMap ? 0 : 440);
      }
      if (w && this.liveEl) {
        const route = w.points && w.points.length > 1 ? [{ id: 'w', mode: w.mode, color: m[1], start: w.start, end: now, points: w.points, live: true }] : [];
        const n = (w.points || []).length;
        if (!this.liveMap && !this.mapT) this.mapT = setTimeout(() => { this.mapT = null; if (!this.liveEl) return; this.liveMap = window.MotioMap.mount(this.liveEl, route); this.liveN = n; this.liveMap.setTime(now, false); }, 300);
        else if (this.liveN !== n) { this.liveN = n; this.liveMap.update(route); this.liveMap.setTime(now, false); }
      }
    }
    const counting = !!s.count;
    return {
      rootAnim: emb ? 'motioStoryIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms ease',
      LK: { back: lk('back', 'Main.dc.html') },
      today: new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }),
      // Stable ref callbacks: a new function each render would detach and reattach the map every second.
      pickMapRef: this.pickRefFn || (this.pickRefFn = (el) => { this.pickEl = el; if (!el && this.pickMap) { this.pickMap.destroy(); this.pickMap = null; } }),
      liveMapRef: this.liveRefFn || (this.liveRefFn = (el) => { this.liveEl = el; if (!el && this.liveMap) { this.liveMap.destroy(); this.liveMap = null; } }),
      picking: !w && !counting, counting, recording: !!w, running: !!w && !w.paused, paused: !!w && w.paused,
      c3: s.count === 3, c2: s.count === 2, c1: s.count === 1, modeName: MODES[pick][0],
      kinds: Object.keys(MODES).map((key) => ({ label: MODES[key][0], on: key === pick, cls: key === pick ? 'on' : '',
        pick: () => { this.setState({ pick: key, error: null }); if (M) M.setSetting('lastWorkout', key); } })),
      goals: Object.keys(GOALS).map((k) => ({ label: GOALS[k], on: goal === k, cls: goal === k ? 'on' : '', style: goal === k ? '' : 'background: var(--m-soft)',
        pick: () => { if (M) M.setSetting('workoutGoal', k); this.forceUpdate(); } })),
      hasLast: !!last || !M, lastChip: last ? 'Last ' + MODES[pick][3] + (lastPlace ? ' · ' + lastPlace.name : '') : 'Last run · Boulevard',
      lastWhen: last ? 'Last ' + MODES[pick][3] + ' · ' + new Date(last.start).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : 'Last run · Sun 22 Nov',
      lastStats: last ? lastKm.toFixed(1) + (mi ? ' mi' : ' km') + (pick === 'bike' ? ' · ' + Math.round(lastKm / Math.max(1e-6, (last.end - last.start) / 3600000)) + (mi ? ' mph' : ' km/h') : lastKm >= 0.1 ? ' · ' + paceOf((last.end - last.start) / 1000 / lastKm) + (mi ? ' /mi' : ' /km') : '') : '6.2 km · 5:48 /km',
      startAria: 'Start ' + MODES[pick][0].toLowerCase(),
      begin: () => this.countdown(pick),
      hasError: !!s.error, error: s.error || '',
      tint: m[2], stateLabel: w && w.paused ? 'Paused' : STATE[mode],
      dotColor: w && w.paused ? 'var(--m-mute)' : m[1], dotAnim: w && w.paused ? 'motioBlink 1.2s ease-in-out infinite' : 'none',
      recOp: w && w.paused ? 0.6 : 1,
      clock: w ? clock(w.activeMs) : '0:00',
      hasGoal: !!w && goal !== 'free', goalW: Math.min(100, prog * 100).toFixed(1) + '%',
      goalLine: !w ? '' : goal === 'free' ? (w.paused ? 'Paused' : STATE[mode]) : 'of ' + GOALS[goal] + ' goal · ', goalPct: !w || goal === 'free' ? '' : Math.min(100, Math.floor(prog * 100)) + '%',
      stats,
      pause: () => M && M.pauseWorkout(true),
      resume: () => M && M.pauseWorkout(false),
      holding: !!s.holding,
      hint: s.error && w ? s.error : s.nudge ? 'Keep holding stop to finish' : w && w.paused ? 'Paused · hold stop to finish and save' : 'Hold stop to finish',
      hintColor: s.error && w ? 'var(--m-warn)' : '',
      // Finishing needs a deliberate hold, so a pocket tap never ends a workout.
      holdStart: () => { clearTimeout(this.holdT); this.setState({ holding: true, nudge: false }); this.holdT = setTimeout(() => {
        this.setState({ holding: false });
        if (!M) return;
        const id = M.finishWorkout();
        if (id) { window.__motioTrip = id; if (this.props.onNav) this.props.onNav('summary'); }
        else this.setState({ error: 'Not saved: you need at least a minute and 100 m.' });
      }, 800); },
      holdEnd: () => { if (!s.holding) return; clearTimeout(this.holdT); this.setState({ holding: false, nudge: true }); }
    };
  }
}
</script>
</body>
</html>
