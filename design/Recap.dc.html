<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Week, wrapped</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit;cursor:pointer}
@keyframes motioStoryIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes motioFill{from{width:0}to{width:100%}}
@keyframes motioSwap{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
button,a{transition:transform 140ms cubic-bezier(0.22,1,0.36,1)}
button:active,a:active{transform:scale(0.96)}
@keyframes motioShUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes motioShDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes motioShFade{from{opacity:0}to{opacity:1}}
@keyframes motioShFadeOut{from{opacity:1}to{opacity:0}}
@keyframes motioToast{0%{opacity:0;transform:translate(-50%,16px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
@keyframes motioDlgIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
@keyframes motioLeaveRight{from{transform:translateX(0)}to{transform:translateX(100%)}}
@keyframes motioLeaveDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes motioReturn{from{transform:translateX(-72px);opacity:0.4}to{transform:translateX(0);opacity:1}}
@keyframes motioReturnScale{from{transform:scale(0.94);opacity:0.5}to{transform:scale(1);opacity:1}}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioStoryIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioSoftBackIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioSoftUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes motioSoftOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(24px)}}
@keyframes motioSoftDown{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(28px)}}
</style>
</helmet>
<div class="m-page {{ themeCls }}" onpointerdown="{{ sDown }}" onpointermove="{{ sMove }}" onpointerup="{{ sUp }}" onpointercancel="{{ sUp }}" style="touch-action: none; animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden">

  <div role="group" aria-roledescription="story" aria-label="{{ storyLabel }}" style="position: absolute; inset: 0; overflow: hidden">
    <div ref="{{ sceneRef }}" style="position: absolute; inset: 0"></div>
  </div>

  <div role="progressbar" aria-label="{{ storyLabel }}" aria-valuemin="1" aria-valuemax="{{ storyCount }}" aria-valuenow="{{ storyNum }}" style="position: absolute; top: 10px; left: 16px; right: 16px; display: flex; gap: 4px">
    <sc-for list="{{ bars }}" as="b" hint-placeholder-count="5"><span style="flex: 1; height: 3px; border-radius: 2px; background: var(--m-line); overflow: hidden"><span style="display: block; height: 100%; width: {{ b.w }}; border-radius: 2px; background: var(--m-ink); animation: {{ b.anim }}; animation-play-state: {{ b.play }}"></span></span></sc-for>
  </div>

  <div style="position: absolute; top: 24px; left: 16px; right: 16px; z-index: 6; display: flex; justify-content: space-between; align-items: center">
    <span class="m-sub">{{ R.bar }}</span>
    <a class="m-icon" href="{{ LK.k0.href }}" onClick="{{ LK.k0.go }}" aria-label="Close recap" style="background: transparent"><m-ic n="x"></m-ic></a>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 110px; bottom: 110px">
    <button aria-label="Previous story" onClick="{{ prev }}" style="position: absolute; left: 0; top: 0; bottom: 0; width: 35%; border: 0; padding: 0; background: transparent; z-index: 5; cursor: w-resize"></button>
    <sc-if value="{{ notLast }}" hint-placeholder-val="{{ true }}">
      <button aria-label="Next story" onClick="{{ next }}" style="position: absolute; right: 0; top: 0; bottom: 0; width: 65%; border: 0; padding: 0; background: transparent; z-index: 5; cursor: e-resize"></button>
    </sc-if>
    <sc-if value="{{ isLast }}" hint-placeholder-val="{{ false }}">
      <a href="{{ LK.k1.href }}" onClick="{{ LK.k1.go }}" aria-label="Finish recap and go back to Recaps" style="position: absolute; right: 0; top: 0; bottom: 0; width: 65%; z-index: 5; cursor: e-resize"></a>
    </sc-if>
  </div>

  <sc-if value="{{ isBegin }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 22px; right: 22px; bottom: 34px; z-index: 6"><button type="button" class="m-btn wide" onClick="{{ next }}">Begin</button></div>
  </sc-if>
  <sc-if value="{{ notBegin }}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 22px; right: 22px; bottom: 34px; z-index: 6; display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
      <button type="button" class="m-btn w" onClick="{{ save }}" disabled="{{ saving }}">Save</button>
      <button type="button" class="m-btn" onClick="{{ openShare }}">Share</button>
    </div>
  </sc-if>

  <sc-if value="{{ shareOpen }}" hint-placeholder-val="{{ false }}">
    <dc-import name="ShareEditor" job="{{ shareJob }}" on-close="{{ closeShare }}"></dc-import>
  </sc-if>

  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 50%; bottom: 100px; z-index: 50; display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 22px; background: var(--m-ink); color: var(--m-bg-hi); font: 600 13px var(--m-font); white-space: nowrap; animation: motioToast 2300ms ease forwards"><m-ic n="check" s="16"></m-ic>{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

    try { window.localStorage.setItem('motio.dir', v); } catch (e) { /* blocked */ }

  standaloneNav(e, target) {

  }
  showToast(msg) {
    clearTimeout(this.toastTimer);

    this.toastTimer = setTimeout(() => this.setState({ toast: null }), 2330);
  }
  // The card for the slide you're on: the same card the share image is made from.

      ['distance', { kicker: R.head, lead: R.This + ' you covered', num: R.distNum, unit: R.unit, line: R.compareLong, bars: R.byDistNum }],
      ['time', { kicker: R.head, lead: 'You spent', big: R.time, line: R.timeVsLine, hourly: R.hourly, peak: R.peak === '—' ? 'No moves yet' : 'Peak hour ' + R.peak + (R.second !== '—' ? ' · second wind ' + R.second : '') }],
      ['highlights', { kicker: R.head, title: 'Highlights\nyou’ll brag about', tiles: [{ k: R.PRTAG, v: R.prValue, s: R.prSub }, { k: 'Wildest day', v: R.wildDay, s: R.wildSub }, { k: 'Early bird', v: R.early, s: 'earliest start, ' + R.earlyDay }, { k: 'Best step day', v: R.bestSteps, s: 'steps on ' + R.bestStepsDay }] }],
      ['wrap', { kicker: R.head, lead: R.This + ' you were', name: R.pers, stat: R.rareB + ' ' + R.rareT, grid: [{ v: R.dist, k: 'covered' }, { v: R.time, k: 'on the move' }, { v: R.steps, k: 'steps' }], end: R.nextLine }]
    ];
    const [kind, data] = cards[Math.min(4, i)];
    return { kind, data, i, text: R.head + ': ' + R.dist + '. ' + R.time + ' on the move, ' + R.steps + ' steps. Tracked with Motio.' };
  }
  componentDidMount() {

    this.onStorage = (e) => { if (e.key === 'motio.recapStyle' || e.key === 'motio.shareLook') this.forceUpdate(); };
    window.addEventListener('storage', this.onStorage);
  }
  componentWillUnmount() {

  // Stories move on by themselves (like Instagram); holding a finger on the screen pauses them.

  pause() { if (this.paused) return; clearTimeout(this.adv); this.left = Math.max(400, this.left - (Date.now() - this.advAt)); this.paused = true; this.setState({ paused: true }); }

  // Every number in the story, for one day, week or month. Without window.Motio (the design canvas) it's the sample week.

    const sample = {
      kind: 'week', bar: 'Your week · 18–24 Nov', fullName: 'Alex Mammadov', coverSay: ['That’s ', '2h 10m more', ' than last week. Thursday did the heavy lifting.'], dayBars: [], scene: 'wanderer', wrapSub: '44% of your time on foot.', bigDay: '14 Nov', bigDaySay: null, peakSay: null,
      head: 'Week, wrapped · Oct 25–31', Your: 'Your week', This: 'This week', KIND: 'WEEK', Kind: 'Week', no: 44, span: 'Oct 25–31', SPAN: 'OCT 25–31',
      dist: '412 km', distNum: '412', unit: 'km', unitLong: 'kilometres', time: '21h 40m', prCount: '1 new PR',
      fromDow: 'SUN', fromDate: 'Oct 25', toDow: 'SAT', toDate: 'Oct 31', name: 'Alex', peak: '8 AM', second: '6 PM', seat: 'On foot', persShort: 'Wanderer',
      compareLong: "Roughly London to Paris, and then some. That's 59 km a day.", compareShort: '≈ Paris, 412 km later', compareMid: '≈ London → Paris, and then some',

      PRHEAD: 'NEW PERSONAL RECORD', prNum: '18.4', prUnitLine: 'km · your longest ride ever', prDetail: 'Thursday 29 Oct, 58 min at 19 km/h',
      wildShort: 'Thu', wildWays: 'all 5 ways', prUnitShort: 'km ride · new PR', longWalk: '6.2 km', longWalkSub: 'Sunday stroll',
      persA: 'The Urban', persB: 'Wanderer', pers: 'The Urban Wanderer', rareB: '1 in 8', rareT: 'users', rareLabel: 'Rarity', RARE: 'RARE · 1 IN 8',
      steps: '68,410', prValueShort: '18.4 km', prName: 'new ride PR', nextLine: 'See you next Sunday for week 45.', cPace: 30, cRange: 82, cVariety: 99,
      byDist: SAMPLE_MODES.map(([label, , dist, distShort, pct, color, dark]) => ({ label, dist, distShort, pct: pct + '%', color, dark })),

    };
    const M = window.Motio;
    if (!M) return sample;
    const P = this.period || (this.period = window.__motioRecap || { kind: 'week', from: M.weekStart() });
    window.__motioRecap = null;
    const kind = P.kind, now = Date.now();
    const from = P.from;
    const Y = new Date(from).getFullYear();
    const to = kind === 'day' ? from + M.DAY : kind === 'week' ? from + 7 * M.DAY : kind === 'year' ? new Date(Y + 1, 0, 1).getTime() : new Date(Y, new Date(from).getMonth() + 1, 1).getTime();
    const prevFrom = kind === 'year' ? new Date(Y - 1, 0, 1).getTime() : kind === 'month' ? new Date(new Date(from).getFullYear(), new Date(from).getMonth() - 1, 1).getTime() : from - (to - from);
    // An unfinished period is compared with the same stretch of the one before it.
    const r = M.summarize(from, to), prev = M.summarize(prevFrom, Math.min(from, prevFrom + (Math.min(to, now) - from)));
    const mi = M.settings().unit === 'mi', unit = mi ? 'mi' : 'km';
    const num = (m) => (mi ? m / 1609.34 : m / 1000);

    const span = kind === 'year' ? String(Y) : kind === 'day' ? fmtD(from, { day: 'numeric', month: 'short' }) : kind === 'month' ? fmtD(from, { month: 'long', year: 'numeric' })

    const isNow = from <= now && now < to;

    const isoWeek = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7)); const w1 = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - w1) / M.DAY - 3 + ((w1.getDay() + 6) % 7)) / 7); };

    const byDist = r.modes.filter((x) => x.m > 0).sort((a, b) => b.m - a.m).map((x) => ({ label: x.label, dist: d1(x.m) + ' ' + unit, distShort: d1(x.m) + ' ' + unit, pct: Math.max(2, Math.round(x.m / Math.max(1, r.m) * 100)) + '%', color: x.color, dark: x.color }));

  }
  // Swipe down to close, like Instagram stories: the story follows the finger and closes past a threshold

    if (e.target.closest && e.target.closest('section[aria-label], [role=dialog]')) return;

  }

      else return;
    }
    if (d.side) {

      d.dx = dx;
      d.el.style.transition = 'none';
      d.el.style.transform = 'translateX(' + dx * 0.35 + 'px)';
      return;
    }

    d.dy = Math.max(0, dy / k);

    d.el.style.transform = 'translateY(' + d.dy + 'px)';

  storyUp(e) {

    if (this.paused) { this.resume(); this.swipedAt = Date.now(); }
    const d = this.sd;
    this.sd = null;
    if (d && d.side) {
      d.el.style.transition = 'transform 280ms cubic-bezier(0.22, 1, 0.36, 1)';
      d.el.style.transform = '';
      const v = this.renderVals();
      if (d.dx < -50) { if (v.isLast) { if (this.props.onNav) this.props.onNav('back'); } else v.next(); }
      else if (d.dx > 50) v.prev();

      d.el.style.transform = 'translateY(' + h + 'px)';

      // inside the App prototype the full slides play over the real page behind.

      L, R: R0,
      bars: order.map((k, n) => ({ w: n < pos ? '100%' : '0%', anim: n === pos ? (n === order.length - 1 ? 'motioFill 900ms ease-out forwards' : 'motioFill ' + this.DUR + 'ms linear forwards') : 'none', play: s.paused || s.share ? 'paused' : 'running' })),
      storyNum: pos + 1, storyCount: order.length,

      isLast: pos === order.length - 1, notLast: pos !== order.length - 1,

      prev: () => { if (Date.now() - (this.swipedAt || 0) > 350) this.setState({ i: Math.max(0, pos - 1) }); },
      next: () => { if (Date.now() - (this.swipedAt || 0) > 350) this.setState({ i: Math.min(order.length - 1, pos + 1) }); }
    };
  }
