<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Personal records</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
button,a{font:inherit;cursor:pointer}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
.motio-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="m-page" style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 10px 20px 0">
  <div class="m-topbar"><a class="m-icon" href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back"><m-ic n="back"></m-ic></a><span class="m-tt">Records</span><a class="m-icon" href="{{ LK.routes.href }}" onClick="{{ LK.routes.go }}" aria-label="Your routes"><m-ic n="route"></m-ic></a></div>
  <div class="motio-scroll" style="flex: 1; min-height: 0; overflow-y: auto; margin: -10px -20px 0; padding: 70px 20px 40px; display: flex; flex-direction: column; gap: 10px">
    <div class="head"><div class="t"><span class="m-sub">{{ sub }}</span><h1 class="m-title">records.</h1></div></div>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <div class="m-card m-in" style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px 20px; text-align: center"><tuli-fox pose="stretch" size="130"></tuli-fox><span class="m-sub" style="max-width: 270px">Your first walk, run or ride sets your first records. <b style="color: var(--m-ink)">Every time you beat one</b>, Motio tells you.</span></div>
    </sc-if>
    <sc-if value="{{ hasHero }}" hint-placeholder-val="{{ true }}">
      <button type="button" class="m-card dark m-in" onClick="{{ hero.open }}" aria-label="{{ hero.aria }}" style="border: 0; padding: 20px; text-align: left; display: flex; flex-direction: column; gap: 8px; cursor: {{ hero.cursor }}">
        <span class="m-label">{{ hero.label }}</span>
        <span class="m-num">{{ hero.value }}</span>
        <span class="m-sub"><b style="color: var(--m-goal)">{{ hero.title }}</b><br>{{ hero.date }}</span>
      </button>
    </sc-if>
    <sc-if value="{{ hasTiles }}" hint-placeholder-val="{{ true }}">
      <div class="m-card m-in" style="display: flex; flex-direction: column; gap: 6px; padding: 12px">
        <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="6">
          <button type="button" class="m-row" onClick="{{ t.open }}" aria-label="{{ t.aria }}" style="border: 0; width: 100%; text-align: left; color: var(--m-ink); font: inherit; cursor: {{ t.cursor }}">
            <span class="m-dot" style="background: {{ t.dot }}"></span>
            <span style="flex: 1; min-width: 0"><b style="font-size: 14px">{{ t.title }}</b><div class="m-sub" style="font-size: 12px">{{ t.date }}</div></span>
            <b style="white-space: nowrap">{{ t.value }}</b>
          </button>
        </sc-for>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const M = window.Motio, now = Date.now(), DAY = 86400000;
    const sample = [
      { key: 'bike', title: 'Longest ride', v: '21.4 km', at: now - 3 * DAY, trip: 'x' },
      { key: 'run', title: 'Longest run', v: '10.2 km', at: now - 12 * DAY, trip: 'x' },
      { key: 'pace', title: 'Fastest run pace', v: '5:12 /km', at: now - 12 * DAY, trip: 'x' },
      { key: 'walk', title: 'Longest walk', v: '8.7 km', at: now - 30 * DAY, trip: 'x' },
      { key: 'steps', title: 'Most steps in a day', v: '18,402', at: now - 30 * DAY },
      { key: 'active', title: 'Most active day', v: '3h 12m', at: now - 9 * DAY },
      { key: 'week', title: 'Biggest week', v: '11h 40m', at: now - 14 * DAY },
      { key: 'streak', title: 'Longest moving streak', v: '23 days', at: now - 40 * DAY }
    ];
    const list = M ? M.records().list.map((r) => ({ ...r, v: M.fmtRecord(r) })) : sample;
    // Colour only says which way of moving the record is about; day-wide records stay ink, streaks are goal yellow.
    const DOT = { walk: 'var(--m-walk)', run: 'var(--m-run)', pace: 'var(--m-run)', bike: 'var(--m-bike)', speed: 'var(--m-bike)', active: 'var(--m-goal)', week: 'var(--m-goal)', streak: 'var(--m-goal)' };
    const date = (r) => (r.key === 'week' ? 'Week of ' : '') + new Date(r.at).toLocaleDateString('en-GB', { weekday: r.key === 'week' ? undefined : 'short', day: 'numeric', month: 'short', year: new Date(r.at).getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
    const openTrip = (r) => () => { if (!r.trip || !this.props.onNav) return; window.__motioTrip = r.trip; this.props.onNav('trip'); };
    // The hero: the newest record (what you most recently beat).
    const hero = list.slice().sort((a, b) => b.at - a.at)[0];
    const first = M ? (M.summarize(0, now).trips[0] || {}).start : now - 200 * DAY;
    const tiles = list.filter((r) => r !== hero);
    return {
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)',
      LK: { back: lk('back', 'You.dc.html'), routes: lk('routes', 'Routes.dc.html') },
      sub: first ? 'Your bests since ' + new Date(first).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }) : 'Your bests, all time',
      empty: !list.length, hasHero: !!hero, hasTiles: tiles.length > 0,
      hero: hero ? { label: (now - hero.at < 7 * DAY ? 'New record' : 'Latest record'), value: hero.v, title: hero.title, date: date(hero), open: openTrip(hero), cursor: hero.trip ? 'pointer' : 'default', aria: hero.title + ', ' + hero.v + ', ' + date(hero) + (hero.trip ? '. Open the trip' : '') } : {},
      tiles: tiles.map((r) => ({ value: r.v, title: r.title, date: date(r), dot: DOT[r.key] || 'var(--m-ink)', open: openTrip(r), cursor: r.trip ? 'pointer' : 'default', aria: r.title + ', ' + r.v + ', ' + date(r) + (r.trip ? '. Open the trip' : '') }))
    };
  }
}
</script>
</body>
</html>
