<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#4B3FD8}
a{color:inherit}
button{font:inherit;cursor:pointer}
button,a{transition:transform 140ms cubic-bezier(0.22,1,0.36,1),background-color 200ms ease}
button:active,a:active{transform:scale(0.94)}
@keyframes motioDraw{to{stroke-dashoffset:0}}
@keyframes motioRise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes motioFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes motioGoPulse{0%{box-shadow:0 0 0 0 rgba(246,195,67,0.55)}70%{box-shadow:0 0 0 18px rgba(246,195,67,0)}100%{box-shadow:0 0 0 0 rgba(246,195,67,0)}}
@keyframes motioLeaveRight{from{transform:translateX(0)}to{transform:translateX(100%)}}
@keyframes motioLeaveDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes motioReturn{from{transform:translateX(-72px);opacity:0.4}to{transform:translateX(0);opacity:1}}
@keyframes motioReturnScale{from{transform:scale(0.94);opacity:0.5}to{transform:scale(1);opacity:1}}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioStoryIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioSoftBackIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioSoftUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes motioSoftOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(24px)}}
@keyframes motioSoftDown{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(28px)}}
</style>
</helmet>
<div style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #4B3FD8; color: #FFFFFF; font-family: 'Poppins', system-ui, sans-serif; padding: 56px 28px 40px; display: flex; flex-direction: column">

  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0; pointer-events: none">
    <circle cx="370" cy="60" r="150" fill="#5649E4"></circle>
    <path d="M-20 700 C 80 600, 160 760, 260 640 S 400 560, 420 520" fill="none" stroke="#5A4FE6" stroke-width="40" stroke-linecap="round"></path>
    <path d="M-20 700 C 80 600, 160 760, 260 640 S 400 560, 420 520" fill="none" stroke="#7B70F0" stroke-width="3" stroke-dasharray="8 12"></path>
  </svg>

  <div style="position: relative; display: flex; align-items: center; gap: 8px; animation: motioRise 520ms cubic-bezier(0.22, 1, 0.36, 1) backwards">
    <svg aria-hidden="true" width="30" height="30" viewBox="0 0 30 30"><path d="M3 22c5 0 5-14 12-14s5 14 12 14" fill="none" stroke="#F6C343" stroke-width="4" stroke-linecap="round"></path><circle cx="27" cy="22" r="3" fill="#F2766B"></circle></svg>
    <span style="font-size: 22px; font-weight: 700">motio</span>
  </div>

  <h1 style="position: relative; margin: 28px 0 0; font-size: 40px; font-weight: 600; line-height: 1.12; animation: motioRise 560ms cubic-bezier(0.22, 1, 0.36, 1) 90ms backwards">Every move<br>tells a story.</h1>
  <p style="position: relative; margin: 12px 0 0; font-size: 15px; line-height: 1.5; color: rgba(255,255,255,0.9); max-width: 280px; animation: motioRise 560ms cubic-bezier(0.22, 1, 0.36, 1) 180ms backwards">Walks, rides, commutes and late-night runs, turned into recaps you’ll actually want to share.</p>

  <div style="position: relative; flex: 1; animation: motioRise 640ms cubic-bezier(0.22, 1, 0.36, 1) 260ms backwards">
    <svg aria-hidden="true" width="340" height="330" viewBox="0 0 340 330" style="position: absolute; left: -6px; top: 10px; overflow: visible">
      <g fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5">
        <circle cx="200" cy="190" r="70"></circle><circle cx="200" cy="190" r="120"></circle><circle cx="200" cy="190" r="170"></circle>
      </g>
      <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 268 C 80 210, 118 250, 170 186 S 262 112, 322 74" stroke="#3DBF5C" style="stroke-dasharray: 420; stroke-dashoffset: 420; animation: motioDraw 1.4s cubic-bezier(0.22, 1, 0.36, 1) 300ms forwards"></path>
        <path d="M8 152 C 70 150, 112 92, 182 112 S 290 202, 332 182" stroke="#6E8CF7" style="stroke-dasharray: 420; stroke-dashoffset: 420; animation: motioDraw 1.4s cubic-bezier(0.22, 1, 0.36, 1) 500ms forwards"></path>
        <path d="M40 318 C 120 298, 160 258, 232 268 S 304 298, 332 250" stroke="#F6C343" style="stroke-dasharray: 420; stroke-dashoffset: 420; animation: motioDraw 1.4s cubic-bezier(0.22, 1, 0.36, 1) 700ms forwards"></path>
      </g>
      <g fill="#FFFFFF" stroke-width="4">
        <circle cx="322" cy="74" r="7" stroke="#3DBF5C"></circle><circle cx="332" cy="182" r="7" stroke="#6E8CF7"></circle><circle cx="332" cy="250" r="7" stroke="#F6C343"></circle>
      </g>
      <g font-family="Poppins, sans-serif">
        <rect x="24" y="22" width="150" height="66" rx="16" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)"></rect>
        <text x="40" y="54" fill="#FFFFFF" font-size="24" font-weight="700">3h 12m</text>
        <text x="40" y="74" fill="rgba(255,255,255,0.75)" font-size="11.5" font-weight="500">on the move today</text>
        <rect x="176" y="214" width="140" height="66" rx="16" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)"></rect>
        <text x="192" y="246" fill="#FFFFFF" font-size="24" font-weight="700">60.2 km</text>
        <text x="192" y="266" fill="rgba(255,255,255,0.75)" font-size="11.5" font-weight="500">walk · bike · drive</text>
      </g>
    </svg>
  </div>

  <div style="position: relative; display: flex; align-items: center; justify-content: space-between; animation: motioRise 560ms cubic-bezier(0.22, 1, 0.36, 1) 360ms backwards">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; color: rgba(255,255,255,0.9)">Ready when you are.</span>
      <a href="{{ LK.signup.href }}" onClick="{{ LK.signup.go }}" style="font-size: 14px; font-weight: 600; color: #F6C343; text-decoration: none; padding: 10px 0">Create a new account</a>
    </div>
    <a href="{{ LK.login.href }}" onClick="{{ LK.login.go }}" aria-label="Log back in" style="width: 88px; height: 88px; border-radius: 44px; background: #F6C343; color: #1F1D47; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; animation: none">Go<span style="font-size: 10px; font-weight: 600">log in</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // Standalone artboards: remember which way we are going, and play this page's exit before the canvas jumps.
  dirGet() {
    let d = null;
    try { d = window.localStorage.getItem('motio.dir'); } catch (e) { /* blocked */ }
    if (d === null) { try { d = window.sessionStorage.getItem('motio.dir'); } catch (e) { /* blocked */ } }
    if (d === null) { try { d = window.top.__motioDir; } catch (e) { /* cross-origin */ } }
    if (d == null) d = window.__motioDir;
    return d || null;
  }
  dirSet(v) {
    try { window.localStorage.setItem('motio.dir', v); } catch (e) { /* blocked */ }
    try { window.sessionStorage.setItem('motio.dir', v); } catch (e) { /* blocked */ }
    try { window.top.__motioDir = v; } catch (e) { /* cross-origin */ }
    window.__motioDir = v;
  }
  standaloneNav(e, target) {
    if (target !== 'back' || this.navNow) { this.navNow = false; if (target !== 'back') this.dirSet('forward'); return; }
    const el = e && e.currentTarget;
    if (!el) return;
    e.preventDefault();
    this.dirSet('back');
    this.setState({ leaving: true });
    setTimeout(() => { this.navNow = true; el.click(); }, 200);
  }  renderVals() {
    if (this.entryAnim === undefined) {
      const d = this.props.embedded ? null : this.dirGet();
      if (d) this.dirSet('');
      // Standalone artboards can't show the previous page underneath, so they use short in-place fades;
      // inside the App prototype the full slides play over the real page behind.
      this.entryAnim = this.props.embedded ? 'none' : d === 'back' ? 'motioSoftBackIn 300ms cubic-bezier(0.22, 1, 0.36, 1)' : 'none';
    }
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) { this.standaloneNav(e, target); return; }
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    return { rootAnim: this.state && this.state.leaving ? 'motioSoftOut 200ms ease-in forwards' : this.entryAnim, emb, LK: { login: lk('login', 'Login.dc.html'), signup: lk('register', 'Register.dc.html') } };
  }
}
</script>
</body>
</html>
