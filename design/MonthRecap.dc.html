<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Month, wrapped</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden">
  <dc-import name="Recap" embedded="{{ embedded }}" on-nav="{{ onNav }}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // The month story is the same story as day, week and year (board 08), for one calendar month:
  // the month asked for by the Recaps list, else this month.
  renderVals() {
    const M = window.Motio;
    if (M && !this.picked) {
      this.picked = true;
      const p = window.__motioRecap;
      window.__motioRecap = p && p.kind === 'month' ? p : { kind: 'month', from: M.monthStart(Date.now()) };
    }
    return { embedded: !!this.props.embedded, onNav: this.props.onNav };
  }
}
</script>
</body>
</html>
