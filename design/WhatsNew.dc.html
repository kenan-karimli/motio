<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · What's new</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
button,a{font:inherit;cursor:pointer}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioWnPop{0%{opacity:0;transform:scale(0.5) rotate(-12deg)}70%{opacity:1;transform:scale(1.08) rotate(3deg)}100%{transform:none}}
@keyframes motioWnIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes motioWnFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.motio-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="m-page" style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 60px 20px 0">
  <div style="display: flex; align-items: flex-end; gap: 10px">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px"><span class="m-sub">{{ kicker }}</span><h1 class="m-title" style="font-size: 34px">{{ title }}</h1></div>
    <m-art name="gift" size="110"></m-art>
  </div>
  <div class="motio-scroll" style="flex: 1; min-height: 0; overflow-y: auto; margin: 14px -20px 0; padding: 0 20px 130px; display: flex; flex-direction: column; gap: 10px">
    <div class="m-card" style="display: flex; flex-direction: column; gap: 12px; padding: 18px">
      <span class="m-label">{{ listLabel }}</span>
      <sc-for list="{{ items }}" as="n" hint-placeholder-count="4"><div class="m-in" style="display: flex; gap: 12px; align-items: flex-start; animation-delay: {{ n.d }}"><span class="m-dot" style="margin-top: 7px; background: {{ n.c }}"></span><span style="flex: 1; font: 500 14px/1.45 var(--m-font)">{{ n.t }}</span></div></sc-for>
      <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><span class="m-sub">Fixes and improvements to keep Motio running smoothly.</span></sc-if>
    </div>
    <sc-if value="{{ hasEarlier }}" hint-placeholder-val="{{ true }}">
      <span class="m-label" style="margin: 8px 4px 0">Earlier updates</span>
      <sc-for list="{{ earlier }}" as="e" hint-placeholder-count="2"><div class="m-card" style="display: flex; flex-direction: column; gap: 8px; padding: 16px"><b style="font-size: 14px">Motio {{ e.v }}</b><sc-for list="{{ e.items }}" as="t" hint-placeholder-count="2"><span class="m-sub" style="font-size: 13px">{{ t }}</span></sc-for></div></sc-for>
    </sc-if>
  </div>
  <a class="m-btn wide" href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" style="position: absolute; left: 20px; right: 20px; bottom: 28px; text-decoration: none">Got it</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    // Notes come from release-notes/<version>.md, bundled into the app at build time (scripts/build-www.mjs).
    const NOTES = window.__MOTIO_NOTES || { '3.9': ['See what changed after every update', 'A new Motio website with iPhone sign-up'], '3.8': ['Smoother motion everywhere'] };
    const version = window.__MOTIO_VERSION || '5.0';
    const older = (v) => v.localeCompare(version, undefined, { numeric: true }) < 0;
    const byNewest = Object.keys(NOTES).filter(older).sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
    const mine = NOTES[version] || [];
    const COLORS = ['#3DBF5C', '#F6C343', '#6E8CF7', '#F2766B', '#B57BE0'];
    const base = emb ? 380 : 0;
    return { foxRef: window.MotioMascot ? window.MotioMascot.fox('cheer', 70) : null,
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms ease',
      LK: { back: lk('back', 'Main.dc.html') },
      d0: base + 'ms', d1: base + 140 + 'ms',
      kicker: 'What’s new in', title: 'Motio ' + version,
      listLabel: 'Changes in Motio ' + version,
      items: mine.map((t, i) => ({ t, c: COLORS[i % COLORS.length], d: base + 260 + i * 90 + 'ms' })),
      empty: !mine.length,
      earlier: byNewest.filter((v) => NOTES[v].length).slice(0, 3).map((v) => ({ v: 'Motio ' + v, items: NOTES[v] })),
      hasEarlier: byNewest.some((v) => NOTES[v].length)
    };
  }
}
</script>
</body>
</html>
