<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Challenge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#F6F5FC}
button,a{font:inherit;cursor:pointer}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioChIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes motioChGo{from{offset-distance:0%}}
@keyframes motioChDraw{from{stroke-dashoffset:900}}
@keyframes motioChFlag{0%,100%{transform:skewY(0)}50%{transform:skewY(-8deg)}}
@keyframes motioChPick{from{transform:scale(0.95)}to{transform:none}}
.motio-scroll::-webkit-scrollbar{display:none}
.motio-runner{position:absolute;left:0;top:0;offset-path:path('M30 230 C 90 230, 90 150, 150 150 S 220 210, 270 160 S 300 60, 340 50');offset-rotate:0deg;animation:motioChGo 1800ms cubic-bezier(0.22,1,0.36,1) var(--d) backwards}
</style>
</helmet>
<div style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F5FC; color: #1F1D47; font-family: 'Poppins', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex-shrink: 0; padding: 16px 20px 10px; display: flex; align-items: center; gap: 12px">
    <a href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D47" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.1">{{ title }}</h1><span style="font-size: 12px; color: #6B6890">{{ sub }}</span></div>
  </div>

  <div class="motio-scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 6px 20px 32px; display: flex; flex-direction: column; gap: 14px">
    <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}"><div style="padding: 22px; border-radius: 22px; background: #FFFFFF; font-size: 13px; color: #6B6890; text-align: center">Loading…</div></sc-if>

    <sc-if value="{{ hasRace }}" hint-placeholder-val="{{ true }}">
      <section style="position: relative; height: 290px; flex-shrink: 0; border-radius: 28px; background: {{ raceBg }}; overflow: hidden; animation: motioChIn 520ms cubic-bezier(0.22, 1, 0.36, 1) {{ d0 }} backwards">
        <svg role="img" aria-label="{{ raceAria }}" width="350" height="290" viewBox="0 0 350 290" style="position: absolute; left: 0; top: 0">
          <circle cx="300" cy="260" r="120" fill="#FFFFFF" fill-opacity="0.12"></circle>
          <path d="M30 230 C 90 230, 90 150, 150 150 S 220 210, 270 160 S 300 60, 340 50" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="26" stroke-linecap="round"></path>
          <path d="M30 230 C 90 230, 90 150, 150 150 S 220 210, 270 160 S 300 60, 340 50" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="7 9"></path>
          <path d="M30 230 C 90 230, 90 150, 150 150 S 220 210, 270 160 S 300 60, 340 50" fill="none" stroke="#1F1D47" stroke-width="6" stroke-linecap="round" pathLength="900" stroke-dasharray="{{ leadDash }}" style="animation: motioChDraw 1800ms cubic-bezier(0.22, 1, 0.36, 1) {{ d1 }} backwards"></path>
          <g transform="translate(318 22)"><rect x="0" y="0" width="3" height="34" rx="1.5" fill="#1F1D47"></rect><path d="M3 2 h18 l-5 6 l5 6 h-18z" fill="#FFFFFF" style="transform-box: fill-box; transform-origin: left center; animation: motioChFlag 1.6s ease-in-out infinite"></path></g>
        </svg>
        <sc-for list="{{ racers }}" as="m" hint-placeholder-count="2"><span class="motio-runner" style="offset-distance: {{ m.at }}; --d: {{ m.d }}; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 17px; background: {{ m.c }}; border: 3px solid #1F1D47; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">{{ m.ini }}</span></sc-for>
        <span style="position: absolute; left: 18px; top: 16px; padding: 5px 12px; border-radius: 12px; background: #1F1D47; color: #FFFFFF; font-size: 12px; font-weight: 600">{{ leadLine }}</span>
      </section>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; animation: motioChIn 520ms cubic-bezier(0.22, 1, 0.36, 1) {{ d1 }} backwards">
        <sc-for list="{{ racers }}" as="m" hint-placeholder-count="2"><div style="padding: 14px; border-radius: 20px; background: #FFFFFF; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #6B6890">{{ m.name }}</span><span style="font-size: 24px; font-weight: 700">{{ m.value }}</span><span style="font-size: 11px; color: #6B6890">{{ m.left }}</span></div></sc-for>
      </div>
      <span style="font-size: 12px; line-height: 1.5; color: #4A4770">Walks, runs and rides count. Driving and transit don’t.</span>
      <button type="button" onClick="{{ leave }}" style="align-self: center; height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: transparent; color: #C2412F; font-size: 13px; font-weight: 600">{{ leaveLabel }}</button>
    </sc-if>

    <section style="padding: 18px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px; animation: motioChIn 520ms cubic-bezier(0.22, 1, 0.36, 1) {{ d2 }} backwards">
      <span style="font-size: 15px; font-weight: 700">{{ composerTitle }}</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{ kinds }}" as="k" hint-placeholder-count="3">
          <button type="button" onClick="{{ k.pick }}" aria-pressed="{{ k.on }}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px; border-radius: 18px; border: 2px solid {{ k.border }}; background: {{ k.bg }}; color: #1F1D47; text-align: left; transition: background-color 220ms ease, border-color 220ms ease; animation: {{ k.anim }}">
            <span style="font-size: 14px; font-weight: 700">{{ k.title }}</span><span style="font-size: 11px; color: #4A4770">{{ k.sub }}</span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <button type="button" onClick="{{ tMinus }}" aria-label="Lower the target" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #F3F2FA; color: #1F1D47; font-size: 22px; font-weight: 600">−</button>
        <span style="flex: 1; text-align: center; font-size: 18px; font-weight: 700">{{ targetLabel }}</span>
        <button type="button" onClick="{{ tPlus }}" aria-label="Raise the target" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #F3F2FA; color: #1F1D47; font-size: 22px; font-weight: 600">+</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{ spans }}" as="o" hint-placeholder-count="3"><button type="button" onClick="{{ o.pick }}" aria-pressed="{{ o.on }}" style="height: 38px; border: 0; border-radius: 19px; background: {{ o.bg }}; color: {{ o.fg }}; font-size: 12px; font-weight: 600; transition: background-color 200ms ease, color 200ms ease">{{ o.label }}</button></sc-for>
      </div>
      <span style="font-size: 12px; color: #6B6890">With</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{ friends }}" as="f" hint-placeholder-count="3"><button type="button" onClick="{{ f.pick }}" aria-pressed="{{ f.on }}" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 6px; border-radius: 20px; border: 2px solid {{ f.border }}; background: {{ f.bg }}; color: #1F1D47; font-size: 13px; font-weight: 600; transition: background-color 200ms ease, border-color 200ms ease"><span style="width: 28px; height: 28px; border-radius: 14px; background: {{ f.tint }}; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">{{ f.ini }}</span>{{ f.name }}</button></sc-for>
      </div>
      <sc-if value="{{ noFriends }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #6B6890">Add a friend first, from Social › Friends.</span></sc-if>
      <sc-if value="{{ hasSendError }}" hint-placeholder-val="{{ false }}"><span role="status" style="font-size: 12px; color: #C2412F">{{ sendError }}</span></sc-if>
      <button type="button" onClick="{{ send }}" disabled="{{ sendOff }}" style="height: 50px; border: 0; border-radius: 25px; background: {{ sendBg }}; color: #FFFFFF; font-size: 14px; font-weight: 600; transition: background-color 200ms ease">{{ sendLabel }}</button>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.load(); }
  load() {
    const M = window.Motio;
    if (!M) return;
    this.setState({ loading: !(this.state && this.state.list) });
    Promise.all([M.friends.challenges(), M.friends.board()])
      .then(([c, b]) => this.setState({ list: c.challenges, board: b, loading: false }))
      .catch((e) => this.setState({ loading: false, sendError: (e && e.message) || 'Couldn’t reach Motio.' }));
  }
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const s = this.state || {};
    const M = window.Motio;
    if (this.cid === undefined) { this.cid = window.__motioChallenge || null; this.with = window.__motioChallengeWith || null; window.__motioChallenge = null; window.__motioChallengeWith = null; }
    const now = Date.now(), DAY = 86400000;
    const sample = { list: [{ id: 1, kind: 'km', target: 20, end: now + 2 * DAY, members: [{ id: 2, name: 'Leyla', value: 14.2 }, { id: 1, name: 'You', me: true, value: 11.6 }] }],
      board: { people: [{ id: 1, name: 'You', me: true }, { id: 2, name: 'Leyla' }, { id: 3, name: 'Murad' }] } };
    const list = M ? s.list || [] : sample.list, board = M ? s.board : sample.board;
    const c = (this.cid && list.find((x) => x.id === this.cid)) || (!this.with && list.find((x) => !x.done));
    const TINTS = ['#F6C343', '#3DBF5C', '#6E8CF7', '#F2766B', '#B57BE0'];
    const ini = (n) => n.split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    const UNIT = { km: 'km', min: 'min', runs: 'runs' };
    const NAME = { km: (t) => 'First to ' + t + ' km', min: (t) => t + ' active minutes', runs: (t) => t + ' runs' };
    const base = emb ? 380 : 0;
    const kind = s.kind || 'km', DEF = { km: 20, min: 300, runs: 3 }, STEP = { km: 5, min: 60, runs: 1 };
    const target = s.target || DEF[kind], days = s.days || 7;
    const others = board ? board.people.filter((p) => !p.me) : [];
    const picked = s.picked || (this.with ? { [this.with]: true } : {});
    const ids = others.filter((p) => picked[p.id]).map((p) => p.id);
    const left = c ? Math.max(0, Math.ceil((c.end - now) / DAY)) : 0;
    const lead = c && c.members[0];
    return {
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)',
      LK: { back: lk('back', 'Recaps.dc.html') },
      d0: base + 'ms', d1: base + 120 + 'ms', d2: base + 200 + 'ms',
      loading: !!s.loading,
      title: c ? NAME[c.kind](c.target) : 'New challenge', sub: c ? (c.done ? 'Finished' : left ? left + (left === 1 ? ' day left' : ' days left') : 'Ends today') + ' · ' + c.members.length + ' people' : 'Race your friends this week',
      hasRace: !!c, raceBg: '#F2766B',
      raceAria: c ? c.members.map((m) => (m.me ? 'you' : m.name) + ' ' + m.value + ' ' + UNIT[c.kind]).join(', ') : '',
      leadDash: c && lead ? Math.round(Math.min(1, lead.value / c.target) * 900) + ' 900' : '0 900',
      leadLine: c && lead ? (lead.value <= 0 ? 'No one has started yet' : (lead.me ? 'You lead' : lead.name.split(' ')[0] + ' leads') + (c.members[1] ? ' by ' + Math.round((lead.value - c.members[1].value) * 10) / 10 + ' ' + UNIT[c.kind] : '')) : '',
      racers: c ? c.members.slice(0, 4).map((m, i) => ({ name: m.me ? 'You' : m.name.split(' ')[0], ini: ini(m.name), c: m.me ? '#F6C343' : TINTS[(m.id % 4) + 1], at: (Math.min(1, m.value / c.target) * 100).toFixed(1) + '%', d: base + 300 + i * 120 + 'ms',
        value: m.value + ' ' + UNIT[c.kind], left: m.value >= c.target ? 'Reached the goal' : Math.round((c.target - m.value) * 10) / 10 + ' ' + UNIT[c.kind] + ' to go' })) : [],
      leaveLabel: s.confirmLeave ? 'Tap again to leave' : 'Leave challenge',
      leave: () => { if (!s.confirmLeave) { this.setState({ confirmLeave: true }); return; } if (M && c) M.friends.leave(c.id).then(() => { this.cid = null; this.setState({ confirmLeave: false }); this.load(); }); },
      composerTitle: c ? 'Start another challenge' : 'What’s the challenge?',
      kinds: [['km', 'Distance', 'First to X km'], ['min', 'Active', 'Most minutes'], ['runs', 'Runs', 'Number of runs']].map(([k, title, sub]) => ({ title, sub, on: k === kind,
        bg: k === kind ? '#FDE9E6' : '#FFFFFF', border: k === kind ? '#F2766B' : '#E3E1F3', anim: k === kind ? 'motioChPick 260ms ease-out' : 'none', pick: () => this.setState({ kind: k, target: null }) })),
      targetLabel: target + ' ' + UNIT[kind],
      tMinus: () => this.setState({ target: Math.max(STEP[kind], target - STEP[kind]) }), tPlus: () => this.setState({ target: target + STEP[kind] }),
      spans: [[2, 'Weekend'], [7, 'A week'], [14, 'Two weeks']].map(([d, label]) => ({ label, on: d === days, bg: d === days ? '#1F1D47' : '#F3F2FA', fg: d === days ? '#FFFFFF' : '#1F1D47', pick: () => this.setState({ days: d }) })),
      friends: others.map((p) => { const on = !!picked[p.id]; return { name: p.name.split(' ')[0], ini: ini(p.name), tint: TINTS[(p.id % 4) + 1], on, bg: on ? '#EEF0FF' : '#FFFFFF', border: on ? '#5B4FE0' : '#E3E1F3', pick: () => this.setState({ picked: { ...picked, [p.id]: !on } }) }; }),
      noFriends: !!board && !others.length,
      hasSendError: !!s.sendError, sendError: s.sendError || '',
      sendOff: !ids.length || !!s.sending, sendBg: ids.length ? '#1F1D47' : '#C9C5EC', sendLabel: s.sending ? 'Sending…' : 'Send challenge',
      send: () => {
        if (!M || !ids.length) return;
        this.setState({ sending: true, sendError: null });
        M.friends.challenge(kind, target, days, ids).then((r) => { this.cid = r.challenge.id; this.with = null; this.setState({ sending: false, picked: {} }); this.load(); })
          .catch((e) => this.setState({ sending: false, sendError: (e && e.message) || 'Couldn’t send. Try again.' }));
      }
    };
  }
}
</script>
</body>
</html>
