<style>
body{margin:0}
button{font:inherit;cursor:pointer}
@keyframes motioPushOut{from{transform:translateX(0)}to{transform:translateX(100%)}}
@keyframes motioStoryOut{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes motioTabPop{0%{transform:scale(0.7)}55%{transform:scale(1.15)}100%{transform:scale(1)}}
.motio-tab-icon{transition:transform 140ms ease}
nav button:active .motio-tab-icon{transform:scale(0.82)}
nav a:focus:not(:focus-visible),nav button:focus:not(:focus-visible){outline:none}
button,a{transition:transform 140ms cubic-bezier(0.22,1,0.36,1)}
button:active,a:active{transform:scale(0.96)}
@keyframes motioFadeIn{from{opacity:0}to{opacity:1}}
@keyframes motioUpdIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes motioFadeOut{from{opacity:1}to{opacity:0}}
@keyframes motioAutoIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
[data-page="overlay"] .motio-scroll>*{animation:motioAutoIn 520ms cubic-bezier(0.22,1,0.36,1) 640ms backwards}
[data-page="overlay"] .motio-scroll>:nth-child(1){animation-delay:360ms}[data-page="overlay"] .motio-scroll>:nth-child(2){animation-delay:410ms}[data-page="overlay"] .motio-scroll>:nth-child(3){animation-delay:460ms}[data-page="overlay"] .motio-scroll>:nth-child(4){animation-delay:510ms}[data-page="overlay"] .motio-scroll>:nth-child(5){animation-delay:560ms}[data-page="overlay"] .motio-scroll>:nth-child(6){animation-delay:600ms}
/* Full-screen backdrops (tap outside a sheet to close) never shrink on press: that flashed the screen edges. */
button[style*="inset: 0"]:active,a[style*="inset: 0"]:active,button[style*="inset:0"]:active{transform:none !important}
body[data-sheet] .motio-upd{display:none}
/* Nothing animates where nobody can see it: tabs out of view, and the tabs under an open page. */
[data-page="tab"][aria-hidden="true"] *,body:has([data-page="overlay"]) [data-page="tab"] *{animation-play-state:paused!important}
/* Tabs tapped into view build up in steps, like opened pages (Today has its own entrance). */
[data-page="tab"][data-enter="true"] .motio-scroll:not(.motio-today)>*{animation:motioAutoIn 560ms cubic-bezier(0.22,1,0.36,1) backwards}
[data-page="tab"][data-enter="true"] .motio-scroll:not(.motio-today)>:nth-child(2){animation-delay:50ms}[data-page="tab"][data-enter="true"] .motio-scroll:not(.motio-today)>:nth-child(3){animation-delay:100ms}[data-page="tab"][data-enter="true"] .motio-scroll:not(.motio-today)>:nth-child(4){animation-delay:150ms}[data-page="tab"][data-enter="true"] .motio-scroll:not(.motio-today)>:nth-child(5){animation-delay:200ms}[data-page="tab"][data-enter="true"] .motio-scroll:not(.motio-today)>:nth-child(n+6){animation-delay:240ms}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}
</style>
