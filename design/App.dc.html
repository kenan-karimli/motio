    const tab = (this.state && this.state.tab) || 0;
    let to = tab;
    if (d.dx < -90 || d.v < -0.4) to = tab + 1; else if (d.dx > 90 || d.v > 0.4) to = tab - 1;
    to = Math.max(0, Math.min(3, to));
    this.pagerEl.style.setProperty('--dur', '380ms');
    this.pagerEl.style.setProperty('--dx', '0px');
    if (to !== tab) { this.bySwipe = true; this.setState({ tab: to, closing: false }); }
  }
  componentDidMount() {
    // Android back button: pop a page, return to Today, or let the app close.
    window.__motioBack = () => {
      const st = this.state || {};
      const stack = st.stack || this.initStack || [];
      if (stack.length && stack[stack.length - 1] !== 'welcome') { this.goFn('back'); return true; }
      if (!stack.length && (st.tab || 0) !== 0) { this.goFn('today'); return true; }
      return false;
    };
  }
  renderVals() {
    const s = this.state || {};
    const tab = s.tab || 0;
    let authed = false;
    try { authed = window.Motio ? window.Motio.auth.isSignedIn() : window.localStorage.getItem('motio.auth') === '1'; } catch (e) { /* storage blocked */ }
    // First launch (or after logging out) starts on Welcome.
    if (this.initStack === undefined) this.initStack = authed ? [] : ['welcome'];
    const stack = s.stack || this.initStack;
    const setAuth = (v) => { try { window.localStorage.setItem('motio.auth', v ? '1' : '0'); } catch (e) { /* storage blocked */ } };
    if (this.startedAuthed === undefined) {
      this.startedAuthed = authed;
      if (!authed) setTimeout(() => this.setState({ ready: true }), 600);
    }
    const closing = !!s.closing;
    const top = stack[stack.length - 1] || null;
    const ease = 'cubic-bezier(0.22, 1, 0.36, 1)';
    const tabIndex = { today: 0, moves: 1, you: 2, recaps: 3 };
    const stories = ['recap', 'month', 'live'];

    // One shell for the whole app: tabs swap almost instantly (Instagram-style),
    // detail screens push from the right, recaps rise from the bottom, log-out fades.
    const go = (target) => {
      if (target in tabIndex) return this.setState({ tab: tabIndex[target], stack: [], closing: false });
      if (target === 'home') { setAuth(true); return this.setState({ tab: 0, stack: [], closing: false }); }
      if (target === 'welcome') { setAuth(false); if (window.Motio && window.Motio.auth.isSignedIn()) window.Motio.auth.logout(); return this.setState({ stack: ['welcome'], closing: false }); }
      if (target === 'back-now') { if (stack.length) this.setState({ stack: stack.slice(0, -1), closing: false }); return; }
      if (target === 'back') {
        if (!stack.length || closing) return;
        this.setState({ closing: true });
        setTimeout(() => {
          const cur = (this.state && this.state.stack) || [];
          this.setState({ stack: cur.slice(0, -1), closing: false });
        }, 380);
        return;
      }
      // Already open further down (e.g. Register → Log in): drop back to it.
      if (stack.includes(target)) return this.setState({ stack: stack.slice(0, stack.indexOf(target) + 1), closing: false });
      this.setState({ stack: [...stack, target], closing: false });
    };

    this.goFn = go;
    // A rejected session token sends you to the Session expired page once.
    if (window.Motio && window.Motio.auth.sessionExpired() && !stack.includes('session') && !stack.includes('login') && !this.sessionShown) { this.sessionShown = true; setTimeout(() => go('session'), 0); }
    if (window.Motio && window.Motio.auth.isSignedIn()) this.sessionShown = false;
    if (!this.goStable) this.goStable = (t) => this.goFn(t);
    const O = {};
    ['personality', 'settings', 'connected', 'privacy', 'export', 'help', 'recap', 'month', 'welcome', 'login', 'register', 'widgets', 'messages', 'offline', 'locationoff', 'servererror', 'notfound', 'session', 'empty', 'types', 'map', 'achievements', 'places', 'timeline', 'trip', 'explorer', 'live', 'goals', 'health'].forEach((k) => {
      const idx = stack.indexOf(k);
      const isTop = k === top;
      const leaving = isTop && closing;
      let anim = 'none';
      if (leaving) anim = (stories.includes(k) ? 'motioStoryOut' : k === 'welcome' ? 'motioFadeOut' : 'motioPushOut') + ' 380ms cubic-bezier(0.4, 0, 0.2, 1) forwards';
      else if (k === 'welcome' && s.stack) anim = 'motioFadeIn 360ms ease-out';
      O[k] = {
        show: idx >= 0,
        z: k === 'personality' && idx === 0 ? 5 : 20 + idx * 2,
        anim,
        kind: stories.includes(k) || k === 'welcome' ? 'story' : 'push',
        shadow: 'none'
      };
    });

    // A tab reached by tapping plays its entrance; one dragged in by a swipe was already in view, so it doesn't.
    if (tab !== this.prevTab) { this.enterTab = this.bySwipe ? -1 : tab; this.bySwipe = false; this.prevTab = tab; }
    const layer = (i) => ({ off: i - tab, pe: i === tab ? 'auto' : 'none', hidden: i === tab ? 'false' : 'true', enter: i === this.enterTab ? 'true' : 'false' });
    const item = (i, key) => {
      const on = i === tab;
      return { on, off: !on, current: on ? 'page' : 'false', fg: on ? '#1F1D47' : '#6B6890', fw: on ? 700 : 500, pick: () => go(key) };
    };

    const settled = top && !closing;
    const coversNav = settled && top !== 'personality';
    return {
      go: this.goStable, O,
      baseReady: this.startedAuthed || !!s.ready || !!s.stack,
      pagerRef: (el) => { this.pagerEl = el; },
      onDown: (e) => this.dragStart(e),
      onMove: (e) => this.dragMove(e),
      onUp: (e) => this.dragEnd(e),
      L0: layer(0), L1: layer(1), L2: layer(2), L3: layer(3),
      T0: item(0, 'today'), T1: item(1, 'moves'), T2: item(2, 'you'), T3: item(3, 'recaps'),
      baseShift: settled && !stories.includes(top) && top !== 'welcome' ? 'translateX(-72px)' : settled && stories.includes(top) ? 'scale(0.96)' : 'none',
      navOp: coversNav ? 0 : 1,
      navY: coversNav ? '24px' : '0px'
    };
  }
}
</script>
