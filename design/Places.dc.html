<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Your places</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
button,a{font:inherit;cursor:pointer}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioToast{0%{opacity:0;transform:translate(-50%,12px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
.motio-scroll::-webkit-scrollbar{display:none}
.motio-tiles{filter:grayscale(1) brightness(1.04) contrast(.92)}
.m-dark-theme .motio-tiles{filter:grayscale(1) invert(1) brightness(.9) contrast(.9)}
</style>
</helmet>
<div class="m-page" style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 54px 20px 0">
  <div class="m-topbar"><a class="m-icon" href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back"><m-ic n="back"></m-ic></a><span class="m-tt">Your places</span><span style="width: 44px"></span></div>
  <div class="motio-scroll" style="flex: 1; min-height: 0; overflow-y: auto; margin: -54px -20px 0; padding: 108px 20px 40px; display: flex; flex-direction: column; gap: 10px">
    <div class="head"><div class="t"><span class="m-sub">Names Motio uses in your days</span><h1 class="m-title">your places.</h1></div></div>
    <div class="mapbox m-in" style="position: relative; height: 150px; flex-shrink: 0; isolation: isolate; background: var(--m-soft)">
      <div ref="{{ mapRef }}" style="position: absolute; inset: 0; z-index: 0"></div>
      <sc-if value="{{ noMap }}" hint-placeholder-val="{{ true }}"><m-map kind="day" style="position: absolute; inset: 0"></m-map></sc-if>
    </div>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <div class="m-card m-in" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 20px; text-align: center"><m-art name="location" size="150"></m-art><span class="m-sub" style="max-width: 270px">Your places appear after a few trips: <b style="color: var(--m-ink)">home, work</b> and the spots you return to.</span></div>
    </sc-if>
    <sc-if value="{{ hasList }}" hint-placeholder-val="{{ true }}">
      <div class="m-card m-in" style="display: flex; flex-direction: column; gap: 6px; padding: 12px">
        <sc-for list="{{ list }}" as="p" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 6px; border-radius: 18px; background: var(--m-soft)">
            <button type="button" class="m-row" onClick="{{ p.focus }}" aria-label="{{ p.aria }}" aria-expanded="{{ p.open }}" style="border: 0; width: 100%; text-align: left; color: var(--m-ink); font: inherit">
              <span class="av" style="background: {{ p.avBg }}; color: {{ p.avFg }}; box-shadow: {{ p.avRing }}"><m-ic n="{{ p.icon }}" s="17"></m-ic></span>
              <span style="flex: 1; min-width: 0"><b style="display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ p.name }}</b><div class="m-sub" style="font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ p.meta }}</div></span>
              <span style="color: var(--m-mute); display: flex"><m-ic n="{{ p.end }}" s="16"></m-ic></span>
            </button>
            <sc-if value="{{ p.open }}" hint-placeholder-val="{{ false }}">
              <div class="m-in" style="display: flex; flex-direction: column; gap: 8px; padding: 0 12px 12px">
                <sc-if value="{{ p.editing }}" hint-placeholder-val="{{ false }}">
                  <div style="display: flex; gap: 8px"><input class="input" value="{{ p.draft }}" onChange="{{ p.onDraft }}" aria-label="Place name" maxlength="30" style="flex: 1; min-width: 0; height: 42px; border: 0; outline: none; box-shadow: inset 0 0 0 2px var(--m-ink)"><button type="button" class="m-chip on" onClick="{{ p.save }}" style="height: 42px">Save</button></div>
                </sc-if>
                <div style="display: flex; gap: 6px"><button type="button" class="m-chip" onClick="{{ p.rename }}" style="height: 32px; font-size: 12px"><m-ic n="edit" s="14"></m-ic>Rename</button><button type="button" class="m-chip" onClick="{{ p.privacy }}" style="height: 32px; font-size: 12px"><m-ic n="lock" s="14"></m-ic>{{ p.privLabel }}</button></div>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <span class="m-sub" style="font-size: 12px; padding: 0 4px">Found from where your trips start and end. Only you can see them. A private place is hidden from maps and shared images.</span>
    </sc-if>
  </div>
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 50%; bottom: 28px; z-index: 50; padding: 12px 18px; border-radius: 999px; background: var(--m-ink); color: var(--m-bg-hi); font: 600 13px var(--m-font); white-space: nowrap; animation: motioToast 2300ms ease forwards">{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  showToast(msg) {
    clearTimeout(this.toastT);
    this.setState({ toast: null });
    setTimeout(() => this.setState({ toast: msg }), 30);
    this.toastT = setTimeout(() => this.setState({ toast: null }), 2330);
  }
  componentWillUnmount() { clearTimeout(this.toastT); clearTimeout(this.mapT); if (this.ctrl) this.ctrl.destroy(); }
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const s = this.state || {};
    const M = window.Motio;
    const list = M ? M.places() : [
      { id: 'a', name: 'Home', geo: 'Yasamal', kind: 'home', visits: 34, hours: 345, last: Date.now() - 3600000 },
      { id: 'b', name: 'Work', geo: 'Neftchilar Avenue 151', kind: 'work', visits: 25, hours: 111, last: Date.now() - 86400000 },
      { id: 'c', name: 'Ganjlik Mall', geo: 'Ganjlik Mall', kind: 'place', visits: 9, hours: 14, last: Date.now() - 3 * 86400000 }
    ];
    // The map starts after the page has slid in, so the slide stays smooth.
    const key = list.map((p) => p.name).join('|');
    if (this.ctrl && this.mapKey !== key) { this.ctrl.destroy(); this.ctrl = null; this.mapT = setTimeout(() => { this.ctrl = window.MotioMap.mountPlaces(this.mapEl, list); }, 0); }
    this.mapKey = key;
    if (M && window.MotioMap && this.mapEl && !this.ctrl && !this.mapT) this.mapT = setTimeout(() => { this.ctrl = window.MotioMap.mountPlaces(this.mapEl, list); }, 440);
    const zones = M ? M.settings().zones || [] : [];
    const near = (p) => zones.find((z) => Math.abs(z.lat - p.lat) < 0.0015 && Math.abs(z.lng - p.lng) < 0.0015);
    const ago = (t) => { const d = Math.floor((Date.now() - t) / 86400000); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; };
    const hrs = (h) => (h >= 1 ? Math.round(h) + ' h' : Math.max(1, Math.round(h * 60)) + ' min');
    return {
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)',
      LK: { back: lk('back', 'You.dc.html') },
      mapRef: (el) => { const first = el && !this.mapEl; this.mapEl = el; if (first && M) requestAnimationFrame(() => this.setState({ mapReady: true })); },
      noMap: !M, empty: !list.length, hasList: list.length > 0,
      list: list.map((p) => {
        const zone = M ? near(p) : p.kind === 'home', editing = s.edit === p.id, open = s.open === p.id || editing;
        // The real street or place name sits under a name you gave it ("Work · Neftchilar Avenue 151").
        const where = p.geo && p.geo !== p.name ? p.geo + ' · ' : '';
        return {
          name: p.name, open, editing, draft: s.draft ?? p.name,
          icon: { home: 'home', work: 'box' }[p.kind] || 'pin',
          avBg: p.kind === 'home' ? 'var(--m-ink)' : p.kind === 'work' ? 'var(--m-ink-2)' : 'var(--m-card)',
          avFg: p.kind === 'place' ? 'var(--m-ink)' : 'var(--m-bg-hi)', avRing: p.kind === 'place' ? 'inset 0 0 0 1.5px var(--m-line)' : 'none',
          meta: where + (zone ? 'private · ' : '') + p.visits + (p.visits === 1 ? ' visit' : ' visits') + ' · ' + hrs(p.hours) + ' · ' + ago(p.last),
          end: zone ? 'lock' : open ? 'down' : 'chev',
          aria: p.name + (zone ? ', private' : '') + ', show on map',
          focus: () => { if (this.ctrl) this.ctrl.fly(p.lat, p.lng); this.setState({ open: open ? null : p.id, edit: null }); },
          rename: () => this.setState({ edit: editing ? null : p.id, open: p.id, draft: p.name }),
          onDraft: (e) => this.setState({ draft: e.target.value }),
          save: () => { const n = String(s.draft || '').trim(); if (n && M) M.renamePlace(p.id, n); this.setState({ edit: null }); if (n) this.showToast('Renamed to ' + n); },
          privLabel: zone ? 'Show on maps' : 'Make private',
          privacy: () => {
            if (!M) { this.showToast('Hidden from maps and shared images'); return; }
            if (zone) { M.removeZone(zone.id); this.showToast(p.name + ' shows on maps again'); }
            else { M.addZoneAt(p.lat, p.lng, p.name); this.showToast(p.name + ' is hidden from maps and shares'); }
          }
        };
      }),
      hasToast: !!s.toast, toast: s.toast || ''
    };
  }
}
</script>
</body>
</html>
