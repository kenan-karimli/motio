<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Achievements</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
button,a{font:inherit;cursor:pointer}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioBadgeIn{from{opacity:0;transform:translateY(14px) scale(0.94)}to{opacity:1;transform:none}}
@keyframes motioShine{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(260%) skewX(-20deg)}}
@keyframes motioUnlock{0%{transform:scale(0.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes motioFill{from{stroke-dashoffset:176}}
.motio-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="m-page" style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 54px 20px 0">
  <div class="m-topbar"><a class="m-icon" href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back"><m-ic n="back"></m-ic></a><span class="m-tt">Badges</span><span style="width: 44px"></span></div>
  <div class="motio-scroll" style="flex: 1; min-height: 0; overflow-y: auto; margin: -54px -20px 0; padding: 108px 20px 40px; display: flex; flex-direction: column; gap: 10px">
    <div class="head"><div class="t"><span class="m-sub">{{ doneLabel }}</span><h1 class="m-title">badges.</h1></div></div>
    <sc-if value="{{ hasLatest }}" hint-placeholder-val="{{ true }}">
      <div class="m-card dark m-in" style="padding: 20px; display: flex; align-items: center; gap: 16px">
        <span class="m-pop" style="width: 72px; height: 72px; border-radius: 36px; background: var(--m-goal); color: #0F0F0F; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><m-ic n="{{ latest.icon }}" s="30"></m-ic></span>
        <span style="flex: 1; min-width: 0"><span class="m-label">{{ latest.kicker }}</span><div class="m-h3" style="font-size: 18px; margin-top: 4px">{{ latest.title }}</div><div class="m-sub" style="font-size: 12px">{{ latest.desc }}</div></span>
      </div>
    </sc-if>
    <div style="display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0">
      <sc-for list="{{ cats }}" as="c" hint-placeholder-count="4"><button type="button" class="m-chip {{ c.cls }}" onClick="{{ c.pick }}">{{ c.label }}</button></sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{ badges }}" as="b" hint-placeholder-count="9">
        <div class="m-card" role="img" aria-label="{{ b.aria }}" style="position: relative; padding: 16px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; animation: mPop .55s cubic-bezier(.34,1.4,.64,1) {{ b.delay }} backwards">
          <span style="width: 56px; height: 56px; border-radius: 28px; background: {{ b.bg }}; color: {{ b.fg }}; box-shadow: {{ b.ring }}; display: flex; align-items: center; justify-content: center; animation: {{ b.unlock }}"><m-ic n="{{ b.icon }}" s="24"></m-ic></span>
          <b style="font-size: 12px; line-height: 1.25; color: {{ b.tc }}">{{ b.title }}</b>
          <sc-if value="{{ b.locked }}" hint-placeholder-val="{{ false }}"><span class="m-progress" style="width: 60%"><i style="width: {{ b.pct }}"></i></span><span class="m-sub" style="font-size: 10.5px">{{ b.label }}</span></sc-if>
          <sc-if value="{{ b.fresh }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 8px; top: 8px; width: 8px; height: 8px; border-radius: 4px; background: var(--m-accent)"></span></sc-if>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // Badges you just earned glow once ("NEW"); they're marked seen a moment after you've looked.
  componentDidMount() {
    if (window.Motio) this.seenT = setTimeout(() => window.Motio.markBadgesSeen(), 2500);
  }
  componentWillUnmount() { clearTimeout(this.seenT); }
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const M = window.Motio;
    // Sample badges for the design canvas; the app uses your real trips.
    if (!this.fresh0) this.fresh0 = M ? new Set(M.achievements().filter((a) => a.fresh).map((a) => a.id)) : new Set(['streak7']);
    const list = M ? M.achievements() : [
      ['first', 'First steps', 'Record your first trip', 1, '#3DBF5C', 'Earned'], ['walk5', '5 km on foot', 'Walk or run 5 km in one day', 1, '#3DBF5C', 'Earned'],
      ['steps10k', '10,000 steps', 'Take 10,000 steps in one day', 0.84, '#F2766B', '8,410 / 10,000 steps'], ['streak7', 'One-week streak', 'Move at least 10 minutes every day for 7 days', 1, '#F6C343', 'Earned'],
      ['streak30', 'Thirty-day streak', 'Keep it going for 30 days', 0.4, '#F6C343', '12 / 30 days'], ['all5', 'All five', 'Walk, run, cycle, drive and take transit in one week', 0.8, '#B57BE0', '4 / 5 ways'],
      ['carfree', 'Car-free week', 'Seven days in a row moving without driving', 0.43, '#3DBF5C', '3 / 7 days'], ['k100', '100 km club', 'Cover 100 km in total', 1, '#F2766B', 'Earned']
    ].map(([id, title, desc, progress, color, label]) => ({ id, title, desc, progress, color, label, got: progress >= 1 }));
    const earned = list.filter((b) => b.got).length;
    // Each badge gets an icon and a group from what it is about.
    const kind = (b) => { const t = (b.id + ' ' + b.title).toLowerCase();
      return /streak|day|week/.test(t) && !/steps/.test(t) ? ['flame', 'streaks'] : /night/.test(t) ? ['moon', 'streaks'] : /early|morning/.test(t) ? ['sun', 'streaks']
        : /step/.test(t) ? ['steps', 'distance'] : /run/.test(t) ? ['run', 'distance'] : /bike|cycl|ride/.test(t) ? ['bike', 'distance'] : /bus|transit|metro|line/.test(t) ? ['bus', 'city']
        : /car|drive/.test(t) ? ['car', 'city'] : /place|explor|city|baku|map/.test(t) ? ['map', 'city'] : /friend|club|together/.test(t) ? ['users', 'city'] : /all|five|ways/.test(t) ? ['zap', 'city']
        : /first/.test(t) ? ['play', 'distance'] : /km|walk|foot/.test(t) ? ['walk', 'distance'] : ['badge', 'distance']; };
    const cat = (this.state && this.state.cat) || 'all';
    const sorted = [...list].sort((a, b) => (b.got - a.got) || (b.progress - a.progress)).filter((b) => cat === 'all' || kind(b)[1] === cat);
    const latest = list.find((b) => this.fresh0.has(b.id) && b.got) || list.filter((b) => b.got).slice(-1)[0];
    return {
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)',
      LK: { back: lk('back', 'You.dc.html') },
      doneLabel: earned + ' of ' + list.length + ' earned',
      hasLatest: !!latest,
      latest: latest ? { icon: kind(latest)[0], kicker: this.fresh0.has(latest.id) ? 'New badge' : 'Latest', title: latest.title, desc: latest.desc } : {},
      cats: [['all', 'All'], ['distance', 'Distance'], ['streaks', 'Streaks'], ['city', 'City']].map(([k, label]) => ({ label, cls: k === cat ? 'on' : '', pick: () => this.setState({ cat: k }) })),
      badges: sorted.map((b, i) => {
        const fresh = this.fresh0.has(b.id);
        return {
          title: b.title, label: b.label, got: b.got, locked: !b.got, fresh, icon: kind(b)[0],
          pct: Math.round(b.progress * 100) + '%',
          bg: b.got ? 'var(--m-ink)' : 'transparent', fg: b.got ? 'var(--m-bg-hi)' : 'var(--m-faint)', ring: b.got ? 'none' : 'inset 0 0 0 2px var(--m-line)', tc: b.got ? 'var(--m-ink)' : 'var(--m-mute)',
          delay: (emb ? 380 : 0) + Math.min(i, 12) * 40 + 'ms',
          unlock: fresh ? 'mPop 700ms cubic-bezier(0.34, 1.56, 0.64, 1) ' + (emb ? 700 : 300) + 'ms backwards' : 'none',
          aria: b.title + ': ' + (b.got ? 'earned' : b.label) + '. ' + b.desc
        };
      })
    };
  }
}
</script>
</body>
</html>
