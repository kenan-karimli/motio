<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Friend’s map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
button,a,input{font:inherit;color:inherit}
button,a{cursor:pointer;text-decoration:none}
button,a{transition:transform 140ms cubic-bezier(0.22,1,0.36,1)}
button:active,a:active{transform:scale(0.97)}
button.m-row,a.m-row{border:0;width:100%;text-align:left}
.avn{background:var(--m-card);box-shadow:inset 0 0 0 1.5px var(--m-line);color:var(--m-ink);overflow:hidden}
.avn img{width:100%;height:100%;object-fit:cover}
.avme{background:var(--m-ink);color:var(--m-bg-hi)}
.m-row.me{background:var(--m-ink);color:var(--m-bg-hi)}
.m-row.me .m-sub{color:color-mix(in srgb,var(--m-bg-hi) 70%,transparent)}
.m-row.me .avme{background:var(--m-ink-2)}
.bare{flex:1;min-width:0;height:100%;border:0;padding:0;background:transparent;outline:none;font:500 15px var(--m-font);color:var(--m-ink)}
.bare::placeholder{color:var(--m-faint)}
.m-toast{position:absolute;left:50%;bottom:28px;z-index:50;padding:12px 18px;border-radius:999px;background:var(--m-ink);color:var(--m-bg-hi);font:600 13px var(--m-font);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:motioToast 2300ms ease forwards}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioToast{0%{opacity:0;transform:translate(-50%,12px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
.motio-scroll::-webkit-scrollbar{display:none}
@keyframes motioShPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--m-walk) 50%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.motio-mapwrap .leaflet-bottom{bottom:auto;top:104px}
.motio-tiles{filter:saturate(0.4) brightness(1.03)}
.fm-float{box-shadow:0 4px 16px rgba(0,0,0,.08)}
</style>
</helmet>
<div class="m-page" style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden">
  <div class="motio-mapwrap" style="position: absolute; inset: 0; z-index: 0; background: var(--m-soft)">
    <div ref="{{ mapRef }}" style="position: absolute; inset: 0"></div>
  </div>
  <div style="position: absolute; top: 52px; left: 16px; right: 16px; z-index: 500; display: flex; gap: 8px">
    <a class="m-icon fm-float" href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back"><m-ic n="back"></m-ic></a>
    <sc-if value="{{ liveNow }}" hint-placeholder-val="{{ false }}"><button type="button" class="m-chip fm-float" onClick="{{ flyLive }}" style="height: 44px; padding: 0 16px"><i style="width: 8px; height: 8px; border-radius: 4px; background: var(--m-walk); animation: motioShPulse 1.6s ease-out infinite"></i>{{ liveChip }}</button></sc-if>
  </div>

  <div class="m-sheet" style="z-index: 600; padding: 12px 20px 30px; max-height: 52%; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -10px 40px rgba(0,0,0,.08)">
    <i style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--m-line); flex-shrink: 0"></i>
    <h1 class="m-h2" style="flex-shrink: 0">{{ title }}</h1>
    <div class="motio-scroll" style="flex: 1; min-height: 0; overflow-y: auto; margin: 0 -20px; padding: 0 20px 4px; display: flex; flex-direction: column; gap: 6px">
      <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}"><span class="m-skel" style="height: 58px"></span><span class="m-skel" style="height: 58px"></span></sc-if>
      <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}"><div role="status" class="m-row tx" style="font-size: 13px">{{ error }}</div></sc-if>
      <sc-if value="{{ nothing }}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; gap: 12px"><m-art name="pinoff" style="width: 64px; height: 64px; flex-shrink: 0"></m-art><span class="m-sub">{{ nothingText }}</span></div></sc-if>

      <sc-if value="{{ hasLive }}" hint-placeholder-val="{{ true }}">
        <button type="button" class="m-row {{ liveCls }}" onClick="{{ flyLive }}" style="flex-shrink: 0">
          <span class="av avn"><m-ic n="pin" s="17"></m-ic></span>
          <span style="flex: 1; min-width: 0"><b style="font-size: 14px">{{ liveTitle }}</b><div class="m-sub" style="font-size: 12px">{{ liveSub }}</div></span>
          <sc-if value="{{ liveNow }}" hint-placeholder-val="{{ false }}"><m-ic n="chev" s="16"></m-ic></sc-if>
        </button>
      </sc-if>

      <sc-if value="{{ hasTrips }}" hint-placeholder-val="{{ true }}">
        <span class="m-label" style="margin: 8px 4px 2px">Routes this week</span>
        <sc-for list="{{ trips }}" as="t" hint-placeholder-count="3">
          <button type="button" class="m-row" onClick="{{ t.fly }}" aria-label="{{ t.aria }}" style="flex-shrink: 0">
            <i style="width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; background: {{ t.c }}"></i>
            <span style="flex: 1; min-width: 0"><b style="font-size: 14px">{{ t.what }}</b><div class="m-sub" style="font-size: 12px">{{ t.when }}</div></span>
            <m-ic n="chev" s="16"></m-ic>
          </button>
        </sc-for>
        <sc-if value="{{ noTrips }}" hint-placeholder-val="{{ false }}"><span class="m-sub" style="padding: 0 4px">No routes in the last 7 days.</span></sc-if>
      </sc-if>

      <sc-if value="{{ hasPlaces }}" hint-placeholder-val="{{ true }}">
        <span class="m-label" style="margin: 8px 4px 2px">Usual places · last 30 days</span>
        <sc-for list="{{ places }}" as="p" hint-placeholder-count="3">
          <button type="button" class="m-row" onClick="{{ p.fly }}" aria-label="{{ p.aria }}" style="flex-shrink: 0">
            <span class="av avn" style="width: 30px; height: 30px; font-size: 12px">{{ p.n }}</span>
            <span style="flex: 1; min-width: 0"><b style="font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ p.name }}</b><div class="m-sub" style="font-size: 12px">{{ p.visits }}</div></span>
          </button>
        </sc-for>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.onFriend = () => this.forceUpdate();
    window.addEventListener('motio:friend', this.onFriend);
    this.fid = window.__motioFriend || null;
    this.load();
    // Live location moves: ask again every 20 seconds while this page is open.
    this.pollT = setInterval(() => { if (!document.hidden) this.loadLive(); }, 20000);
  }
  componentWillUnmount() { window.removeEventListener('motio:friend', this.onFriend); clearInterval(this.pollT); clearTimeout(this.mapT); if (this.ctrl) this.ctrl.destroy(); }
  async load() {
    const M = window.Motio;
    if (!M || !this.fid) return;
    this.setState({ loading: true, error: null });
    try {
      const sh = await M.friends.sharing();
      const who = sh.toMe.find((p) => p.id === this.fid) || null;
      const k = who ? who.kinds : {};
      const [routes, places, live] = await Promise.all([
        k.routes ? M.friends.routes(this.fid) : null,
        k.places ? M.friends.places(this.fid) : null,
        k.live ? M.friends.live(this.fid) : null
      ]);
      this.setState({ who, kinds: k, trips: routes ? routes.trips : [], places: places ? places.places : [], live: live ? live.live : null, loading: false });
    } catch (e) { this.setState({ loading: false, error: (e && e.message) || 'Couldn’t load their map.' }); }
  }
  loadLive() {
    const M = window.Motio, s = this.state || {};
    if (!M || !this.fid || !(s.kinds || {}).live) return;
    M.friends.live(this.fid).then((r) => this.setState({ live: r.live })).catch((e) => { if (e && e.status === 403) this.setState({ kinds: { ...s.kinds, live: false }, live: null }); });
  }
  renderVals() {
    if (window.__motioFriend && this.fid && window.__motioFriend !== this.fid && !this.switching) {
      this.switching = true;
      setTimeout(() => { this.fid = window.__motioFriend; this.switching = false; this.drawn = null; this.setState({ who: null, kinds: null, trips: [], places: [], live: null }); this.load(); }, 0);
    }
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const s = this.state || {};
    const M = window.Motio;
    const now = Date.now();
    const D = M ? s : {
      who: { name: 'Leyla Aliyeva' }, kinds: { routes: true, places: true, live: true },
      live: { lat: 40.4, lng: 49.87, at: now - 90000, mode: 'walk' },
      trips: [{ id: 'a', start: now - 5 * 3600000, end: now - 4.5 * 3600000, mode: 'walk', distanceM: 2400, points: [[40.4, 49.86], [40.41, 49.87]] }, { id: 'b', start: now - 30 * 3600000, end: now - 29 * 3600000, mode: 'bike', distanceM: 11200, points: [[40.4, 49.86], [40.38, 49.89]] }],
      places: [{ lat: 40.4, lng: 49.87, visits: 9, name: 'Gym' }, { lat: 40.38, lng: 49.89, visits: 4 }]
    };
    const trips = (D.trips || []).slice().reverse(), places = D.places || [], live = D.live || null, kinds = D.kinds || {};
    // Draw after the page has slid in; redraw whenever the data changes.
    const sig = trips.length + ':' + places.length + ':' + (live ? live.at : 0);
    if (M && window.MotioMap && this.mapEl && !this.ctrl && !this.mapT) this.mapT = setTimeout(() => { this.ctrl = window.MotioMap.mountFriend(this.mapEl); this.drawn = null; this.forceUpdate(); }, 440);
    if (this.ctrl && this.drawn !== sig) { this.drawn = sig; this.ctrl.show({ trips, places, live }); }
    const first = D.who ? D.who.name.split(' ')[0] : 'Your friend';
    const MODE = { walk: 'Walk', run: 'Run', bike: 'Ride', drive: 'Drive', transit: 'Transit' };
    const COLOR = { walk: 'var(--m-walk)', run: 'var(--m-run)', bike: 'var(--m-bike)', drive: 'var(--m-drive)', transit: 'var(--m-transit)' };
    const mi = M && M.settings().unit === 'mi';
    const dist = (m) => (mi ? (m / 1609).toFixed(1) + ' mi' : (m / 1000).toFixed(1) + ' km');
    const ago = (t) => { const m = Math.round((now - t) / 60000); return m < 1 ? 'just now' : m === 1 ? '1 min ago' : m + ' min ago'; };
    const when = (t) => new Date(t).toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
    const base = emb ? 380 : 0;
    const hasAny = kinds.routes || kinds.places || kinds.live;
    return {
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)',
      LK: { back: lk('back', 'Sharing.dc.html') },
      mapRef: (el) => { const firstEl = el && !this.mapEl; this.mapEl = el; if (firstEl && M) requestAnimationFrame(() => this.setState({ mapReady: true })); },
      title: first + '’s map',
      loading: !!s.loading && !s.kinds, hasError: !!s.error, error: s.error || '',
      nothing: !!D.kinds && !hasAny,
      nothingText: first + ' isn’t sharing anything with you right now.',
      d0: base + 'ms',
      hasLive: !!kinds.live, liveNow: !!live,
      liveCls: live ? 'me' : '', liveChip: first + ' · live',
      liveTitle: live ? first + ' is out now' + (MODE[live.mode] ? ' · ' + MODE[live.mode] : '') : 'Not moving right now',
      liveSub: live ? 'Updated ' + ago(live.at) : 'Their position shows here while they’re on a trip',
      flyLive: () => { if (this.ctrl && live) this.ctrl.fly(live.lat, live.lng); },
      hasTrips: !!kinds.routes,
      trips: trips.slice(0, 30).map((t, i) => ({ c: COLOR[t.mode] || 'var(--m-ink)', what: (MODE[t.mode] || 'Trip') + ' · ' + dist(t.distanceM || 0), when: when(t.start), d: base + 80 + Math.min(i, 10) * 40 + 'ms',
        aria: (MODE[t.mode] || 'Trip') + ' ' + when(t.start) + ', show on map',
        fly: () => { const p = t.points[Math.floor(t.points.length / 2)]; if (this.ctrl && p) this.ctrl.fly(p[0], p[1]); } })),
      noTrips: !!kinds.routes && !trips.length && !s.loading,
      hasPlaces: !!kinds.places,
      places: places.map((p, i) => ({ n: i + 1, name: p.name || 'Place ' + (i + 1), visits: p.visits + (p.visits === 1 ? ' visit' : ' visits'), d: base + 120 + i * 40 + 'ms',
        aria: (p.name || 'Place ' + (i + 1)) + ', show on map', fly: () => this.ctrl && this.ctrl.fly(p.lat, p.lng) }))
    };
  }
}
</script>
</body>
</html>
