<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Session expired</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
a{color:inherit}
a{transition:transform 140ms cubic-bezier(0.22,1,0.36,1)}
a:active{transform:scale(0.96)}
@keyframes motioRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes motioHand{to{transform:rotate(360deg)}}
@keyframes motioClick{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-6px)}90%{transform:translateY(2px)}}
</style>
</helmet>
<div class="m-page" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 70px 32px 190px; text-align: center">
  <m-art name="key" size="210"></m-art>
<h1 class="m-title m-in" style="font-size: 32px; --i: 1">your session timed out.</h1><span class="m-sub m-in" style="--i: 2; max-width: 300px">To keep your movement history private, we log you out after 30 days or when you sign in on a new phone. Tracking kept going in the background.</span>
  <div style="position: absolute; left: 22px; right: 22px; bottom: 34px; display: flex; flex-direction: column; gap: 10px">
<a class="m-btn wide" href="{{ LK.login.href }}" onClick="{{ LK.login.go }}" style="text-decoration: none">Log in again</a><a class="m-btn w wide" href="{{ LK.welcome.href }}" onClick="{{ LK.welcome.go }}" style="text-decoration: none">Use a different account</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    return { foxRef: window.MotioMascot ? window.MotioMascot.fox('sleep', 150) : null, LK: { login: lk('login', 'Login.dc.html'), welcome: lk('welcome', 'Welcome.dc.html') } };
  }
}
</script>
</body>
</html>
