<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Session expired</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#5B4FE0}
a{color:inherit}
a{transition:transform 140ms cubic-bezier(0.22,1,0.36,1)}
a:active{transform:scale(0.96)}
@keyframes motioRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes motioHand{to{transform:rotate(360deg)}}
@keyframes motioClick{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-6px)}90%{transform:translateY(2px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #5B4FE0; color: #FFFFFF; font-family: 'Poppins', system-ui, sans-serif; padding: 60px 28px 40px; display: flex; flex-direction: column; align-items: center; text-align: center">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0; pointer-events: none"><circle cx="360" cy="110" r="140" fill="#6A5FE8"></circle></svg>

  <svg aria-hidden="true" width="220" height="220" viewBox="0 0 220 220" style="position: relative; margin-top: 40px; animation: motioRise 520ms cubic-bezier(0.22, 1, 0.36, 1) backwards">
    <circle cx="100" cy="104" r="80" fill="#FFFFFF"></circle>
    <circle cx="100" cy="104" r="66" fill="none" stroke="#E3E1F3" stroke-width="4" stroke-dasharray="2 14"></circle>
    <g style="transform-origin: 100px 104px; animation: none"><path d="M100 104 V56" stroke="#1F1D47" stroke-width="6" stroke-linecap="round"></path></g>
    <g style="transform-origin: 100px 104px; animation: none"><path d="M100 104 L132 104" stroke="#F2766B" stroke-width="6" stroke-linecap="round"></path></g>
    <circle cx="100" cy="104" r="7" fill="#1F1D47"></circle>
    <g transform="translate(140 130)" style="animation: motioClick 2.4s ease-in-out infinite">
      <rect x="0" y="22" width="56" height="46" rx="10" fill="#F6C343"></rect>
      <path d="M12 22 V14 a16 16 0 0 1 32 0 V22" fill="none" stroke="#F6C343" stroke-width="8" stroke-linecap="round"></path>
      <circle cx="28" cy="42" r="6" fill="#1F1D47"></circle><path d="M28 46 v8" stroke="#1F1D47" stroke-width="4" stroke-linecap="round"></path>
    </g>
  </svg>

  <h1 style="position: relative; margin: 26px 0 0; font-size: 30px; font-weight: 700; line-height: 1.15; animation: motioRise 520ms cubic-bezier(0.22, 1, 0.36, 1) 120ms backwards">Your session timed out</h1>
  <p style="position: relative; margin: 10px 0 0; font-size: 15px; line-height: 1.5; max-width: 300px; color: rgba(255,255,255,0.92); animation: motioRise 520ms cubic-bezier(0.22, 1, 0.36, 1) 180ms backwards">To keep your movement history private, we log you out after 30 days or when you sign in on a new phone. Tracking kept going in the background.</p>

  <div style="position: relative; margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 10px">
    <a href="{{ LK.login.href }}" onClick="{{ LK.login.go }}" style="min-height: 56px; border-radius: 28px; background: #F6C343; color: #1F1D47; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: none">Log in again</a>
    <a href="{{ LK.welcome.href }}" onClick="{{ LK.welcome.go }}" style="min-height: 52px; border-radius: 26px; background: rgba(255,255,255,0.16); color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Use a different account</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    return { LK: { login: lk('login', 'Login.dc.html'), welcome: lk('welcome', 'Welcome.dc.html') } };
  }
}
</script>
</body>
</html>
