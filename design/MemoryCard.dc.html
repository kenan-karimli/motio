<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memory card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes moDeal{0%{opacity:0;transform:translate(120px, 40px) rotate(14deg)}100%{opacity:1;transform:none}}
@keyframes moDraw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
</style>
</helmet>
<div style="position: relative; width: 350px; height: 420px; box-sizing: border-box; padding: 20px; border-radius: 30px; background: {{ bg }}; color: #1F1D47; font-family: 'Poppins', system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 18px 36px rgba(31,29,71,0.18); animation: moDeal 620ms cubic-bezier(0.22, 1, 0.36, 1) backwards">
  <svg aria-hidden="true" width="350" height="420" viewBox="0 0 350 340" style="position: absolute; left: 0; top: 40px"><path d="{{ path }}" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{ path }}" fill="none" stroke="#1F1D47" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="600" style="animation: moDraw 1500ms cubic-bezier(0.22, 1, 0.36, 1) 350ms backwards"></path></svg>
  <div style="position: relative; display: flex; justify-content: space-between; align-items: center"><span style="padding: 5px 12px; border-radius: 12px; background: rgba(255,255,255,0.85); font-size: 12px; font-weight: 700">{{ kind }}</span><span style="font-size: 12px; font-weight: 600">{{ when }}</span></div>
  <div style="position: relative; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 52px; font-weight: 700; line-height: 1; letter-spacing: -2px">{{ big }}</span><span style="font-size: 18px; font-weight: 600; line-height: 1.25">{{ line }}</span><span style="font-size: 12px; opacity: 0.8">{{ stats }}</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"memo":{"editor":null},"$preview":{"width":350,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const m = this.props.memo || { when: 'Tue 5 Nov 2025', bg: '#F6C343', kind: 'Ride', big: '10.4 km', line: 'Your first ride over 10 km', stats: '42 min · 15 km/h average', path: 'M30 270 C 70 270, 90 200, 150 200 S 230 260, 270 190 S 300 90, 320 70' };
    return m;
  }
}
</script>
</body>
</html>
