<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memory card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes moDeal{0%{opacity:0;transform:translate(120px, 40px) rotate(14deg)}100%{opacity:1;transform:none}}
@keyframes moDraw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
</style>
</helmet>
<div style="width: 350px; height: 420px; display: flex; align-items: center; justify-content: center">
  <div style="width: 330px; box-sizing: border-box; padding: 16px; border-radius: 30px; background: var(--m-card); color: var(--m-ink); font-family: var(--m-font); display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.1); transform: rotate(-1.5deg); animation: moDeal 620ms cubic-bezier(0.22, 1, 0.36, 1) backwards">
    <div style="height: 230px; border-radius: 20px; overflow: hidden; background: var(--m-soft)">
      <svg aria-hidden="true" width="298" height="230" viewBox="20 55 310 230" preserveAspectRatio="xMidYMid meet" style="display: block"><path d="{{ path }}" fill="none" stroke="var(--m-card)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{ path }}" fill="none" stroke="{{ bg }}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="600" style="animation: moDraw 1500ms cubic-bezier(0.22, 1, 0.36, 1) 350ms backwards"></path></svg>
    </div>
    <div style="padding: 0 6px; display: flex; flex-direction: column; gap: 8px">
      <span class="m-label">{{ when }} · {{ kind }}</span>
      <p style="margin: 0; font: 500 20px/1.3 var(--m-font); letter-spacing: -0.3px">{{ line }}: <b style="font-weight: 700">{{ big }}</b>.</p>
      <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 6px"><span class="m-sub" style="font-size: 12px">{{ stats }}</span><span style="font: 600 13px var(--m-font)">motio.</span></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"memo":{"editor":null},"$preview":{"width":350,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const m = this.props.memo || { when: 'Tue 5 Nov 2025', bg: '#4F7BF0', kind: 'Ride', big: '10.4 km', line: 'Your biggest ride that day', stats: '42 min · 15 km/h average', path: 'M30 270 C 70 270, 90 200, 150 200 S 230 260, 270 190 S 300 90, 320 70' };
    return m;
  }
}
</script>
</body>
</html>
