<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · You’re offline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
a{color:inherit}
button{font:inherit;cursor:pointer}
button,a{transition:transform 140ms cubic-bezier(0.22,1,0.36,1),background-color 200ms ease}
button:active,a:active{transform:scale(0.96)}
@keyframes motioRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes motioFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes motioSway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes motioSpin{to{transform:rotate(360deg)}}
@keyframes motioShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes motioPop{0%{transform:scale(0.5);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
</style>
</helmet>
<div class="m-page" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 70px 32px 190px; text-align: center">
  <m-art name="plug" size="210"></m-art>
<sc-if value="{{ notBack }}" hint-placeholder-val="{{ true }}"><h1 class="m-title m-in" style="font-size: 32px; --i: 1">you’re offline.</h1><span class="m-sub m-in" style="--i: 2; max-width: 300px">Motio can’t reach the internet. Don’t worry: your moves are still being recorded and will sync later.</span><span class="m-chip m-in" style="--i: 3; cursor: default">12 trips waiting to sync</span><sc-if value="{{ stillOff }}" hint-placeholder-val="{{ false }}"><span class="m-sub" style="color: var(--m-warn)">Still no connection. Check Wi-Fi or mobile data.</span></sc-if></sc-if><sc-if value="{{ back }}" hint-placeholder-val="{{ false }}"><h1 class="m-title m-in" style="font-size: 32px; --i: 1">back online.</h1><span class="m-sub m-in" style="--i: 2; max-width: 300px">All 12 trips synced.</span></sc-if>
  <div style="position: absolute; left: 22px; right: 22px; bottom: 34px; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{ notBack }}" hint-placeholder-val="{{ true }}"><button type="button" class="m-btn wide" onClick="{{ retry }}">{{ retryLabel }}</button><a class="m-btn w wide" href="{{ LK.home.href }}" onClick="{{ LK.home.go }}" style="text-decoration: none">{{ homeLabel }}</a></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const s = this.state || {};
    const tries = s.tries || 0;
    return { foxRef: window.MotioMascot ? window.MotioMascot.fox('curl', 160) : null,
      LK: { home: lk('home', 'Main.dc.html') },
      busy: !!s.busy, back: !!s.online, notBack: !s.online, stillOff: !!s.stillOff && !s.busy,
      retryLabel: s.busy ? 'Checking connection…' : 'Try again',
      // First retry fails (so the error state is visible), the second one reconnects.
      retry: () => {
        if (s.busy) return;
        this.setState({ busy: true, stillOff: false });
        setTimeout(() => this.setState(tries === 0 ? { busy: false, stillOff: true, tries: 1 } : { busy: false, online: true }), 1200);
      },
      homeLabel: s.online ? 'Continue to Today' : 'Keep using offline',
      homeBg: s.online ? '#1F1D47' : 'rgba(255,255,255,0.55)',
      homeFg: s.online ? '#FFFFFF' : '#1F1D47'
    };
  }
}
</script>
</body>
</html>
