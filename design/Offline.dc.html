<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · You’re offline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#6E8CF7}
a{color:inherit}
button{font:inherit;cursor:pointer}
button,a{transition:transform 140ms cubic-bezier(0.22,1,0.36,1),background-color 200ms ease}
button:active,a:active{transform:scale(0.96)}
@keyframes motioRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes motioFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes motioSway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes motioSpin{to{transform:rotate(360deg)}}
@keyframes motioShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes motioPop{0%{transform:scale(0.5);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #6E8CF7; color: #1F1D47; font-family: 'Poppins', system-ui, sans-serif; padding: 60px 28px 40px; display: flex; flex-direction: column; align-items: center; text-align: center">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0; pointer-events: none"><circle cx="350" cy="80" r="140" fill="#7F9AF8"></circle><circle cx="30" cy="700" r="110" fill="#7F9AF8"></circle></svg>

  <svg aria-hidden="true" width="260" height="250" viewBox="0 0 260 250" style="position: relative; margin-top: 30px; animation: motioRise 520ms cubic-bezier(0.22, 1, 0.36, 1) backwards">
    <g style="animation: none">
      <path d="M70 150 a40 40 0 0 1 8-79 a54 54 0 0 1 104 8 a36 36 0 0 1 8 71 z" fill="#FFFFFF"></path>
      <path d="M100 112 a40 40 0 0 1 60 0 M112 126 a22 22 0 0 1 36 0" fill="none" stroke="#C9C5EC" stroke-width="7" stroke-linecap="round"></path>
      <circle cx="130" cy="138" r="5" fill="#C9C5EC"></circle>
      <path d="M92 84 L170 150" stroke="#F2766B" stroke-width="7" stroke-linecap="round"></path>
    </g>
    <g style="transform-origin: 104px 168px; animation: none">
      <path d="M104 160 C 100 190, 60 190, 62 220" fill="none" stroke="#1F1D47" stroke-width="5" stroke-linecap="round"></path>
      <rect x="52" y="218" width="22" height="16" rx="4" fill="#F6C343"></rect>
      <path d="M57 234 v8 M69 234 v8" stroke="#1F1D47" stroke-width="4" stroke-linecap="round"></path>
    </g>
    <g style="transform-origin: 170px 168px; animation: none">
      <path d="M170 160 C 176 186, 200 190, 198 214" fill="none" stroke="#1F1D47" stroke-width="5" stroke-linecap="round"></path>
      <rect x="186" y="212" width="24" height="18" rx="5" fill="#F2766B"></rect>
      <path d="M192 212 v-6 M204 212 v-6" stroke="#1F1D47" stroke-width="4" stroke-linecap="round"></path>
    </g>
  </svg>

  <sc-if value="{{ notBack }}" hint-placeholder-val="{{ true }}">
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; animation: motioRise 520ms cubic-bezier(0.22, 1, 0.36, 1) 120ms backwards">
      <h1 style="margin: 10px 0 0; font-size: 32px; font-weight: 700">You’re offline</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; max-width: 300px">Motio can’t reach the internet. Don’t worry: your moves are still being recorded and will sync later.</p>
      <span style="margin-top: 6px; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 18px; background: rgba(255,255,255,0.6); font-size: 13px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 4px; background: #F6C343"></span>12 trips waiting to sync</span>
      <sc-if value="{{ stillOff }}" hint-placeholder-val="{{ false }}"><span role="alert" style="font-size: 13px; font-weight: 600; color: #1F1D47; animation: motioShake 420ms ease">Still no connection. Check Wi-Fi or mobile data.</span></sc-if>
    </div>
  </sc-if>
  <sc-if value="{{ back }}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px">
      <span style="width: 64px; height: 64px; border-radius: 32px; background: #3DBF5C; margin-top: 6px; display: flex; align-items: center; justify-content: center; animation: motioPop 520ms cubic-bezier(0.34, 1.56, 0.64, 1)"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
      <h1 style="margin: 0; font-size: 32px; font-weight: 700">Back online!</h1>
      <p style="margin: 0; font-size: 15px">All 12 trips synced.</p>
    </div>
  </sc-if>

  <div style="position: relative; margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 10px; animation: motioRise 520ms cubic-bezier(0.22, 1, 0.36, 1) 220ms backwards">
    <sc-if value="{{ notBack }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ retry }}" style="width: 100%; min-height: 56px; border-radius: 28px; border: 0; background: #1F1D47; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: none">
        <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}"><span style="width: 18px; height: 18px; border-radius: 9px; border: 2.5px solid rgba(255,255,255,0.35); border-top-color: #FFFFFF; animation: motioSpin 700ms linear infinite"></span></sc-if>
        {{ retryLabel }}
      </button>
    </sc-if>
    <a href="{{ LK.home.href }}" onClick="{{ LK.home.go }}" style="width: 100%; min-height: 52px; border-radius: 26px; background: {{ homeBg }}; color: {{ homeFg }}; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">{{ homeLabel }}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const s = this.state || {};
    const tries = s.tries || 0;
    return {
      LK: { home: lk('home', 'Main.dc.html') },
      busy: !!s.busy, back: !!s.online, notBack: !s.online, stillOff: !!s.stillOff && !s.busy,
      retryLabel: s.busy ? 'Checking connection…' : 'Try again',
      // First retry fails (so the error state is visible), the second one reconnects.
      retry: () => {
        if (s.busy) return;
        this.setState({ busy: true, stillOff: false });
        setTimeout(() => this.setState(tries === 0 ? { busy: false, stillOff: true, tries: 1 } : { busy: false, online: true }), 1200);
      },
      homeLabel: s.online ? 'Continue to Today' : 'Keep using offline',
      homeBg: s.online ? '#1F1D47' : 'rgba(255,255,255,0.55)',
      homeFg: s.online ? '#FFFFFF' : '#1F1D47'
    };
  }
}
</script>
</body>
</html>
