<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Day map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
button,a{font:inherit;cursor:pointer;transition:transform 140ms cubic-bezier(0.22,1,0.36,1)}
button:active,a:active{transform:scale(0.95)}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioCardUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.motio-range{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
.motio-range::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--m-line)}
.motio-range::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:11px;background:var(--m-ink);border:3px solid var(--m-card);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.motio-chips::-webkit-scrollbar{display:none}
.mv-glass{background:color-mix(in srgb,var(--m-card) 62%,transparent);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 16px rgba(0,0,0,.08)}
.mv-step{width:30px;height:30px;border:0;border-radius:15px;background:transparent;color:var(--m-ink);display:inline-flex;align-items:center;justify-content:center;padding:0}
.leaflet-control-attribution{font-size:8px!important;background:transparent!important;color:#999!important}
.leaflet-control-attribution a{color:#999!important}
</style>
</helmet>
<div class="m-page" style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden">
  <div ref="{{ mapRef }}" style="position: absolute; inset: 0 0 280px; z-index: 0"></div>

  <div style="position: absolute; left: 16px; right: 16px; top: 12px; z-index: 5; display: flex; align-items: center; gap: 8px">
    <a href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back" class="m-icon mv-glass"><m-ic n="back"></m-ic></a>
    <span class="m-chip mv-glass" style="height: 44px; padding: 0 6px; gap: 2px; cursor: default">
      <button type="button" class="mv-step" onClick="{{ prevDay }}" aria-label="Previous day"><m-ic n="back" s="15"></m-ic></button>
      <span style="min-width: 104px; text-align: center">{{ dayLabel }}</span>
      <button type="button" class="mv-step" onClick="{{ nextDay }}" aria-label="Next day" style="opacity: {{ nextOp }}"><m-ic n="chev" s="15"></m-ic></button>
    </span>
    <span class="sp"></span>
    <button type="button" class="m-icon mv-glass" onClick="{{ togglePlay }}" aria-label="{{ playLabel }}"><m-ic n="{{ playIcon }}" s="17"></m-ic></button>
  </div>

  <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
    <div class="m-card" style="position: absolute; left: 24px; right: 24px; top: 34%; z-index: 4; text-align: center; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.08)">
      <b style="display: block; font-size: 16px">No trips on this day.</b>
      <span class="m-sub" style="display: block; margin-top: 4px">{{ emptyHint }}</span>
    </div>
  </sc-if>

  <div class="m-sheet" style="z-index: 5; padding: 12px 20px 30px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -10px 40px rgba(0,0,0,.08)">
    <i style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--m-line)"></i>
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div><div class="m-label">{{ movedLabel }}</div><div class="m-num" style="font-size: 36px; margin-top: 6px">{{ moved }}</div></div>
      <span class="m-sub" style="text-align: right">{{ totalDist }}<br>{{ counts }}</span>
    </div>
    <sc-if value="{{ hasTrips }}" hint-placeholder-val="{{ true }}">
      <div class="motio-chips" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px; scrollbar-width: none">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="3">
          <button type="button" class="m-row {{ c.tint }}" onClick="{{ c.go }}" style="flex-shrink: 0; min-width: 150px; border: 0; flex-direction: column; align-items: flex-start; gap: 2px; color: var(--m-ink); text-align: left; box-shadow: {{ c.ring }}; transition: box-shadow .2s"><b style="font-size: 13px">{{ c.title }}</b><span class="m-sub" style="font-size: 12px; color: var(--m-ink-2)">{{ c.sub }}</span></button>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 0">
        <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600"><span class="m-dot" style="width: 8px; height: 8px; background: {{ nowColor }}"></span><span style="flex: 1">{{ clock }} · {{ nowLabel }}</span><span class="m-sub" style="font-size: 12px">{{ sofar }} so far</span></div>
        <input class="motio-range" type="range" min="0" max="1000" step="1" value="{{ pos }}" onChange="{{ onScrub }}" aria-label="Time of day">
        <div class="m-sub" style="display: flex; justify-content: space-between; margin-top: -4px; font-size: 11px"><span>{{ startLabel }}</span><span>{{ endLabel }}</span></div>
      </div>
    </sc-if>
    <button type="button" class="m-btn wide" onClick="{{ share }}" disabled="{{ empty }}" style="opacity: {{ shareOp }}">Share this day</button>
  </div>
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 50%; top: 110px; z-index: 50; transform: translateX(-50%); padding: 12px 18px; border-radius: 18px; background: var(--m-ink); color: var(--m-bg-hi); font-size: 13px; white-space: nowrap">{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  toast(msg) { clearTimeout(this.toastT); this.setState({ toast: msg }); this.toastT = setTimeout(() => this.setState({ toast: null }), 2300); }
  componentWillUnmount() {
    clearTimeout(this.toastT);
    clearInterval(this.timer);
    clearTimeout(this.mountT);
    if (this.ctrl) this.ctrl.destroy();
  }
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const s = this.state || {};
    const M = window.Motio;
    // Day handed over by the timeline (days back from today).
    if (this.off0 === undefined) { this.off0 = window.__motioDay || 0; window.__motioDay = null; }
    const off = s.dayOff ?? this.off0;
    const DAY = 86400000;
    const from = (M ? M.dayStart() : new Date().setHours(0, 0, 0, 0)) - off * DAY;
    const to = from + DAY;
    const COLORS = { walk: '#2FB457', run: '#E5604F', bike: '#4F7BF0', drive: '#E7A82A', transit: '#8E6BE0' };
    const NAMES = { walk: 'Walking', run: 'Running', bike: 'Cycling', drive: 'Driving', transit: 'Bus & metro' };
    const SHORT = { walk: 'Walk', run: 'Run', bike: 'Ride', drive: 'Drive', transit: 'Bus' }, TINT = { walk: 'tw', run: 'tr', bike: 'tb', drive: 'td', transit: 'tt' };
    // On the design canvas there is no data layer: show a sample day.
    const routes = M ? M.route(from, to) : [
      { id: 'a', mode: 'walk', color: COLORS.walk, start: from + 7.8 * 3600000, end: from + 8.13 * 3600000, points: [[40.3836, 49.815, from + 7.8 * 3600000], [40.3747, 49.8597, from + 8.13 * 3600000]], distanceM: 1600 },
      { id: 'b', mode: 'bike', color: COLORS.bike, start: from + 8.33 * 3600000, end: from + 8.95 * 3600000, points: [[40.3747, 49.8597, from + 8.33 * 3600000], [40.3628, 49.8342, from + 8.95 * 3600000]], distanceM: 9100 }
    ];
    const t0 = routes.length ? routes[0].start - 10 * 60000 : from + 6 * 3600000;
    const t1 = routes.length ? routes[routes.length - 1].end + 10 * 60000 : from + 24 * 3600000 - 60000;
    const pos = s.pos == null ? 1000 : s.pos;
    const t = t0 + (t1 - t0) * pos / 1000;
    const key = from + ':' + routes.length + ':' + (M ? M.status().version : 0);

    // Start the map engine only after the page has slid in; building it mid-slide makes the slide stutter.
    if (this.bornAt === undefined) this.bornAt = performance.now();
    const settling = !this.ctrl && performance.now() - this.bornAt < 430;
    if (settling && !this.mountT) this.mountT = setTimeout(() => { this.mountT = null; this.bornAt = 0; this.setState({ ready: true, tick: Date.now() }); }, 440 - (performance.now() - this.bornAt));
    if (this.mapEl && window.MotioMap && !settling) {
      if (!this.ctrl) { this.ctrl = window.MotioMap.mount(this.mapEl, routes); this.mapKey = key; this.mapFrom = from; setTimeout(() => this.ctrl && this.ctrl.invalidate(), 450); }
      else if (this.mapKey !== key) { this.ctrl.update(routes, this.mapFrom !== from); this.mapKey = key; this.mapFrom = from; } // a new day frames itself; new points keep your zoom
      requestAnimationFrame(() => this.ctrl && this.ctrl.setTime(t, !!s.playing));
    }

    const cur = routes.find((r) => t >= r.start && t <= r.end);
    let so = 0;
    for (const r of routes) so += r.end <= t ? r.distanceM : t > r.start ? r.distanceM * (t - r.start) / Math.max(1, r.end - r.start) : 0;
    const hhmm = (x) => { const d = new Date(x); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
    const dist = (m) => (M ? M.fmtDist(m) : (m / 1000).toFixed(1) + ' km');
    const speed = cur ? cur.distanceM / Math.max(1, (cur.end - cur.start) / 1000) : 0;

    const togglePlay = () => {
      if (s.playing) { clearInterval(this.timer); this.setState({ playing: false }); return; }
      let p = pos >= 1000 ? 0 : pos;
      this.setState({ playing: true, pos: p });
      clearInterval(this.timer);
      this.timer = setInterval(() => {
        p = Math.min(1000, p + 4);
        this.setState({ pos: p });
        if (p >= 1000) { clearInterval(this.timer); this.setState({ playing: false }); }
      }, 50);
    };
    const dayLabel = off === 0 ? 'Today' : off === 1 ? 'Yesterday' : new Date(from).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    const dateShort = new Date(from).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    const movedMs = routes.reduce((a, r) => a + Math.min(r.end, Date.now()) - r.start, 0), totalM = routes.reduce((a, r) => a + r.distanceM, 0);
    const pl = M ? M.timeline(from).filter((x) => x.kind === 'stay').length : 3;
    const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
    const fmtMin = (m) => (M ? M.fmtMin(m) : Math.floor(m / 60) + 'h ' + Math.round(m % 60) + 'm');
    const dur = (ms) => { const m = Math.max(1, Math.round(ms / 60000)); return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + ' min'; };
    return {
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)',
      LK: { back: lk('back', 'Main.dc.html') },
      mapRef: (el) => { const first = el && !this.mapEl; this.mapEl = el; if (first) requestAnimationFrame(() => this.setState({ ready: true })); },
      dayLabel: off < 2 ? dayLabel + ', ' + dateShort : dayLabel, nextOp: off === 0 ? 0.3 : 1,
      prevDay: () => { clearInterval(this.timer); this.setState({ dayOff: off + 1, pos: 1000, playing: false }); },
      nextDay: () => { if (off > 0) { clearInterval(this.timer); this.setState({ dayOff: off - 1, pos: 1000, playing: false }); } },
      empty: !routes.length, hasTrips: !!routes.length, shareOp: routes.length ? 1 : 0.4,
      emptyHint: off === 0 ? 'Your route draws itself here as you move.' : 'Go back a day, or move a little today.',
      movedLabel: off === 0 ? 'Moved today' : 'Moved that day', moved: fmtMin(movedMs / 60000), totalDist: dist(totalM),
      counts: plural(routes.length, 'trip') + ' · ' + plural(pl, 'place'),
      pos, onScrub: (e) => { clearInterval(this.timer); this.setState({ pos: +e.target.value, playing: false }); },
      playIcon: s.playing ? 'pause' : 'play', playLabel: s.playing ? 'Pause' : 'Play the day',
      togglePlay,
      clock: hhmm(t),
      nowLabel: cur ? NAMES[cur.mode] + ' · ' + (M ? M.fmtSpeed(speed) : Math.round(speed * 3.6) + ' km/h') : 'Not moving',
      nowColor: cur ? COLORS[cur.mode] : 'var(--m-faint)',
      sofar: dist(so),
      startLabel: hhmm(t0), endLabel: hhmm(t1),
      chips: routes.map((r) => {
        const on = cur && cur.id === r.id;
        return { title: SHORT[r.mode] + ' · ' + dist(r.distanceM), sub: hhmm(r.start) + ' · ' + dur(Math.min(r.end, Date.now()) - r.start), tint: TINT[r.mode], ring: on ? 'inset 0 0 0 2px ' + COLORS[r.mode] : 'none',
          go: () => { clearInterval(this.timer); if (this.ctrl) this.ctrl.focus(r.id); this.setState({ playing: false, pos: Math.round((r.start - t0) / (t1 - t0) * 1000) }); } };
      }),
      share: () => {
        if (!M || !routes.length) return;
        M.storyImage('trip', { kicker: new Date(from).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }), lead: 'My day', color: COLORS[routes[0].mode],
          big: dist(totalM), routes, stats: [{ v: fmtMin(movedMs / 60000), k: 'moving' }, { v: String(routes.length), k: routes.length === 1 ? 'trip' : 'trips' }, { v: String(pl), k: pl === 1 ? 'place' : 'places' }] })
          .then((img) => M.shareImage(img, 'share', 'My day: ' + dist(totalM) + '. Tracked with Motio.'))
          .then((m) => m && this.toast(m)).catch(() => {});
      },
      hasToast: !!s.toast, toast: s.toast || ''
    };
  }
}
</script>
</body>
</html>
