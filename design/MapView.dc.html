<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Day map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#EEF0F6}
button,a{font:inherit;cursor:pointer;transition:transform 140ms cubic-bezier(0.22,1,0.36,1)}
button:active,a:active{transform:scale(0.95)}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioCardUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes motioPulse{0%{box-shadow:0 0 0 0 rgba(242,118,107,0.6)}100%{box-shadow:0 0 0 12px rgba(242,118,107,0)}}
.motio-range{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
.motio-range::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:#E3E1F3}
.motio-range::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:13px;background:#1F1D47;border:4px solid #FFFFFF;box-shadow:0 2px 8px rgba(31,29,71,0.35)}
.motio-chips::-webkit-scrollbar{display:none}
.leaflet-container{background:#EEF0F6;font-family:'Poppins',sans-serif}
.motio-tiles{filter:saturate(0.55) brightness(1.04)}
.leaflet-control-attribution{font-size:9px !important;background:rgba(255,255,255,0.7) !important}
</style>
</helmet>
<div style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #EEF0F6; color: #1F1D47; font-family: 'Poppins', system-ui, sans-serif">

  <div ref="{{ mapRef }}" style="position: absolute; inset: 0; z-index: 0"></div>
  <sc-if value="{{ noMapLib }}" hint-placeholder-val="{{ true }}">
    <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; inset: 0">
      <rect width="390" height="844" fill="#ECEEF3"></rect>
      <path d="M0 210 H390 M0 420 H390 M0 600 H390 M80 0 V844 M210 0 V844 M320 0 V844" stroke="#FFFFFF" stroke-width="14"></path>
      <path d="M-20 520 C 80 470, 140 560, 240 500 S 360 440, 420 470" fill="none" stroke="#C8D6FF" stroke-width="26"></path>
      <path d="M40 330 C 60 260, 140 250, 160 300 S 230 380, 260 300" fill="#CDEFD5"></path>
      <path d="M60 640 L80 420 L210 420 L320 210" fill="none" stroke="#3DBF5C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M210 420 L320 600 L320 700" fill="none" stroke="#F6C343" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="210" cy="420" r="9" fill="#1F1D47" stroke="#FFFFFF" stroke-width="4"></circle>
    </svg>
  </sc-if>

  <div style="position: absolute; left: 16px; right: 16px; top: 14px; z-index: 5; display: flex; align-items: center; gap: 10px">
    <a href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #FFFFFF; box-shadow: 0 4px 14px rgba(31,29,71,0.18); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D47" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex: 1; display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 6px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 4px 14px rgba(31,29,71,0.18)">
      <button type="button" onClick="{{ prevDay }}" aria-label="Previous day" style="width: 36px; height: 36px; border: 0; border-radius: 18px; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1F1D47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <span style="font-size: 14px; font-weight: 600">{{ dayLabel }}</span>
      <button type="button" onClick="{{ nextDay }}" aria-label="Next day" style="width: 36px; height: 36px; border: 0; border-radius: 18px; background: transparent; display: flex; align-items: center; justify-content: center; opacity: {{ nextOp }}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1F1D47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>
    </div>
  </div>

  <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 24px; right: 24px; top: 40%; z-index: 4; padding: 18px; border-radius: 22px; background: rgba(255,255,255,0.94); text-align: center; box-shadow: 0 8px 24px rgba(31,29,71,0.16)">
      <span style="display: block; font-size: 16px; font-weight: 700">No trips on this day</span>
      <span style="display: block; font-size: 13px; color: #4A4770; margin-top: 4px">{{ emptyHint }}</span>
    </div>
  </sc-if>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 5; padding: 16px 16px 14px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 12px 30px rgba(31,29,71,0.22); display: flex; flex-direction: column; gap: 12px; animation: motioCardUp 460ms cubic-bezier(0.22, 1, 0.36, 1) 120ms backwards">
    <div style="display: flex; align-items: center; gap: 12px">
      <button type="button" onClick="{{ togglePlay }}" aria-label="{{ playLabel }}" style="width: 52px; height: 52px; flex-shrink: 0; border: 0; border-radius: 26px; background: #1F1D47; box-shadow: none; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#F6C343"><rect x="6" y="5" width="4" height="14" rx="1.5"></rect><rect x="14" y="5" width="4" height="14" rx="1.5"></rect></svg></sc-if>
        <sc-if value="{{ paused }}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#F6C343"></path></svg></sc-if>
      </button>
      <span style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -1px; font-variant-numeric: tabular-nums">{{ clock }}</span>
        <span style="display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; font-weight: 600"><span style="width: 9px; height: 9px; border-radius: 5px; background: {{ nowColor }}; animation: {{ nowPulse }}"></span>{{ nowLabel }}</span>
      </span>
      <span style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 18px; font-weight: 700">{{ sofar }}</span><span style="font-size: 11px; color: #6B6890">so far</span></span>
    </div>
    <input class="motio-range" type="range" min="0" max="1000" step="1" value="{{ pos }}" onChange="{{ onScrub }}" aria-label="Time of day">
    <div style="display: flex; justify-content: space-between; margin-top: -6px; font-size: 10px; font-weight: 600; color: #6B6890"><span>{{ startLabel }}</span><span>{{ endLabel }}</span></div>
    <div class="motio-chips" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 0 16px; scrollbar-width: none">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
        <button type="button" onClick="{{ c.go }}" style="flex-shrink: 0; display: flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border: 2px solid {{ c.border }}; border-radius: 17px; background: {{ c.bg }}; color: #1F1D47; font-size: 12px; font-weight: 600; transition: border-color 200ms ease, background-color 200ms ease"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{ c.color }}"></span>{{ c.label }}</button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentWillUnmount() {
    clearInterval(this.timer);
    clearTimeout(this.mountT);
    if (this.ctrl) this.ctrl.destroy();
  }
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const s = this.state || {};
    const M = window.Motio;
    const off = s.dayOff || 0;
    const DAY = 86400000;
    const from = (M ? M.dayStart() : new Date().setHours(0, 0, 0, 0)) - off * DAY;
    const to = from + DAY;
    const COLORS = { walk: '#3DBF5C', run: '#F2766B', bike: '#6E8CF7', drive: '#F6C343', transit: '#B57BE0' };
    const NAMES = { walk: 'Walking', run: 'Running', bike: 'Cycling', drive: 'Driving', transit: 'Transit' };
    // On the design canvas there is no data layer: show a sample day.
    const routes = M ? M.route(from, to) : [
      { id: 'a', mode: 'walk', color: COLORS.walk, start: from + 7.67 * 3600000, end: from + 8.08 * 3600000, points: [[0, 0, from + 7.67 * 3600000], [0, 0, from + 8.08 * 3600000]], distanceM: 2000 },
      { id: 'b', mode: 'drive', color: COLORS.drive, start: from + 18.17 * 3600000, end: from + 19.07 * 3600000, points: [[0, 0, from + 18.17 * 3600000], [0, 0, from + 19.07 * 3600000]], distanceM: 31800 }
    ];
    const t0 = routes.length ? routes[0].start - 10 * 60000 : from + 6 * 3600000;
    const t1 = routes.length ? routes[routes.length - 1].end + 10 * 60000 : from + 24 * 3600000 - 60000;
    const pos = s.pos == null ? 1000 : s.pos;
    const t = t0 + (t1 - t0) * pos / 1000;
    const key = from + ':' + routes.length + ':' + (M ? M.status().version : 0);

    // Start the map engine only after the page has slid in; building it mid-slide makes the slide stutter.
    if (this.bornAt === undefined) this.bornAt = performance.now();
    const settling = !this.ctrl && performance.now() - this.bornAt < 430;
    if (settling && !this.mountT) this.mountT = setTimeout(() => { this.mountT = null; this.bornAt = 0; this.setState({ ready: true, tick: Date.now() }); }, 440 - (performance.now() - this.bornAt));
    if (this.mapEl && window.MotioMap && !settling) {
      if (!this.ctrl) { this.ctrl = window.MotioMap.mount(this.mapEl, routes); this.mapKey = key; setTimeout(() => this.ctrl && this.ctrl.invalidate(), 450); }
      else if (this.mapKey !== key) { this.ctrl.update(routes); this.mapKey = key; }
      requestAnimationFrame(() => this.ctrl && this.ctrl.setTime(t, !!s.playing));
    }

    const cur = routes.find((r) => t >= r.start && t <= r.end);
    let so = 0;
    for (const r of routes) so += r.end <= t ? r.distanceM : t > r.start ? r.distanceM * (t - r.start) / Math.max(1, r.end - r.start) : 0;
    const hhmm = (x) => { const d = new Date(x); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
    const dist = (m) => (M ? M.fmtDist(m) : (m / 1000).toFixed(1) + ' km');
    const speed = cur ? cur.distanceM / Math.max(1, (cur.end - cur.start) / 1000) : 0;

    const togglePlay = () => {
      if (s.playing) { clearInterval(this.timer); this.setState({ playing: false }); return; }
      let p = pos >= 1000 ? 0 : pos;
      this.setState({ playing: true, pos: p });
      clearInterval(this.timer);
      this.timer = setInterval(() => {
        p = Math.min(1000, p + 4);
        this.setState({ pos: p });
        if (p >= 1000) { clearInterval(this.timer); this.setState({ playing: false }); }
      }, 50);
    };
    const dayLabel = off === 0 ? 'Today' : off === 1 ? 'Yesterday' : new Date(from).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    return {
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)',
      LK: { back: lk('back', 'Main.dc.html') },
      mapRef: (el) => { const first = el && !this.mapEl; this.mapEl = el; if (first) requestAnimationFrame(() => this.setState({ ready: true })); },
      noMapLib: !window.MotioMap,
      dayLabel, nextOp: off === 0 ? 0.3 : 1,
      prevDay: () => { clearInterval(this.timer); this.setState({ dayOff: off + 1, pos: 1000, playing: false }); },
      nextDay: () => { if (off > 0) { clearInterval(this.timer); this.setState({ dayOff: off - 1, pos: 1000, playing: false }); } },
      empty: !routes.length,
      emptyHint: off === 0 ? 'Your route draws itself here as you move.' : 'Swipe back a day, or move a little today.',
      pos, onScrub: (e) => { clearInterval(this.timer); this.setState({ pos: +e.target.value, playing: false }); },
      playing: !!s.playing, paused: !s.playing, playLabel: s.playing ? 'Pause' : 'Play the day',
      togglePlay,
      clock: hhmm(t),
      nowLabel: cur ? NAMES[cur.mode] + ' · ' + (M ? M.fmtSpeed(speed) : Math.round(speed * 3.6) + ' km/h') : 'Not moving',
      nowColor: cur ? cur.color : '#C9C5EC',
      nowPulse: cur ? 'motioPulse 1.2s ease-out infinite' : 'none',
      sofar: dist(so),
      startLabel: hhmm(t0), endLabel: hhmm(t1),
      chips: routes.map((r) => {
        const on = cur && cur.id === r.id;
        return { label: hhmm(r.start) + ' · ' + NAMES[r.mode], color: r.color, bg: on ? '#F3F2FA' : '#FFFFFF', border: on ? '#1F1D47' : '#E3E1F3',
          go: () => { clearInterval(this.timer); if (this.ctrl) this.ctrl.focus(r.id); this.setState({ playing: false, pos: Math.round((r.start - t0) / (t1 - t0) * 1000) }); } };
      })
    };
  }
}
</script>
</body>
</html>
