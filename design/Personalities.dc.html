<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Movement personalities</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
button,a{font:inherit;cursor:pointer}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioCardIn{from{opacity:0;transform:translateY(18px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes motioShUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes motioShDown{from{transform:translateY(0)}to{transform:translateY(105%)}}
@keyframes motioShFade{from{opacity:0}to{opacity:1}}
@keyframes motioShFadeOut{from{opacity:1}to{opacity:0}}
.motio-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="m-page" style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 10px 20px 0">
  <div class="m-topbar"><a class="m-icon" href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back"><m-ic n="back"></m-ic></a><span class="m-tt">Types</span><span style="width: 44px"></span></div>
  <div class="motio-scroll" style="flex: 1; min-height: 0; overflow-y: auto; margin: -10px -20px 0; padding: 70px 20px 40px; display: flex; flex-direction: column; gap: 10px">
    <div class="head"><div class="t"><span class="m-sub">Your type can change every month</span><h1 class="m-title">{{ title }}</h1></div></div>
    <div class="grid2">
      <sc-for list="{{ types }}" as="t" hint-placeholder-count="6">
        <button type="button" class="m-card {{ t.cls }}" onClick="{{ t.open }}" aria-label="{{ t.aria }}" style="border: 0; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; text-align: left; color: {{ t.fg }}; animation: motioCardIn 480ms cubic-bezier(0.22, 1, 0.36, 1) {{ t.delay }} backwards">
          <span style="display: flex; justify-content: space-between; align-items: center; min-height: 12px"><span class="m-dot" style="background: {{ t.dot }}"></span><sc-if value="{{ t.yours }}" hint-placeholder-val="{{ false }}"><span style="font: 600 10px var(--m-font); letter-spacing: .4px; color: var(--m-goal)">{{ t.badge }}</span></sc-if></span>
          <span style="display: flex; justify-content: center"><m-scene name="{{ t.scene }}" size="140"></m-scene></span>
          <span><b style="font-size: 14px">{{ t.name }}</b><div class="m-sub" style="font-size: 11px; margin-top: 2px">{{ t.tag }}</div></span>
        </button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; justify-content: flex-end">
      <button aria-label="Close" onClick="{{ close }}" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(0,0,0,0.38); cursor: default; animation: {{ scrimAnim }}"></button>
      <section aria-label="{{ cur.name }}" class="m-page" style="position: relative; border-radius: 32px 32px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 10px; animation: {{ sheetAnim }}">
        <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--m-line)"></span>
        <div style="display: flex; justify-content: center"><m-scene name="{{ cur.scene }}" size="200"></m-scene></div>
        <span style="display: flex; flex-direction: column; gap: 4px"><span class="m-label">{{ cur.note }}</span><h2 class="m-h2">{{ cur.name }}</h2></span>
        <p class="m-sub" style="margin: 0; font-size: 14px">{{ cur.desc }}</p>
        <div class="m-card" style="display: flex; flex-direction: column; gap: 6px; padding: 12px">
          <span class="m-label" style="padding: 4px 6px">How to get it</span>
          <sc-for list="{{ cur.how }}" as="h" hint-placeholder-count="3"><div class="m-row" style="font-size: 14px"><span class="m-dot" style="background: {{ cur.dot }}"></span><span style="flex: 1">{{ h }}</span></div></sc-for>
        </div>
        <button type="button" class="m-btn wide" onClick="{{ close }}">Got it</button>
      </section>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const s = this.state || {};
    // Only the type your trips actually give you gets the badge; nobody gets one before there's enough data.
    const mine = window.Motio ? window.Motio.personality().key : 'wanderer';
    const monthTag = 'YOU · ' + new Date().toLocaleDateString('en-GB', { month: 'short' }).toUpperCase();
    // [key, name, tag, dot (the way of moving it's about), scene, description, how to get it]
    const TYPES = [
      ['wanderer', 'The Urban Wanderer', 'On foot, never the same way', 'var(--m-walk)', 'wanderer', 'You’d rather take the long way. Most of your moving is on foot, you range far from home and you rarely take the fastest route.', ['A third or more of your moving time on foot', 'Daily trips that are longer than the fastest route', 'At least three ways of moving in a month']],
      ['commuter', 'The Commuter', 'Same time, every weekday', 'var(--m-transit)', 'commuter', 'Same time, same route, every weekday. Your peak hours line up like clockwork around work.', ['Weekday trips that start within 20 minutes of each other', 'Most moving between 7–9 and 17–19', 'A steady weekday routine for 3+ weeks']],
      ['cyclist', 'The Cyclist', 'Two wheels, long loops', 'var(--m-bike)', 'wheeler', 'A third or more of your moving is on a bike. You know every shortcut in the city.', ['A third of your moving time on a bike', 'Rides on most weeks', 'Longer trips than walkers']],
      ['speedster', 'The Speedster', 'Fast, focused, gone', 'var(--m-run)', 'runner', 'Short trips, high speeds. You run more than most and your average pace keeps creeping up.', ['Runs on at least 8 days of the month', 'A top-third average running pace', 'Little time spent idling between trips']],
      ['explorer', 'The Explorer', 'Always somewhere new', 'var(--m-goal)', 'explorer', 'New streets, new trails, new places. A big share of your trips go somewhere you’ve never been.', ['A quarter of trips to places you haven’t visited', 'Moves spread across lots of neighbourhoods', 'Weekend walks or rides over 10 km']],
      ['roadtripper', 'The Road Tripper', 'Far, by car', 'var(--m-drive)', 'tripper', 'You cover serious ground. Driving is your main way to move, and your weekends go far.', ['Half or more of your distance by car', 'At least one trip over 100 km', 'Weekend distance higher than weekdays']],
      ['earlybird', 'The Early Bird', 'Out before the city wakes', 'var(--m-run)', 'runner', 'Most of your moving happens before 9 in the morning, while the streets are still quiet.', ['Four in ten moving minutes before 9:00', 'Early starts most weekdays', 'Quiet evenings']],
      ['nightowl', 'The Night Owl', 'Moves after dark', 'var(--m-ink)', 'explorer', 'The city is yours after 20:00. Your busiest hours come long after most people are home.', ['A third of your moving after 20:00', 'Late runs or walks at least once a week', 'Quiet mornings before 10:00']],
      ['metrohopper', 'The Metro Hopper', 'Bus, metro, repeat', 'var(--m-transit)', 'commuter', 'Buses and trains carry most of your days. You know the lines and the stops by heart.', ['Four in ten moving minutes on buses or trains', 'Short walks to and from stops', 'Regular routes']],
      ['weekender', 'The Weekend Warrior', 'Quiet weeks, big Saturdays', 'var(--m-goal)', 'explorer', 'Quiet weekdays, big weekends. Most of your moving happens on Saturday and Sunday.', ['More than half your moving at weekends', 'Longest trips on Saturdays', 'Calm weekdays']],
      ['steady', 'The Steady One', 'Every single day', 'var(--m-walk)', 'wanderer', 'You move almost every day of the month. Not always the most, but never none.', ['Active on 25 or more days a month', 'No long gaps', 'A bit every day']]
    ];
    // Your type comes first and is the page's one dark card.
    const order = TYPES.slice().sort((a, b) => (b[0] === mine) - (a[0] === mine));
    const pick = s.open || null;
    const cur = TYPES.find((t) => t[0] === pick) || TYPES[0];
    const close = () => {
      if (s.closing) return;
      this.setState({ closing: true });
      setTimeout(() => this.setState({ open: null, closing: false }), 420);
    };
    const words = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
    return {
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)',
      LK: { back: lk('back', 'Personality.dc.html') },
      title: (words[TYPES.length] || TYPES.length) + ' types.',
      types: order.map(([key, name, tag, dot, scene], i) => ({
        name, tag, dot, scene, delay: (emb ? 300 : 0) + i * 60 + 'ms', yours: key === mine, badge: monthTag,
        cls: key === mine ? 'dark' : '', fg: key === mine ? 'var(--m-on-dark)' : 'var(--m-ink)', aria: name + (key === mine ? ', your type' : ''),
        open: () => this.setState({ open: key, closing: false })
      })),
      sheetOpen: !!pick,
      cur: { name: cur[1], dot: cur[3], scene: cur[4], note: cur[0] === mine ? 'Your type right now' : mine ? 'Not your type right now' : 'Your type shows after 3h of moving', desc: cur[5], how: cur[6] },
      close,
      sheetAnim: s.closing ? 'motioShDown 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards' : 'motioShUp 420ms cubic-bezier(0.22, 1, 0.36, 1)',
      scrimAnim: s.closing ? 'motioShFadeOut 320ms ease-in forwards' : 'motioShFade 320ms ease-out'
    };
  }
}
</script>
</body>
</html>
