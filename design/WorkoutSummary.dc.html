<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Workout summary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
button,a{font:inherit;cursor:pointer}
@property --n{syntax:'<integer>';inherits:false;initial-value:0}
@keyframes motioWsCount{from{--n:0}}
.motio-ws-count{counter-reset:n var(--n);animation:motioWsCount 1400ms cubic-bezier(0.22,1,0.36,1) var(--d,0ms) backwards}
.motio-ws-count::after{content:counter(n)}
.motio-ws-cc::after{content:counter(n, decimal-leading-zero)}
@keyframes motioStoryIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes motioSoftIn{from{opacity:0}to{opacity:1}}
@keyframes motioWsIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes motioWsRays{to{transform:rotate(360deg)}}
@keyframes motioWsBadge{0%{opacity:0;transform:scale(0.3) rotate(-20deg)}70%{opacity:1;transform:scale(1.1) rotate(4deg)}100%{transform:none}}
@keyframes motioWsLine{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes motioWsArea{from{opacity:0}to{opacity:1}}
@keyframes motioWsSplit{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes motioToast{0%{opacity:0;transform:translate(-50%,12px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
.motio-scroll::-webkit-scrollbar{display:none}
.ws-when{transition:opacity .3s var(--m-ease)}
.m-scrolled .ws-when{opacity:0}
.ws-bar{transition:transform .55s var(--m-spring),opacity .3s ease}
.ws-bar.hide{transform:translateY(110px) scale(.96);opacity:0;pointer-events:none;transition:transform .42s var(--m-ease),opacity .25s ease}
.leaflet-control-attribution{font-size:8px!important;background:transparent!important;color:#999!important}
.leaflet-control-attribution a{color:#999!important}
</style>
</helmet>
<div class="m-page" style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden">
  <div class="m-topbar">
    <a class="m-icon" href="{{ LK.done.href }}" onClick="{{ LK.done.go }}" aria-label="Close"><m-ic n="x"></m-ic></a>
    <span style="flex: 1; position: relative; display: flex; justify-content: center; align-items: center; min-height: 44px"><span class="m-sub ws-when">{{ when }}</span><span class="m-tt" style="position: absolute; left: 0; right: 0">{{ titleSmall }}</span></span>
    <span style="width: 44px"></span>
  </div>
  <div class="motio-scroll" onScroll="{{ onScroll }}" style="position: absolute; inset: 0; overflow-y: auto; padding: 70px 20px 110px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
    <div class="m-in" style="--i: 0">
      <sc-if value="{{ hasBest }}" hint-placeholder-val="{{ true }}"><span class="m-chip tg m-pop" style="height: 28px; font-size: 12px; margin-bottom: 10px; cursor: default; --i: 6">{{ best }}</span></sc-if>
      <h1 class="m-title">{{ title }}</h1>
      <p class="m-sub" style="font-size: 15px; margin: 10px 0 0; color: var(--m-ink-2)">{{ verb }} <b style="color: var(--m-ink)">{{ dist }}</b>{{ where }}.</p>
    </div>
    <div class="mapbox m-in" style="--i: 1; height: 170px; flex-shrink: 0; position: relative; background: var(--m-card)"><div ref="{{ mapRef }}" style="position: absolute; inset: 0"></div></div>
    <div class="grid3 m-in" style="--i: 2">
      <sc-for list="{{ stats }}" as="st" hint-placeholder-count="3"><div class="m-card" style="padding: 14px"><div class="m-label">{{ st.k }}</div><div class="m-num s" style="margin-top: 6px">{{ st.v }}</div></div></sc-for>
    </div>
    <sc-if value="{{ hasCurve }}" hint-placeholder-val="{{ true }}">
      <div class="m-card m-in" style="--i: 3; display: flex; flex-direction: column; gap: 10px; padding: 16px">
        <div style="display: flex; justify-content: space-between"><span class="m-label">{{ curveTitle }}</span><span class="m-sub" style="font-size: 12px">{{ curveNote }}</span></div>
        <svg role="img" aria-label="{{ curveAria }}" width="100%" height="110" viewBox="0 0 310 110" preserveAspectRatio="none">
          <path d="{{ area }}" fill="var(--m-ink)" fill-opacity="0.06"></path>
          <path d="{{ line }}" fill="none" stroke="var(--m-ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" stroke-dasharray="1000" style="animation: motioWsLine 1400ms cubic-bezier(0.22, 1, 0.36, 1) {{ d1 }} backwards"></path>
          <circle cx="{{ peakX }}" cy="{{ peakY }}" r="5" fill="var(--m-card)" stroke="{{ color }}" stroke-width="3" vector-effect="non-scaling-stroke"></circle>
        </svg>
      </div>
    </sc-if>
    <sc-if value="{{ hasSplits }}" hint-placeholder-val="{{ true }}">
      <div class="m-card m-in" style="--i: 4; display: flex; flex-direction: column; gap: 8px; padding: 16px">
        <div style="display: flex; justify-content: space-between"><span class="m-label">Splits</span><span class="m-sub" style="font-size: 12px">{{ splitUnit }}</span></div>
        <sc-for list="{{ splits }}" as="p" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 10px; font-size: 13px"><b style="width: 18px">{{ p.n }}</b><span style="flex: 1; height: 8px; border-radius: 4px; background: var(--m-soft)"><i style="display: block; width: {{ p.w }}; height: 100%; border-radius: 4px; background: {{ p.c }}; transform-origin: left; animation: motioWsSplit 700ms cubic-bezier(0.22, 1, 0.36, 1) {{ p.d }} backwards"></i></span><b style="width: 40px; text-align: right">{{ p.t }}</b></div>
        </sc-for>
      </div>
    </sc-if>
  </div>
  <div class="grid2 ws-bar {{ barCls }}" style="position: absolute; left: 20px; right: 20px; bottom: 28px; z-index: 6">
    <button type="button" class="m-btn w" onClick="{{ share }}" style="box-shadow: 0 6px 20px rgba(0,0,0,.08)"><m-ic n="share" s="17"></m-ic>Share</button>
    <a href="{{ LK.done.href }}" onClick="{{ LK.done.go }}" class="m-btn" style="text-decoration: none">Done</a>
  </div>
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 50%; bottom: 96px; z-index: 50; padding: 12px 18px; border-radius: 18px; background: var(--m-ink); color: var(--m-bg-hi); font-size: 13px; font-weight: 500; white-space: nowrap; animation: motioToast 2300ms ease forwards">{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  showToast(msg) {
    clearTimeout(this.toastT);
    this.setState({ toast: null });
    setTimeout(() => this.setState({ toast: msg }), 30);
    this.toastT = setTimeout(() => this.setState({ toast: null }), 2330);
  }
  componentWillUnmount() { clearTimeout(this.toastT); clearTimeout(this.mapT); if (this.ctrl) this.ctrl.destroy(); }
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const M = window.Motio;
    if (this.tid === undefined) { this.tid = window.__motioTrip || null; window.__motioTrip = null; }
    const now = Date.now();
    const sample = { trip: { id: 's', mode: 'run', start: now - 2400000, end: now - 286000, distanceM: 6420, steps: 6900, maxSpeed: 4.1 }, ms: 2114000, km: 6.42, paceS: 329, speed: 10.9, kcal: 412, best: 'Fastest run yet',
      splits: [352, 341, 338, 330, 312, 347], series: [2.6, 2.8, 3.0, 2.9, 3.1, 3.0, 3.2, 3.3, 3.5, 3.4, 3.0, 2.8] };
    const W = (M && this.tid && M.workoutSummary(this.tid)) || sample;
    const t = W.trip;
    const COLORS = { walk: '#2FB457', run: '#E5604F', bike: '#4F7BF0', drive: '#E7A82A', transit: '#8E6BE0' };
    const VERB = { walk: 'You walked', run: 'You ran', bike: 'You rode', drive: 'You drove', transit: 'You travelled' };
    const NAME = { walk: 'walk', run: 'run', bike: 'ride', drive: 'drive', transit: 'trip' };
    const mi = M && M.settings().unit === 'mi';
    const dist = mi ? W.km / 1.609 : W.km;
    const clock = (ms) => { const s = Math.round(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return h ? h + ':' + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0') : m + ':' + String(x).padStart(2, '0'); };
    const pace = (sec) => (sec == null || !isFinite(sec) ? '—' : Math.floor(sec / 60) + ':' + String(Math.round(sec % 60) % 60).padStart(2, '0'));
    const hr = new Date(t.start).getHours();
    const part = hr < 12 ? 'Morning' : hr < 17 ? 'Afternoon' : hr < 21 ? 'Evening' : 'Night';
    const foot = t.mode === 'walk' || t.mode === 'run';
    const base = emb ? 420 : 0;
    // Pace or speed curve, fitted into 310×110.
    const S = W.series || [];
    let line = '', area = '', peakX = 0, peakY = 0;
    if (S.length > 2) {
      const mx = Math.max(...S), mn = Math.min(...S), n = S.length - 1;
      const P = S.map((v, i) => [i / n * 310, 96 - (v - mn) / Math.max(0.01, mx - mn) * 80]);
      line = 'M' + P.map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
      area = line + ' L310 110 L0 110 Z';
      const pk = S.indexOf(mx); [peakX, peakY] = P[pk].map((v) => v.toFixed(1));
    }
    const sp = W.splits || [];
    const fast = Math.min(...sp), slow = Math.max(...sp);
    const st = this.state || {};
    // The route, drawn after the page has slid in.
    if (M && window.MotioMap && this.mapEl && !this.ctrl && !this.mapT && t.points && t.points.length > 1) this.mapT = setTimeout(() => { if (this.mapEl) this.ctrl = window.MotioMap.mount(this.mapEl, [{ id: t.id, mode: t.mode, color: COLORS[t.mode], start: t.start, end: t.end, points: t.points }]); }, 440);
    // Where it happened, when Motio knows the place: "along Seaside Boulevard".
    const near = (p) => { if (!M || !p) return null; const k = Math.cos((p[0] * Math.PI) / 180); return M.places().find((x) => Math.hypot((x.lat - p[0]) * 111320, (x.lng - p[1]) * 111320 * k) < 300) || null; };
    const pts = t.points || [], place = pts.length ? near(pts[Math.floor(pts.length / 2)]) || near(pts[pts.length - 1]) : null;
    const where = !M ? ' along the Boulevard' : place && place.kind === 'place' && !/^Place \d+$/.test(place.name) ? ' around ' + place.name : '';
    return {
      rootAnim: emb ? 'motioStoryIn 460ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms ease',
      LK: { done: lk('home', 'Main.dc.html') },
      mapRef: (el) => { const first = el && !this.mapEl; this.mapEl = el; if (first && M) requestAnimationFrame(() => this.setState({ mapReady: true })); },
      color: COLORS[t.mode] || '#E5604F', title: part.toLowerCase() + ' ' + NAME[t.mode] + '.', titleSmall: part + ' ' + NAME[t.mode],
      when: new Date(t.start).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ' + new Date(t.start).getHours() + ':' + String(new Date(t.start).getMinutes()).padStart(2, '0'),
      hasBest: !!W.best, best: W.best || '', verb: VERB[t.mode] || 'You moved', dist: dist.toFixed(dist < 10 ? 2 : 1) + (mi ? ' mi' : ' km'), where,
      d1: base + 250 + 'ms',
      stats: [
        { v: clock(W.ms), k: 'Time' },
        foot ? { v: pace(W.paceS == null ? null : W.paceS * (mi ? 1.609 : 1)), k: 'Pace' } : { v: W.speed == null ? '—' : (W.speed / (mi ? 1.609 : 1)).toFixed(1), k: mi ? 'Avg mph' : 'Avg km/h' },
        { v: String(Math.max(0, Math.round(W.kcal))), k: 'Calories' }
      ],
      hasCurve: S.length > 2, curveTitle: foot ? 'Pace' : 'Speed', line, area, peakX, peakY,
      curveNote: 'fastest stretch marked', curveAria: (foot ? 'Pace' : 'Speed') + ' over the workout, fastest stretch marked',
      hasSplits: sp.length > 0, splitUnit: mi ? 'min / mi' : 'min / km',
      splits: sp.map((sec, i) => ({ n: String(i + 1), t: pace(sec), w: Math.round(40 + (slow - sec) / Math.max(1, slow - fast) * 60) + '%', c: sec === fast ? COLORS[t.mode] : 'var(--m-ink)', d: base + 420 + i * 70 + 'ms' })),
      // Share and Done tuck away while you scroll down and come back on the way up.
      barCls: st.barHidden ? 'hide' : '',
      onScroll: (e) => { const y = e.target.scrollTop, d = y - (this.lastY || 0), end = y + e.target.clientHeight >= e.target.scrollHeight - 4;
        if (y <= 24 || d < -16 || end) { this.lastY = y; if (st.barHidden) this.setState({ barHidden: false }); }
        else if (d > 36) { this.lastY = y; if (!st.barHidden) this.setState({ barHidden: true }); } },
      share: () => {
        if (!M || !t.id || t.id === 's') { this.showToast('Shared'); return; }
        const routes = M.route(t.start - 1, t.end + 1).filter((r) => r.id === t.id);
        M.storyImage('trip', { kicker: new Date(t.start).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }), lead: part + ' ' + NAME[t.mode], color: COLORS[t.mode],
          big: M.fmtDist(t.distanceM), routes, stats: [{ v: clock(W.ms), k: 'time' }, foot ? { v: pace(W.paceS), k: 'pace /km' } : { v: W.speed == null ? '—' : W.speed.toFixed(1), k: 'km/h' }, { v: String(Math.round(W.kcal)), k: 'kcal' }] })
          .then((img) => M.shareImage(img, 'share', part + ' ' + NAME[t.mode] + ': ' + M.fmtDist(t.distanceM) + '. Tracked with Motio.'))
          .then((m) => m && this.showToast(m)).catch(() => {});
      },
      hasToast: !!(this.state && this.state.toast), toast: (this.state && this.state.toast) || ''
    };
  }
}
</script>
</body>
</html>
