<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Something went wrong</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#F2766B}
a{color:inherit}
button{font:inherit;cursor:pointer}
button,a{transition:transform 140ms cubic-bezier(0.22,1,0.36,1),background-color 200ms ease}
button:active,a:active{transform:scale(0.96)}
@keyframes motioRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes motioSpin{to{transform:rotate(360deg)}}
@keyframes motioSlowSpin{to{transform:rotate(360deg)}}
@keyframes motioStall{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-12deg)}90%{transform:rotate(6deg)}}
@keyframes motioSmoke{0%{transform:translateY(0) scale(0.6);opacity:0}30%{opacity:0.8}100%{transform:translateY(-34px) scale(1.2);opacity:0}}
@keyframes motioPop{0%{transform:scale(0.5);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes motioToast{0%{opacity:0;transform:translate(-50%,16px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F2766B; color: #1F1D47; font-family: 'Poppins', system-ui, sans-serif; padding: 60px 28px 40px; display: flex; flex-direction: column; align-items: center; text-align: center">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0; pointer-events: none"><circle cx="40" cy="90" r="130" fill="#F58C83"></circle></svg>

  <svg aria-hidden="true" width="260" height="230" viewBox="0 0 260 230" style="position: relative; margin-top: 24px; animation: motioRise 520ms cubic-bezier(0.22, 1, 0.36, 1) backwards">
    <ellipse cx="130" cy="214" rx="90" ry="8" fill="#D9534A"></ellipse>
    <g transform="translate(70 70)"><g style="transform-origin: 50px 50px; animation: {{ gearA }}">
      <path d="M44 0 h12 l3 14 10 4 12 -8 9 9 -8 12 4 10 14 3 v12 l-14 3 -4 10 8 12 -9 9 -12 -8 -10 4 -3 14 h-12 l-3 -14 -10 -4 -12 8 -9 -9 8 -12 -4 -10 -14 -3 v-12 l14 -3 4 -10 -8 -12 9 -9 12 8 10 -4z" fill="#1F1D47"></path>
      <circle cx="50" cy="50" r="18" fill="#F2766B"></circle>
    </g></g>
    <g transform="translate(160 40)"><g style="transform-origin: 30px 30px; animation: {{ gearB }}">
      <path d="M26 0 h8 l2 9 6 3 8 -5 6 6 -5 8 3 6 9 2 v8 l-9 2 -3 6 5 8 -6 6 -8 -5 -6 3 -2 9 h-8 l-2 -9 -6 -3 -8 5 -6 -6 5 -8 -3 -6 -9 -2 v-8 l9 -2 3 -6 -5 -8 6 -6 8 5 6 -3z" fill="#F6C343"></path>
      <circle cx="30" cy="30" r="10" fill="#F2766B"></circle>
    </g></g>
    <g style="opacity: {{ smokeOp }}; transition: opacity 400ms ease">
      <circle cx="120" cy="60" r="10" fill="#FFFFFF" style="animation: none"></circle>
      <circle cx="136" cy="56" r="8" fill="#FFFFFF" style="animation: none"></circle>
      <circle cx="110" cy="52" r="7" fill="#FFFFFF" style="animation: none"></circle>
    </g>
  </svg>

  <sc-if value="{{ broken }}" hint-placeholder-val="{{ true }}">
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; animation: motioRise 520ms cubic-bezier(0.22, 1, 0.36, 1) 120ms backwards">
      <h1 style="margin: 8px 0 0; font-size: 30px; font-weight: 700; line-height: 1.15">Something went wrong<br>on our side</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; max-width: 300px">Our servers tripped over their own feet. Nothing you did; your data is safe.</p>
      <span style="margin-top: 4px; padding: 6px 12px; border-radius: 12px; background: rgba(255,255,255,0.55); font-family: 'Space Mono', monospace; font-size: 12px">Error 503 · ref MX-4F2A</span>
    </div>
  </sc-if>
  <sc-if value="{{ fixed }}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px">
      <span style="width: 60px; height: 60px; border-radius: 30px; background: #3DBF5C; margin-top: 8px; display: flex; align-items: center; justify-content: center; animation: motioPop 520ms cubic-bezier(0.34, 1.56, 0.64, 1)"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
      <h1 style="margin: 0; font-size: 30px; font-weight: 700">All fixed</h1>
      <p style="margin: 0; font-size: 15px">Everything’s running smoothly again.</p>
    </div>
  </sc-if>

  <div style="position: relative; margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{ broken }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ retry }}" style="width: 100%; min-height: 56px; border-radius: 28px; border: 0; background: #1F1D47; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: none">
        <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}"><span style="width: 18px; height: 18px; border-radius: 9px; border: 2.5px solid rgba(255,255,255,0.35); border-top-color: #FFFFFF; animation: motioSpin 700ms linear infinite"></span></sc-if>
        {{ retryLabel }}
      </button>
      <button onClick="{{ status }}" style="width: 100%; min-height: 52px; border-radius: 26px; border: 0; background: rgba(255,255,255,0.55); color: #1F1D47; font-size: 15px; font-weight: 600">Check service status</button>
    </sc-if>
    <sc-if value="{{ fixed }}" hint-placeholder-val="{{ false }}">
      <a href="{{ LK.home.href }}" onClick="{{ LK.home.go }}" style="width: 100%; min-height: 56px; border-radius: 28px; background: #1F1D47; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Continue to Today</a>
    </sc-if>
  </div>

  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 50%; bottom: 170px; z-index: 50; padding: 12px 18px; border-radius: 22px; background: #1F1D47; color: #FFFFFF; font-size: 13px; font-weight: 600; white-space: nowrap; animation: motioToast 2300ms ease forwards">{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const s = this.state || {};
    const fixed = !!s.fixed;
    return {
      LK: { home: lk('home', 'Main.dc.html') },
      broken: !fixed, fixed, busy: !!s.busy,
      // Jammed gears stall and smoke; once fixed they spin freely.
      gearA: fixed ? 'motioSlowSpin 6s linear infinite' : 'motioStall 2.2s ease-in-out infinite',
      gearB: fixed ? 'motioSlowSpin 4s linear infinite reverse' : 'motioStall 2.2s ease-in-out 0.3s infinite',
      smokeOp: fixed ? 0 : 1,
      retryLabel: s.busy ? 'Trying again…' : 'Try again',
      retry: () => {
        if (s.busy) return;
        this.setState({ busy: true });
        setTimeout(() => this.setState({ busy: false, fixed: true }), 1400);
      },
      status: () => { this.setState({ toast: null }); setTimeout(() => this.setState({ toast: 'Status: we’re on it, fix in a few minutes' }), 30); },
      hasToast: !!s.toast, toast: s.toast || ''
    };
  }
}
</script>
</body>
</html>
