<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Update</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#F6F5FC}
button,a{font:inherit;cursor:pointer}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioUpIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes motioUpPop{0%{opacity:0;transform:scale(0.7)}70%{opacity:1;transform:scale(1.06)}100%{transform:none}}
@keyframes motioUpFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.motio-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F5FC; color: #1F1D47; font-family: 'Poppins', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex-shrink: 0; padding: 16px 20px 8px; display: flex; align-items: center; gap: 12px">
    <a href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D47" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 24px; font-weight: 700">Update</h1>
  </div>

  <div class="motio-scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 14px">
    <section style="position: relative; overflow: hidden; padding: 24px 20px 20px; border-radius: 28px; background: linear-gradient(135deg, #5B4FE0 0%, #8C7CF0 55%, #F2766B 100%); color: #FFFFFF; animation: motioUpIn 520ms cubic-bezier(0.22, 1, 0.36, 1) {{ d0 }} backwards">
      <svg aria-hidden="true" width="350" height="190" viewBox="0 0 350 190" style="position: absolute; right: -20px; top: 0"><path d="M-10 160 C 70 100, 140 190, 230 120 S 330 50, 380 80" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="24" stroke-linecap="round"></path><circle cx="300" cy="30" r="64" fill="#FFFFFF" fill-opacity="0.08"></circle></svg>
      <span aria-hidden="true" style="position: relative; width: 64px; height: 64px; border-radius: 22px; background: #F6C343; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 22px rgba(20,14,70,0.25); animation: motioUpPop 640ms cubic-bezier(0.22, 1, 0.36, 1) {{ d1 }} backwards, motioUpFloat 3s ease-in-out 1.2s infinite"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1F1D47" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></span>
      <div style="position: relative; margin-top: 16px; font-size: 13px; font-weight: 600; opacity: 0.85">{{ kicker }}</div>
      <div style="position: relative; font-size: 34px; font-weight: 700; line-height: 1.1">{{ headline }}</div>
      <div style="position: relative; margin-top: 6px; font-size: 13px; opacity: 0.85">{{ subline }}</div>
    </section>

    <sc-if value="{{ has }}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 14px 6px; border-radius: 22px; background: #FFFFFF; animation: motioUpIn 520ms cubic-bezier(0.22, 1, 0.36, 1) {{ d1 }} backwards">
        <sc-for list="{{ facts }}" as="f" hint-placeholder-count="3"><span style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center"><span style="font-size: 17px; font-weight: 700">{{ f.v }}</span><span style="font-size: 11px; color: #6B6890">{{ f.k }}</span></span></sc-for>
      </div>

      <sc-if value="{{ showProgress }}" hint-placeholder-val="{{ false }}">
        <section aria-label="Download progress" style="padding: 18px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px">
          <span style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 700">{{ progressTitle }}</span><span style="font-size: 13px; font-weight: 700; color: #5B4FE0">{{ pctLabel }}</span></span>
          <span role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ pct }}" style="height: 12px; border-radius: 6px; background: #EEF0F6; overflow: hidden"><span style="display: block; height: 12px; width: {{ pctW }}; border-radius: 6px; background: linear-gradient(90deg, #5B4FE0, #F2766B); transition: width 300ms ease"></span></span>
          <span style="font-size: 12px; color: #6B6890">{{ progressLine }}</span>
        </section>
      </sc-if>

      <section style="padding: 18px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px; animation: motioUpIn 520ms cubic-bezier(0.22, 1, 0.36, 1) {{ d2 }} backwards">
        <span style="font-size: 15px; font-weight: 700">What’s new</span>
        <sc-for list="{{ notes }}" as="n" hint-placeholder-count="3">
          <span style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: #4A4770"><span aria-hidden="true" style="width: 8px; height: 8px; margin-top: 7px; flex-shrink: 0; border-radius: 4px; background: {{ n.c }}"></span><span>{{ n.t }}</span></span>
        </sc-for>
      </section>
      <span style="font-size: 12px; line-height: 1.5; color: #6B6890; text-align: center">Your trips, friends and settings stay as they are.</span>
    </sc-if>
  </div>

  <sc-if value="{{ has }}" hint-placeholder-val="{{ true }}">
    <div style="flex-shrink: 0; padding: 12px 20px 24px; display: flex; gap: 10px; background: #F6F5FC">
      <sc-if value="{{ canCancel }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ cancel }}" style="flex: 1; height: 56px; border: 2px solid #E3E1F3; border-radius: 28px; background: #FFFFFF; color: #1F1D47; font-size: 15px; font-weight: 600">Cancel</button></sc-if>
      <button type="button" onClick="{{ primary }}" disabled="{{ primaryOff }}" style="flex: 2; height: 56px; border: 0; border-radius: 28px; background: {{ primaryBg }}; color: {{ primaryFg }}; font-size: 15px; font-weight: 700; transition: background-color 200ms ease">{{ primaryLabel }}</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // src/main.js keeps the update and its download state in window.__motioUpdate.
  componentDidMount() { this.onUpd = () => this.setState({}); window.addEventListener('motio:update', this.onUpd); }
  componentWillUnmount() { window.removeEventListener('motio:update', this.onUpd); }
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const sample = { name: '3.6', current: '3.5', total: 6400000, got: 2700000, pct: 42, state: 'downloading', date: new Date().toISOString(), notes: '- Faster tabs while tracking\n- Pause and resume updates\n- Friend profiles redesign' };
    const u = window.__motioUpdate || (window.Motio ? null : sample);
    const base = emb ? 380 : 0;
    const mb = (b) => (b / 1048576).toFixed(1) + ' MB';
    const common = { rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms ease', LK: { back: lk('back', 'Settings.dc.html') },
      d0: base + 'ms', d1: base + 120 + 'ms', d2: base + 220 + 'ms' };
    if (!u) return { ...common, has: false, kicker: 'Motio', headline: 'You’re up to date', subline: 'We’ll tell you when a new version is ready.', facts: [], notes: [] };
    const st = u.state, pct = Math.max(0, Math.min(100, u.pct || 0));
    const COLORS = ['#F6C343', '#3DBF5C', '#6E8CF7', '#F2766B', '#B57BE0'];
    const lines = String(u.notes || '').split('\n').map((l) => l.replace(/^\s*(?:[-*•]|\d+\.)\s*/, '').replace(/[#*_`]/g, '').trim()).filter((l) => l && !/^motio \d/i.test(l));
    const go = (a) => () => window.__motioUpdateDo && window.__motioUpdateDo(a);
    const P = {
      ready: ['Download and install', 'download'], failed: ['Try again', 'download'], downloading: ['Pause', 'pause'], paused: ['Resume', 'download'],
      downloaded: ['Install', 'install'], permission: ['Allow and install', 'install'], installing: ['Installing…', null]
    }[st] || ['Download and install', 'download'];
    const busy = st === 'downloading';
    return {
      ...common, has: true,
      kicker: 'New version', headline: 'Motio ' + u.name,
      subline: st === 'installing' ? 'Follow the steps on screen to finish.' : st === 'permission' ? 'Allow installs from Motio in the screen that opened, then come back.' : 'A smoother, sharper Motio is ready for you.',
      facts: [
        { v: (u.current || '–') + ' → ' + u.name, k: 'version' },
        { v: u.total ? mb(u.total) : '–', k: 'download' },
        { v: u.date ? new Date(u.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '–', k: 'released' }
      ],
      showProgress: busy || st === 'paused' || st === 'failed' || ((st === 'downloaded' || st === 'permission') && pct > 0),
      progressTitle: busy ? 'Downloading' : st === 'paused' ? 'Paused' : st === 'failed' ? 'Download stopped' : 'Downloaded',
      pct, pctW: Math.max(2, pct) + '%', pctLabel: pct + '%',
      progressLine: st === 'failed' ? 'Check your connection: Try again picks up where it stopped.' : (u.got ? mb(u.got) : '0 MB') + ' of ' + (u.total ? mb(u.total) : '…') + (busy ? ' · keep Motio open' : ''),
      notes: (lines.length ? lines : ['Fixes and improvements']).slice(0, 12).map((t, i) => ({ t, c: COLORS[i % COLORS.length] })),
      primaryLabel: P[0], primaryOff: !P[1], primary: P[1] ? go(P[1]) : () => {},
      primaryBg: busy ? '#FFFFFF' : !P[1] ? '#C9C5EC' : '#1F1D47', primaryFg: busy ? '#1F1D47' : '#FFFFFF',
      canCancel: busy || st === 'paused' || st === 'failed', cancel: go('cancel')
    };
  }
}
</script>
</body>
</html>
