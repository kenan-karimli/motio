<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Timeline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
button,a{font:inherit;cursor:pointer}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioDayNextA{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes motioDayNextB{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes motioDayPrevA{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes motioDayPrevB{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
.tl-step{width:32px;height:32px;border:0;border-radius:16px;background:transparent;color:var(--m-ink);display:inline-flex;align-items:center;justify-content:center;padding:0}
.tl-step:disabled{cursor:default}
.motio-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="m-page" style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div class="m-topbar">
    <a class="m-icon" href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back"><m-ic n="back"></m-ic></a>
    <span style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 2px">
      <button type="button" class="tl-step" onClick="{{ prevDay }}" aria-label="Previous day"><m-ic n="back" s="15"></m-ic></button>
      <span class="m-h3" style="min-width: 120px; text-align: center">{{ dayLabel }}</span>
      <button type="button" class="tl-step" onClick="{{ nextDay }}" aria-label="Next day" disabled="{{ atToday }}" style="opacity: {{ nextOp }}"><m-ic n="chev" s="15"></m-ic></button>
    </span>
    <button type="button" class="m-icon" onClick="{{ openMap }}" aria-label="Map of this day"><m-ic n="map"></m-ic></button>
  </div>
  <div class="motio-scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 108px 20px 40px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 10px; animation: {{ dayAnim }}">
      <div class="m-in" style="--i: 0; display: flex; gap: 6px; align-items: center">
        <sc-for list="{{ mix }}" as="x" hint-placeholder-count="2"><span class="m-chip {{ x.tint }}" style="height: 30px; padding: 0 12px; font-size: 12px; cursor: default"><span class="m-dot" style="background: {{ x.color }}; width: 8px; height: 8px"></span>{{ x.v }}</span></sc-for>
        <span class="sp"></span><span class="m-sub" style="align-self: center">{{ daySummary }}</span>
      </div>
      <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
        <div class="m-card m-in" style="--i: 1; padding: 22px 20px; display: flex; flex-direction: column; gap: 6px"><b style="font-size: 16px">No trips on this day.</b><span class="m-sub">{{ emptyHint }}</span></div>
      </sc-if>
      <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
        <div class="m-card m-in" style="--i: 1; padding: 10px 16px">
          <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
            <div class="rl">
              <span class="rl-t" style="color: {{ it.tc }}">{{ it.time }}</span>
              <span class="rl-l {{ it.railCls }}"><i style="background: {{ it.top }}"></i><i style="background: {{ it.dot }}"></i><i style="background: {{ it.bottom }}"></i></span>
              <sc-if value="{{ it.isStay }}" hint-placeholder-val="{{ true }}">
                <span class="rl-b"><b>{{ it.title }}</b><div class="m-sub">{{ it.sub }}</div></span>
              </sc-if>
              <sc-if value="{{ it.isTrip }}" hint-placeholder-val="{{ false }}">
                <span class="rl-b" style="padding-bottom: 10px"><button type="button" class="m-row {{ it.tint }}" onClick="{{ it.open }}" aria-label="{{ it.aria }}" style="width: 100%; min-height: 0; padding: 10px 12px; border: 0; flex-direction: column; align-items: flex-start; gap: 2px; color: var(--m-ink); text-align: left"><b>{{ it.title }}</b><span class="m-sub" style="color: var(--m-ink-2)">{{ it.sub }}</span></button></span>
              </sc-if>
            </div>
          </sc-for>
        </div>
        <span class="m-sub m-in" style="--i: 2; text-align: center">Tap a trip to open it, change its mode or fix it</span>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const s = this.state || {};
    // Day handed over by the page that opened this one (days back from today), e.g. the map or On this day.
    if (this.back0 === undefined) { this.back0 = window.__motioDay || 0; window.__motioDay = null; }
    const back = s.back ?? this.back0;
    const M = window.Motio;
    const DAY = 86400000;
    const today = M ? M.dayStart() : new Date().setHours(0, 0, 0, 0);
    const day = today - back * DAY;
    const MODES = { walk: ['Walk', 'var(--m-walk)', 'tw'], run: ['Run', 'var(--m-run)', 'tr'], bike: ['Ride', 'var(--m-bike)', 'tb'], drive: ['Drive', 'var(--m-drive)', 'td'], transit: ['Bus & metro', 'var(--m-transit)', 'tt'] };
    const hm = (t) => { const d = new Date(t); return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
    const dur = (ms) => { const m = Math.max(1, Math.round(ms / 60000)); return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + ' min'; };
    const now = Date.now();
    const raw = M ? M.timeline(day) : [
      { kind: 'stay', start: null, end: day + 7.8 * 3600000, name: 'Home', placeKind: 'home' },
      { kind: 'trip', id: 'a', mode: 'walk', start: day + 7.8 * 3600000, end: day + 8.13 * 3600000, distanceM: 1600, steps: 2140 },
      { kind: 'stay', start: day + 8.13 * 3600000, end: day + 8.33 * 3600000, name: 'Port Baku Mall', placeKind: 'place' },
      { kind: 'trip', id: 'b', mode: 'bike', start: day + 8.33 * 3600000, end: day + 8.95 * 3600000, distanceM: 9100, steps: 0 },
      { kind: 'stay', start: day + 8.95 * 3600000, end: null, name: 'Neftchilar Avenue 151', placeKind: 'work' }
    ];
    const dist = (m) => (M ? M.fmtDist(m) : (m / 1000).toFixed(1) + ' km');
    const isToday = !back;
    const items = raw.map((it, i) => {
      const last = i === raw.length - 1, first = i === 0;
      const rail = { top: first ? 'transparent' : 'var(--m-line)', bottom: last ? 'transparent' : 'var(--m-line)' };
      if (it.kind === 'stay') {
        const here = isToday && last && !it.end;
        const span = it.start && it.end ? dur(it.end - it.start) : it.start ? (here ? 'Since ' + hm(it.start) + ' · ' + dur(now - it.start) : 'From ' + hm(it.start)) : 'Until ' + hm(it.end);
        const kind = it.placeKind === 'home' ? 'Home' : it.placeKind === 'work' ? 'Work' : '';
        return { ...rail, isStay: true, isTrip: false, time: here ? 'now' : it.start ? hm(it.start) : '0:00', tc: here ? 'var(--m-ink)' : '', railCls: here ? '' : 'stay', dot: here ? 'var(--m-ink)' : '',
          title: it.name, sub: kind && kind !== it.name ? kind + ' · ' + span : span };
      }
      const m = MODES[it.mode] || MODES.walk;
      // A trip is named by where it went: the stays before and after it.
      const from = raw[i - 1] && raw[i - 1].kind === 'stay' ? raw[i - 1].name : '', to = raw[i + 1] && raw[i + 1].kind === 'stay' ? raw[i + 1].name : '';
      const named = (x) => x && x !== 'A stop';
      const title = named(from) && named(to) && from !== to ? from + ' → ' + to : named(to) ? m[0] + ' to ' + to : named(from) ? m[0] + ' from ' + from : m[0];
      const sub = [m[0], dur(Math.min(it.end, now) - it.start), dist(it.distanceM)].concat(it.steps ? [it.steps.toLocaleString('en-US') + ' steps'] : []).concat(it.live ? ['now'] : []).join(' · ');
      return { ...rail, isStay: false, isTrip: true, time: hm(it.start), tc: '', railCls: '', dot: m[1], tint: m[2], title, sub, aria: title + ' at ' + hm(it.start) + ', open details',
        open: () => { window.__motioTrip = it.id; if (this.props.onNav) this.props.onNav('trip'); } };
    });
    const sum = M ? M.summarize(day, day + DAY) : null;
    const go = (d) => {
      const next = Math.max(0, back + d);
      if (next === back) return;
      this.setState({ back: next, moved: true, dir: d > 0 ? 'Prev' : 'Next', flip: !s.flip });
    };
    const stays = raw.filter((x) => x.kind === 'stay').length, trips = raw.filter((x) => x.kind === 'trip').length;
    const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
    return {
      rootAnim: emb ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)',
      LK: { back: lk('back', 'Main.dc.html') },
      dayLabel: !back ? 'Today' : back === 1 ? 'Yesterday' : new Date(day).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) + (new Date(day).getFullYear() !== new Date().getFullYear() ? ' ' + new Date(day).getFullYear() : ''),
      daySummary: trips ? plural(stays, 'place') + ' · ' + plural(trips, 'trip') : '',
      prevDay: () => go(1), nextDay: () => go(-1), atToday: !back, nextOp: back ? 1 : 0.3,
      openMap: () => { window.__motioDay = back || 0; if (this.props.onNav) this.props.onNav('map'); },
      dayAnim: s.moved ? 'motioDay' + (s.dir || 'Next') + (s.flip ? 'A' : 'B') + ' 380ms cubic-bezier(0.22, 1, 0.36, 1)' : 'none',
      mix: sum ? sum.modes.slice(0, 3).map((x) => ({ color: MODES[x.key][1], tint: MODES[x.key][2], v: M.fmtMin(x.ms / 60000) })) : [{ color: 'var(--m-walk)', tint: 'tw', v: '43m' }, { color: 'var(--m-bike)', tint: 'tb', v: '37m' }],
      empty: !items.length, hasItems: !!items.length, items,
      emptyHint: isToday ? 'Your day fills in here as you move.' : 'Go back another day, or open the map.'
    };
  }
}
</script>
</body>
</html>
