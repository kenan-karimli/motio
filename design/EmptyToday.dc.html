<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · No moves yet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
a{color:inherit}
button{font:inherit;cursor:pointer}
button,a{transition:transform 140ms cubic-bezier(0.22,1,0.36,1),background-color 200ms ease}
button:active,a:active{transform:scale(0.96)}
</style>
</helmet>
<div class="m-page" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden">
  <div class="scr nt">
    <div class="head m-in" style="--i: 0">
      <div class="t"><span class="m-sub">{{ greetLine }}</span><h1 class="m-title">today.</h1></div>
      <sc-if value="{{ emb }}" hint-placeholder-val="{{ false }}"><button type="button" class="m-icon" onClick="{{ back }}" aria-label="Close preview"><m-ic n="x"></m-ic></button></sc-if>
      <button type="button" class="m-icon ink" onClick="{{ start }}" aria-label="Start a workout"><m-ic n="play" s="15"></m-ic></button>
    </div>
    <div class="m-in" style="--i: 1; height: 70px; position: relative; margin-bottom: -22px; z-index: 1; display: flex; justify-content: flex-end; align-items: flex-end; padding-right: 22px"><tuli-fox pose="rest" size="150" say="Five more minutes…" say-r=""></tuli-fox></div>
    <div class="m-card m-in" style="--i: 2; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 28px 24px">
      <p class="m-say" style="margin: 0; font-size: 22px">No moves yet. Your day starts with <b>the first step</b>.</p>
      <span class="m-sub" style="text-align: center">Motio is listening. Trips appear here as you go.</span>
      <button type="button" class="m-btn m-late" onClick="{{ startWalk }}">Start a walk</button>
    </div>
    <div class="m-card m-in" style="--i: 3; display: flex; align-items: center; gap: 14px; padding: 14px 16px">
      <svg aria-hidden="true" width="44" height="44" viewBox="0 0 56 56" style="transform: rotate(-90deg)"><circle cx="28" cy="28" r="22" fill="none" stroke="var(--m-soft)" stroke-width="7"></circle><circle cx="28" cy="28" r="22" fill="none" stroke="var(--m-goal)" stroke-width="7" stroke-linecap="round" stroke-dasharray="{{ ringDash }}"></circle></svg>
      <span style="flex: 1"><b style="font-size: 15px">{{ goalLine }}</b><div class="m-sub" style="font-size: 12px">{{ streakLine }}</div></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // What Today looks like before the first move of the day, with your real goal and streak.
  renderVals() {
    const M = window.Motio;
    const go = (t) => this.props.onNav && this.props.onNav(t);
    const g = M ? M.goals() : { goal: 60, todayMin: 0, active: 12 };
    const user = M && M.auth && M.auth.user ? M.auth.user() : null;
    const first = ((user && user.name) || 'Alex').split(' ')[0];
    const now = new Date(), h = now.getHours();
    const greet = h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 18 ? 'Hello' : 'Good evening';
    const C = 2 * Math.PI * 22, pct = Math.min(1, (g.todayMin || 0) / Math.max(1, g.goal));
    // The streak counts yesterday until you move today.
    const streak = g.active || 0;
    return {
      emb: !!this.props.embedded,
      back: () => go('back'),
      greetLine: greet + ', ' + first + ' · ' + now.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }),
      goalLine: Math.round(g.todayMin || 0) + ' of ' + g.goal + ' min',
      streakLine: streak > 1 ? 'Streak: ' + streak + ' days. Keep it going.' : streak === 1 ? 'You moved yesterday. Make it two.' : 'Move a little today to start a streak.',
      ringDash: (C * pct).toFixed(1) + ' ' + C.toFixed(1),
      start: () => go('live'),
      startWalk: () => { if (M) M.setSetting('lastWorkout', 'walk'); go('live'); }
    };
  }
}
</script>
</body>
</html>
