<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Page not found</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
a{color:inherit}
a{transition:transform 140ms cubic-bezier(0.22,1,0.36,1)}
a:active{transform:scale(0.96)}
@keyframes motioRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes motioLook{0%,40%,100%{transform:rotate(0)}50%,85%{transform:scaleX(-1)}}
@keyframes motioWalkLost{0%,100%{transform:translateX(0)}50%{transform:translateX(-26px)}}
@keyframes motioQ{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-6px);opacity:0.6}}
</style>
</helmet>
<div class="m-page" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 70px 32px 190px; text-align: center">
  <m-art name="sign" size="210"></m-art>
<h1 class="m-title m-in" style="font-size: 32px; --i: 1">this page wandered off.</h1><span class="m-sub m-in" style="--i: 2; max-width: 300px">The link may be old, or the trip it pointed to was deleted. Even Wanderers take a wrong turn sometimes.</span>
  <div style="position: absolute; left: 22px; right: 22px; bottom: 34px; display: flex; flex-direction: column; gap: 10px">
<a class="m-btn wide" href="{{ LK.home.href }}" onClick="{{ LK.home.go }}" style="text-decoration: none">Take me back to Today</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) return;
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    return { foxRef: window.MotioMascot ? window.MotioMascot.fox('curious', 150) : null, LK: { home: lk('home', 'Main.dc.html') } };
  }
}
</script>
</body>
</html>
