<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motio · Help &amp; feedback</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
html,body{background:#ECECEA}
a{color:inherit}
button,input,textarea{font:inherit}
button{cursor:pointer}
button,a{transition:transform 140ms cubic-bezier(0.22,1,0.36,1),background-color 200ms ease,color 200ms ease}
button:active,a:active{transform:scale(0.96)}
input:focus,textarea:focus{outline:none;border-color:#5B4FE0 !important}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioPop{0%{transform:scale(0.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes motioRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes motioToast{0%{opacity:0;transform:translate(-50%,16px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
@keyframes motioLeaveRight{from{transform:translateX(0)}to{transform:translateX(100%)}}
@keyframes motioLeaveDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes motioReturn{from{transform:translateX(-72px);opacity:0.4}to{transform:translateX(0);opacity:1}}
@keyframes motioReturnScale{from{transform:scale(0.94);opacity:0.5}to{transform:scale(1);opacity:1}}
@keyframes motioPageIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes motioStoryIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes motioSoftIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioSoftBackIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
@keyframes motioSoftUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes motioSoftOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(24px)}}
@keyframes motioSoftDown{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(28px)}}
</style>
</helmet>
<div class="m-page" style="animation: {{ rootAnim }}; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 10px 20px 0">
  <div class="m-topbar"><a class="m-icon" href="{{ LK.back.href }}" onClick="{{ LK.back.go }}" aria-label="Back"><m-ic n="back"></m-ic></a><span class="m-tt">Help</span><span style="width: 44px"></span></div>
  <div class="motio-scroll" style="flex: 1; min-height: 0; overflow-y: auto; margin: -10px -20px 0; padding: 70px 20px 40px; display: flex; flex-direction: column; gap: 10px">
    <div class="head"><div class="t"><h1 class="m-title">help.</h1></div></div>
    <label class="input m-in" style="cursor: text"><m-ic n="search" s="18"></m-ic><input value="{{ query }}" onInput="{{ onQuery }}" placeholder="Search help" aria-label="Search help" style="flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: inherit; font: 500 15px var(--m-font)"></label>

    <div class="m-card m-in" style="--i: 1; display: flex; flex-direction: column; gap: 2px; padding: 8px">
      <sc-for list="{{ faqs }}" as="q" hint-placeholder-count="4">
        <div>
          <button type="button" class="m-row" aria-expanded="{{ q.open }}" onClick="{{ q.toggle }}" style="width: 100%; background: transparent; border: 0; color: inherit; text-align: left"><span style="flex: 1; font-size: 14px; font-weight: 600">{{ q.title }}</span><span style="display: inline-flex; transform: rotate({{ q.rot }}); transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1)"><m-ic n="chev" s="16"></m-ic></span></button>
          <div style="display: grid; grid-template-rows: {{ q.rows }}; transition: grid-template-rows 360ms cubic-bezier(0.22, 1, 0.36, 1)"><div style="overflow: hidden"><p class="m-sub" style="margin: 0; padding: 0 14px 12px; font-size: 13px">{{ q.body }}</p></div></div>
        </div>
      </sc-for>
      <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}"><span class="m-sub" style="padding: 12px 14px">Nothing matches “{{ query }}”. Ask us below and we’ll get back to you.</span></sc-if>
    </div>

    <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
      <div class="m-card m-in" style="--i: 2; display: flex; flex-direction: column; gap: 14px; padding: 18px">
        <span class="m-h3">How is Motio 5.0 for you?</span>
        <div role="radiogroup" aria-label="Rate Motio from 1 to 5" style="display: flex; justify-content: space-between"><sc-for list="{{ faces }}" as="f" hint-placeholder-count="5"><button type="button" role="radio" class="m-face {{ f.cls }}" aria-checked="{{ f.on }}" aria-label="{{ f.n }} out of 5" onClick="{{ f.pick }}" style="background: {{ f.bg }}; font: 600 16px var(--m-font)">{{ f.n }}</button></sc-for></div>
        <textarea rows="3" value="{{ message }}" onInput="{{ onMessage }}" placeholder="What would make it better?" aria-label="What would make it better?" class="input" style="height: 84px; padding-top: 14px; border: 0; outline: 0; resize: none; background: var(--m-soft); font: 500 15px var(--m-font)"></textarea>
        <button type="button" class="m-btn wide" onClick="{{ send }}" aria-disabled="{{ cantSend }}" style="opacity: {{ sendOp }}">{{ sendLabel }}</button>
      </div>
    </sc-if>
    <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
      <div class="m-card" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px; text-align: center">
        <span class="m-pop"><tuli-fox pose="cheer" size="90"></tuli-fox></span>
        <p class="m-say m-in" style="margin: 0; font-size: 18px">Thanks, it’s <b>on its way</b>.</p>
        <span class="m-sub">We usually reply within two days.</span>
        <button type="button" class="m-chip m-late" onClick="{{ again }}" style="margin-top: 4px; background: var(--m-soft)">Send another</button>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 50%; bottom: 40px; z-index: 50; padding: 12px 18px; border-radius: 18px; background: var(--m-ink); color: var(--m-bg-hi); font: 600 13px var(--m-font); white-space: nowrap; box-shadow: 0 10px 24px rgba(0,0,0,0.18); animation: motioToast 2300ms ease forwards">{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // Standalone artboards: remember which way we are going, and play this page's exit before the canvas jumps.
  dirGet() {
    let d = null;
    try { d = window.localStorage.getItem('motio.dir'); } catch (e) { /* blocked */ }
    if (d === null) { try { d = window.sessionStorage.getItem('motio.dir'); } catch (e) { /* blocked */ } }
    if (d === null) { try { d = window.top.__motioDir; } catch (e) { /* cross-origin */ } }
    if (d == null) d = window.__motioDir;
    return d || null;
  }
  dirSet(v) {
    try { window.localStorage.setItem('motio.dir', v); } catch (e) { /* blocked */ }
    try { window.sessionStorage.setItem('motio.dir', v); } catch (e) { /* blocked */ }
    try { window.top.__motioDir = v; } catch (e) { /* cross-origin */ }
    window.__motioDir = v;
  }
  standaloneNav(e, target) {
    if (target !== 'back' || this.navNow) { this.navNow = false; if (target !== 'back') this.dirSet('forward'); return; }
    const el = e && e.currentTarget;
    if (!el) return;
    e.preventDefault();
    this.dirSet('back');
    this.setState({ leaving: true });
    setTimeout(() => { this.navNow = true; el.click(); }, 200);
  }
  showToast(msg) {
    clearTimeout(this.toastTimer);
    this.setState({ toast: null });
    setTimeout(() => this.setState({ toast: msg }), 30);
    this.toastTimer = setTimeout(() => this.setState({ toast: null }), 2330);
  }
  renderVals() {
    if (this.entryAnim === undefined) {
      const d = this.props.embedded ? null : this.dirGet();
      if (d) this.dirSet('');
      // Standalone artboards can't show the previous page underneath, so they use short in-place fades;
      // inside the App prototype the full slides play over the real page behind.
      this.entryAnim = this.props.embedded ? 'motioPageIn 420ms cubic-bezier(0.22, 1, 0.36, 1)' : d === 'back' ? 'motioSoftBackIn 300ms cubic-bezier(0.22, 1, 0.36, 1)' : 'motioSoftIn 300ms cubic-bezier(0.22, 1, 0.36, 1)';
    }
    const emb = !!this.props.embedded;
    const lk = (target, file) => ({ href: emb ? '#' : file, go: (e) => {
      if (!emb) { this.standaloneNav(e, target); return; }
      if (e && e.preventDefault) e.preventDefault();
      if (this.props.onNav) this.props.onNav(target);
    } });
    const s = this.state || {};
    const query = s.query || '';
    const openId = s.open ?? null;
    const all = [
      ['A trip is missing', 'Motio needs location “all the time”, physical activity, and room to run in the background. Open Settings › Tracking health check: it shows what’s off and fixes it in one tap.'],
      ['Bus shows up as driving', 'Buses and cars move alike. Tap the trip and change its mode: Motio learns your bus lines and gets them right next time.'],
      ['How does Motio know if I’m walking or driving?', 'Your phone’s motion sensors and speed tell us how you’re moving. Walking and running have a rhythm, cycling is smooth and steady, and driving is fast with stops. You can fix any trip by tapping it.'],
      ['Does tracking drain my battery?', 'Very little. With location set to “While moving”, GPS only turns on when you’re actually going somewhere. Most people see under 4% a day.'],
      ['Why are my steps different from my watch?', 'Watches and phones count from different places on your body. If you connect a watch app in Connected apps, Motio uses its steps instead.'],
      ['When does my weekly recap arrive?', 'Every Sunday at 9 AM. The monthly recap arrives on the 1st. You can change the recap style in Settings.'],
      ['How do I export or delete my data?', 'Go to Settings › Export data for a GPX, CSV or JSON file. To delete your history, go to Settings › Privacy; to delete your account, use Delete account at the bottom of Settings.']
    ];
    const q = query.trim().toLowerCase();
    const faqs = all
      .map(([title, body], id) => ({ id, title, body }))
      .filter((f) => !q || (f.title + ' ' + f.body).toLowerCase().includes(q))
      .map((f) => {
        const open = openId === f.id;
        return { ...f, open, rot: open ? '180deg' : '0deg', rows: open ? '1fr' : '0fr', toggle: () => this.setState({ open: open ? null : f.id }) };
      });
    const rate = s.rate || 0;
    const kind = rate >= 5 ? 'love' : rate && rate <= 2 ? 'bug' : 'idea';
    const message = s.message || '';
    const cantSend = message.trim().length < 3;
    return {
      rootAnim: this.state && this.state.leaving ? 'motioSoftOut 200ms ease-in forwards' : this.entryAnim,
      emb, LK: { back: lk('back', 'Settings.dc.html') },
      query, onQuery: (e) => this.setState({ query: e.target.value }),
      faqs, noResults: faqs.length === 0,
      faces: [1, 2, 3, 4, 5].map((n) => ({ n, on: rate === n, cls: rate === n ? 'on' : '', bg: rate === n ? '' : 'var(--m-soft)', pick: () => this.setState({ rate: n }) })),
      sendOp: cantSend ? 0.4 : 1, sendLabel: s.busy ? 'Sending…' : 'Send feedback',
      message, onMessage: (e) => this.setState({ message: e.target.value }),
      cantSend: cantSend ? 'true' : 'false',
      sendBg: cantSend ? '#9A97B5' : '#1F1D47',
      send: () => {
        if (cantSend) { this.showToast('Write a few words first'); return; }
        if (!window.Motio) { this.setState({ sent: true, message: '' }); return; }
        if (s.busy) return;
        this.setState({ busy: true });
        window.Motio.sendFeedback(kind, (rate ? 'Rating ' + rate + '/5. ' : '') + message).then(() => this.setState({ sent: true, busy: false, message: '', rate: 0 }))
          .catch((e) => this.setState({ busy: false }) || this.showToast(e.code === 'offline' ? 'You’re offline. Try again when connected' : 'Couldn’t send. Try again'));
      },
      sent: !!s.sent, notSent: !s.sent,
      again: () => this.setState({ sent: false }),
      hasToast: !!s.toast, toast: s.toast || ''
    };
  }
}
</script>
</body>
</html>
