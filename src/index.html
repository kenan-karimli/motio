<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ECECEA">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">
<title>Motio</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="leaflet.css">
<style>
html,body{margin:0;height:100%;background:#ECECEA;overflow:hidden;overscroll-behavior:none}
*{-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
body{-webkit-user-select:none;user-select:none;font-family:'Inter Tight',system-ui,sans-serif}
input,textarea{-webkit-user-select:text;user-select:text}
#frame{position:fixed;inset:0;box-sizing:border-box;
  padding-top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));
  padding-bottom:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
#viewport{position:relative;width:100%;height:100%;overflow:hidden}
#bar-top,#bar-bot{position:fixed;left:0;right:0;background:#ECECEA;transition:background-color 220ms ease;pointer-events:none}
#bar-top{top:0;height:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px))}
#bar-bot{bottom:0;height:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
#app{position:absolute;left:0;top:0;width:390px;transform-origin:0 0}
/* touch-action resets at every scroll container, so vertical scrollers must say pan-y themselves or Android
   swallows sideways swipes meant for the tab pager. Sideways carousels keep their own horizontal scrolling. */
#app [style*="overflow-y: auto"],#app .motio-scroll{touch-action:pan-y}
#app [style*="overflow-x: auto"]{touch-action:pan-x pan-y}
#app.has-sheet nav[aria-label=Main]{opacity:0 !important;transform:translateY(24px) !important;pointer-events:none !important}
/* Press feedback for every button and link: a quick, small press-down so each tap clearly registers. */
#app button:active:not(:disabled),#app a:active,#app [role=button]:active{scale:.965;filter:brightness(.94)}
#app nav[aria-label=Main] button:active{scale:.92}
/* Pages that slide in arrive fully drawn: small entrance effects inside them would make the phone repaint the
   whole sliding page every frame, which is what made opening Personality, Settings and others stutter. */
[data-kind=push] [style*="animation: motioRise"],[data-kind=push] [style*="animation: motioRowIn"],[data-kind=push] [style*="animation: motioGrow"],[data-kind=push] [style*="animation: motioFillX"],[data-kind=push] [style*="animation: motioCardIn"],[data-kind=push] [style*="animation: motioCardUp"],[data-kind=push] [style*="animation: motioListIn"],[data-kind=push] [style*="animation: motioPopIn"],[data-kind=push] [style*="animation: motioCoverIn"],[data-kind=push] [style*="animation: motioSoftIn"]{animation:none !important}
.motio-hold{animation-play-state:paused !important}
.dc-root{width:100% !important;height:100% !important;box-sizing:border-box !important}
/* Opening: Tuli springs up onto the page, flicks an ear, then "motio." slides in beside him, and it all lifts away. */
#intro{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 70% at 85% 4%,#FFFFFF 0,#ECECEA 46%,#DCDCDA 100%);display:flex;align-items:center;justify-content:center;transition:opacity 360ms ease,transform 460ms cubic-bezier(0.22,1,0.36,1)}
#intro.out{opacity:0;transform:scale(1.03);pointer-events:none}
#intro .fox{transform-origin:50% 100%;animation:introFox 900ms cubic-bezier(.34,1.3,.64,1) 80ms backwards}
#intro .ear{transform-box:fill-box;transform-origin:50% 100%;animation:introEar 600ms ease-in-out 900ms}
#intro .shadow{transform-origin:center;animation:introShadow 900ms cubic-bezier(.34,1.3,.64,1) 80ms backwards}
#intro .word{opacity:0;transform:translateX(-12px);animation:introWord 520ms cubic-bezier(0.22,1,0.36,1) 620ms forwards}
@keyframes introFox{0%{opacity:0;transform:translateY(26px) scale(.86,.9)}45%{opacity:1;transform:translateY(-10px) scale(.95,1.06)}70%{transform:translateY(0) scale(1.05,.95)}100%{transform:none}}
@keyframes introShadow{0%{opacity:0;transform:scaleX(.4)}100%{opacity:.12;transform:none}}
@keyframes introEar{0%,100%{transform:none}40%{transform:rotate(-16deg)}70%{transform:rotate(5deg)}}
@keyframes introWord{to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){#intro *{animation:none!important;opacity:1!important;transform:none!important}}
.motio-rv{opacity:0;transform:translateY(22px) scale(.98)}
.motio-rv.motio-in{opacity:1;transform:none;transition:opacity 620ms cubic-bezier(.22,1,.36,1),transform 620ms cubic-bezier(.22,1,.36,1)}
@media (prefers-reduced-motion: reduce){.motio-rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="bar-top"></div><div id="bar-bot"></div>
<div id="intro" aria-hidden="true"><div style="display:flex;align-items:flex-end;gap:14px">
  <svg width="78" height="90" viewBox="28 6 96 110" style="overflow:visible"><ellipse class="shadow" cx="66" cy="111" rx="38" ry="3" fill="#0F0F0F" opacity=".12"/><g class="fox">
   <path d="M82 104C104 106 117 92 110 70C106 84 96 92 82 94Z" fill="#0F0F0F"/><path d="M110 70C115 79 114 88 108 95C105 86 105 78 110 70Z" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.6" stroke-linejoin="round"/>
   <path d="M44 109C40 86 44 66 58 58C66 54 76 58 80 68C86 82 86 98 82 109Z" fill="#0F0F0F"/><path d="M58 62C55 75 58 87 64 93C66 80 68 68 70 62Z" fill="#FFFFFF"/><path d="M60 109V94M72 109V94" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
   <path class="ear" d="M58 38L61 18L70 32Z" fill="#0F0F0F"/><path d="M67 33L75 19L78 37Z" fill="#0F0F0F"/>
   <path d="M52 61C48 49 52 39 60 35L69 31L77 36C85 40 93 44 99 50C93 55 85 57 77 57C71 63 61 65 52 61Z" fill="#0F0F0F"/><circle cx="74" cy="44" r="2.6" fill="#FFFFFF"/><circle cx="99" cy="50" r="2.2" fill="#0F0F0F"/></g></svg>
  <span class="word" style="color:#0F0F0F;font:600 44px/1 'Inter Tight',system-ui,sans-serif;letter-spacing:-1.6px;margin-bottom:6px">motio.</span>
</div></div>
<div id="frame"><div id="viewport"><div id="app"></div></div></div>
<script src="dc-sources.js"></script>
<script src="app.js"></script>
</body>
</html>
